```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT GC AGT - Motor Transport Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- jsPDF & AutoTable CDN for PDF Export & Sharing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                            dark: '#0a192f',
                            accent: '#f59e0b',
                            gold: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pulse-subtle {
            animation: pulseSubtle 2.5s infinite;
        }
        @keyframes pulseSubtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }
        .tab-active {
            color: #38bdf8 !important;
            font-weight: 700;
        }
        .tab-active i {
            transform: translateY(-2px);
            color: #38bdf8 !important;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white pb-20">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full px-4 pointer-events-none"></div>

    <!-- Top App Bar Header -->
    <header class="bg-slate-950/95 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Vehicle App Icon -->
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 via-blue-600 to-indigo-700 flex items-center justify-center text-white shadow-lg shadow-sky-600/30 text-lg border border-sky-400/30">
                    <i class="fa-solid fa-truck-front pulse-subtle"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-black text-base md:text-lg tracking-wide text-white flex items-center gap-1.5">
                            MT GC AGT
                            <span class="text-[10px] text-sky-400 font-mono font-semibold bg-sky-950/80 px-2 py-0.5 rounded-full border border-sky-800">FLEET</span>
                        </h1>
                        <span id="header-role-badge" class="px-2 py-0.5 text-[10px] rounded-full font-bold uppercase bg-amber-500 text-slate-950">Guest</span>
                    </div>
                    <p class="text-[10px] text-slate-400">CRPF Agartala Motor Transport Fleet System</p>
                </div>
            </div>

            <!-- Top Action Controls -->
            <div class="flex items-center space-x-2">
                <!-- Global PDF Quick Export -->
                <button onclick="exportComprehensiveReportPDF()" title="Export & Share Full PDF Report" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 hover:border-rose-500/50 transition flex items-center gap-1.5 text-xs font-semibold">
                    <i class="fa-solid fa-file-pdf text-sm"></i>
                    <span class="hidden sm:inline">PDF Report</span>
                </button>

                <!-- Auth Trigger -->
                <div id="user-profile-btn-container">
                    <button onclick="openLoginModal()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-sky-600/20 transition">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Login</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Live Flash Broadcast Banner (Instant sync indicator) -->
        <div id="broadcast-bar" class="hidden bg-gradient-to-r from-sky-600 to-indigo-600 text-white text-xs px-4 py-1.5 font-medium flex items-center justify-between">
            <div class="flex items-center gap-2 truncate">
                <i class="fa-solid fa-bullhorn text-amber-300 animate-bounce"></i>
                <span id="broadcast-text" class="truncate font-semibold">New update published.</span>
            </div>
            <button onclick="dismissBroadcast()" class="text-white hover:text-amber-200 font-bold ml-2">✕</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full px-3 pt-3 flex-1">

        <!-- 1. DASHBOARD VIEW -->
        <section id="view-dashboard" class="space-y-4">
            
            <!-- Quick Summary Counters -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                
                <!-- Vehicles Summary Box -->
                <div onclick="switchTab('vehicles'); filterVehicles('ALL')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 hover:border-sky-500/50 p-3.5 rounded-2xl shadow-sm cursor-pointer transition active:scale-[0.98]">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold text-slate-400">Total Vehicles</p>
                            <h3 id="stat-total-veh" class="text-2xl font-black text-white mt-0.5">38</h3>
                        </div>
                        <span class="p-2.5 bg-sky-950/80 text-sky-400 rounded-xl border border-sky-800/50">
                            <i class="fa-solid fa-car-rear text-base"></i>
                        </span>
                    </div>
                    <div class="mt-2.5 flex items-center gap-1.5 text-[11px]">
                        <span class="text-emerald-400 font-bold" id="stat-veh-duty">0 On Duty</span>
                        <span class="text-slate-500">•</span>
                        <span class="text-rose-400 font-bold" id="stat-veh-offroad">0 Off Road</span>
                    </div>
                </div>

                <!-- Vehicles Status Breakdown Card -->
                <div class="bg-slate-800/80 border border-slate-700/80 p-3.5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400">Vehicle Fleet Status</p>
                    <div class="mt-2 grid grid-cols-2 gap-1.5 text-[11px]">
                        <div class="bg-emerald-950/60 text-emerald-300 border border-emerald-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>On Duty:</span>
                            <strong id="stat-veh-on-duty">0</strong>
                        </div>
                        <div class="bg-rose-950/60 text-rose-300 border border-rose-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>Off Road:</span>
                            <strong id="stat-veh-off-road">3</strong>
                        </div>
                        <div class="bg-amber-950/60 text-amber-300 border border-amber-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>Under CVP:</span>
                            <strong id="stat-veh-cvp">1</strong>
                        </div>
                        <div class="bg-purple-950/60 text-purple-300 border border-purple-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>Attached Out:</span>
                            <strong id="stat-veh-attached-out">1</strong>
                        </div>
                    </div>
                </div>

                <!-- Personnel Summary Box -->
                <div onclick="switchTab('personnel'); filterPersonnel('ALL')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 hover:border-emerald-500/50 p-3.5 rounded-2xl shadow-sm cursor-pointer transition active:scale-[0.98]">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold text-slate-400">Total Personnel</p>
                            <h3 id="stat-total-prs" class="text-2xl font-black text-white mt-0.5">48</h3>
                        </div>
                        <span class="p-2.5 bg-emerald-950/80 text-emerald-400 rounded-xl border border-emerald-800/50">
                            <i class="fa-solid fa-users text-base"></i>
                        </span>
                    </div>
                    <div class="mt-2.5 flex items-center gap-1.5 text-[11px]">
                        <span class="text-emerald-400 font-bold" id="stat-prs-present">41 Present</span>
                        <span class="text-slate-500">•</span>
                        <span class="text-amber-400 font-bold" id="stat-prs-leave">5 Leave</span>
                    </div>
                </div>

                <!-- Personnel Status Breakdown Card -->
                <div class="bg-slate-800/80 border border-slate-700/80 p-3.5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400">Personnel Status</p>
                    <div class="mt-2 grid grid-cols-2 gap-1.5 text-[11px]">
                        <div class="bg-emerald-950/60 text-emerald-300 border border-emerald-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>Present:</span>
                            <strong id="stat-prs-present-count">41</strong>
                        </div>
                        <div class="bg-amber-950/60 text-amber-300 border border-amber-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>On Leave:</span>
                            <strong id="stat-prs-leave-count">5</strong>
                        </div>
                        <div class="bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>Course:</span>
                            <strong id="stat-prs-course-count">2</strong>
                        </div>
                        <div class="bg-purple-950/60 text-purple-300 border border-purple-800/40 p-1.5 rounded-lg flex justify-between font-medium">
                            <span>Attached:</span>
                            <strong id="stat-prs-attached-count">1</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Action Hub -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button onclick="switchTab('inout')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-2xl flex items-center gap-3 active:scale-95 transition">
                    <div class="w-9 h-9 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-sm border border-sky-500/20">
                        <i class="fa-solid fa-right-left"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-xs font-bold text-white block">Vehicle In/Out</span>
                        <span class="text-[10px] text-slate-400">Gate Logbook</span>
                    </div>
                </button>

                <button onclick="switchTab('duty')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-2xl flex items-center gap-3 active:scale-95 transition">
                    <div class="w-9 h-9 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-sm border border-amber-500/20">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-xs font-bold text-white block">Duty Roster</span>
                        <span class="text-[10px] text-slate-400">Pol Guard & MT Park</span>
                    </div>
                </button>

                <button onclick="switchTab('directory')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-2xl flex items-center gap-3 active:scale-95 transition">
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-sm border border-emerald-500/20">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-xs font-bold text-white block">Direct Calls</span>
                        <span class="text-[10px] text-slate-400">48 Personnel</span>
                    </div>
                </button>

                <button onclick="switchTab('attachments')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-2xl flex items-center gap-3 active:scale-95 transition">
                    <div class="w-9 h-9 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-sm border border-purple-500/20">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-xs font-bold text-white block">Attachments</span>
                        <span class="text-[10px] text-slate-400">In / Out of GC AGT</span>
                    </div>
                </button>
            </div>

            <!-- Two Column Split View: Live Active Vehicles & Today's Duty Summary -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                
                <!-- Active Vehicles Out Box -->
                <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-700/80 pb-2.5">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                            <h2 class="font-bold text-white text-sm">Vehicles Currently Out (Live)</h2>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="exportLogsPDF()" class="text-[11px] text-rose-400 hover:text-rose-300 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-file-pdf"></i> PDF
                            </button>
                            <span class="text-slate-600">|</span>
                            <button onclick="switchTab('inout')" class="text-[11px] text-sky-400 hover:text-sky-300 font-semibold">View All &rarr;</button>
                        </div>
                    </div>
                    <div id="dashboard-live-out-list" class="space-y-2">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Duty Highlight Summary -->
                <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-700/80 pb-2.5">
                        <h2 class="font-bold text-white text-sm flex items-center gap-2">
                            <i class="fa-solid fa-calendar-check text-amber-400"></i> Active Duty Assignments
                        </h2>
                        <div class="flex items-center gap-2">
                            <button onclick="exportDutyRosterPDF()" class="text-[11px] text-rose-400 hover:text-rose-300 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-file-pdf"></i> PDF
                            </button>
                            <span class="text-slate-600">|</span>
                            <button onclick="switchTab('duty')" class="text-[11px] text-sky-400 hover:text-sky-300 font-semibold">Edit Roster &rarr;</button>
                        </div>
                    </div>
                    
                    <div class="space-y-2.5">
                        <!-- Pol Guard Roster Preview -->
                        <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-sky-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-tower-observation text-sky-400"></i> Pol Guard Duty (1 HC + 4 CT)
                                </span>
                                <span class="text-[10px] bg-sky-950 text-sky-300 border border-sky-800 px-2 py-0.5 rounded-full font-semibold">No Time Specified</span>
                            </div>
                            <div id="dash-pol-guard-names" class="text-xs text-slate-300 leading-relaxed">
                                Loading...
                            </div>
                        </div>

                        <!-- MT Park Roster Preview -->
                        <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-amber-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-square-parking text-amber-400"></i> MT Park Duty (1 HC + 1 CT)
                                </span>
                                <span class="text-[10px] bg-amber-950 text-amber-300 border border-amber-800 px-2 py-0.5 rounded-full font-semibold">No Time Specified</span>
                            </div>
                            <div id="dash-mt-park-names" class="text-xs text-slate-300 leading-relaxed">
                                Loading...
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- External & Internal Attachment Brief -->
            <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border border-indigo-800/40 p-4 rounded-2xl shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-xs sm:text-sm text-white flex items-center gap-2">
                        <i class="fa-solid fa-shuffle text-indigo-400"></i> GC AGT Attachment Summary (External & Internal)
                    </h3>
                    <button onclick="switchTab('attachments')" class="text-xs text-indigo-300 hover:text-white underline font-semibold">Manage</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs mt-3">
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-indigo-700/30">
                        <span class="font-bold text-indigo-300">Attached Out Vehicles:</span>
                        <p class="mt-1 text-slate-300" id="dash-attach-veh-summary">TR01 G 0986 (Tractor) - Attached with M&N Sector</p>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-indigo-700/30">
                        <span class="font-bold text-indigo-300">Attached Personnel:</span>
                        <p class="mt-1 text-slate-300" id="dash-attach-prs-summary">1 personnel attached out of GC AGT</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. VEHICLES VIEW -->
        <section id="view-vehicles" class="hidden space-y-3">
            <!-- Search, PDF Export & Admin Add Bar -->
            <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 space-y-2.5">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                    <div class="relative w-full sm:flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input type="text" id="veh-search-input" onkeyup="renderVehiclesList()" placeholder="Search vehicle reg no, type, in-charge (e.g. 5372, Safari)..." 
                               class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl pl-8 pr-3 py-2 text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button onclick="exportVehiclesPDF()" class="bg-slate-700 hover:bg-slate-600 text-rose-300 border border-slate-600 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>Export PDF</span>
                        </button>
                        <button id="btn-admin-add-veh" onclick="openAddVehicleModal()" class="hidden bg-sky-600 hover:bg-sky-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-sky-600/30 transition">
                            <i class="fa-solid fa-plus"></i>
                            <span>Add Vehicle</span>
                        </button>
                    </div>
                </div>

                <!-- Status Filter Pills -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs hide-scrollbar">
                    <button onclick="filterVehicles('ALL')" class="veh-filter-btn px-3 py-1.5 rounded-xl bg-sky-600 text-white font-semibold shrink-0" data-filter="ALL">All (38)</button>
                    <button onclick="filterVehicles('AVAILABLE')" class="veh-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="AVAILABLE">Available (MT Park)</button>
                    <button onclick="filterVehicles('ON_DUTY')" class="veh-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="ON_DUTY">On Duty (Out)</button>
                    <button onclick="filterVehicles('OFF_ROAD')" class="veh-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="OFF_ROAD">Off Road</button>
                    <button onclick="filterVehicles('UNDER_CVP')" class="veh-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="UNDER_CVP">Under CVP</button>
                    <button onclick="filterVehicles('ATTACHED_OUT')" class="veh-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="ATTACHED_OUT">Attached Out</button>
                </div>
            </div>

            <!-- Vehicle Cards Grid -->
            <div id="vehicles-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Vehicle cards populated dynamically -->
            </div>
        </section>

        <!-- 3. PERSONNEL VIEW -->
        <section id="view-personnel" class="hidden space-y-3">
            <!-- Filter, Search, PDF & Admin Add -->
            <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 space-y-2.5">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
                    <div class="relative w-full sm:flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input type="text" id="prs-search-input" onkeyup="renderPersonnelList()" placeholder="Search force no, name or rank (e.g. 900440064, Rizwan)..." 
                               class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl pl-8 pr-3 py-2 text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button onclick="exportPersonnelPDF()" class="bg-slate-700 hover:bg-slate-600 text-rose-300 border border-slate-600 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>Export PDF</span>
                        </button>
                        <button id="btn-admin-add-prs" onclick="openAddPersonnelModal()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-emerald-600/30 transition">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Add Personnel</span>
                        </button>
                    </div>
                </div>

                <!-- Cadre Filters -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs hide-scrollbar">
                    <button onclick="filterPersonnel('ALL')" class="prs-filter-btn px-3 py-1.5 rounded-xl bg-sky-600 text-white font-semibold shrink-0" data-filter="ALL">All (48)</button>
                    <button onclick="filterPersonnel('SO')" class="prs-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="SO">SO's Cadre (3)</button>
                    <button onclick="filterPersonnel('HC_DVR')" class="prs-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0" data-filter="HC_DVR">HC/DVR (20)</button>
