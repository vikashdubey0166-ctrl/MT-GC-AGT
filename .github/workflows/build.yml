            void _editStaffDialog(BuildContext ctx, Map<String, dynamic> staff, VoidCallback onDone) {
              final statusCtrl = TextEditingController(text: staff['status']);
              final locCtrl = TextEditingController(text: staff['location']);

              showDialog(
                context: ctx,
                builder: (dCtx) => AlertDialog(
                  title: Text('${staff['rank']} ${staff['name']} स्थिति बदलें'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      DropdownButtonFormField<String>(
                        value: staff['status'],
                        decoration: const InputDecoration(labelText: 'परेड ड्यूटी स्थिति'),
                        items: [
                          'PRESENT', 'POL_GUARD', 'MT_GUARD', 'DIGP_DVR', 'AMBULANCE_DVR',
                          'SCHOOL_BUS', 'WATER_TRUCK', 'TRACTOR_DVR', 'JCB_DVR', 'DR_DUTY_DVR',
                          'EL', 'CL', 'ATTACHED_IGP', 'BMI_COURSE', 'ASI_MT_COURSE', 'WORKSHOP'
                        ].map((st) => DropdownMenuItem(value: st, child: Text(st, style: const TextStyle(fontSize: 12)))).toList(),
                        onChanged: (val) => staff['status'] = val!,
                      ),
                      TextField(controller: locCtrl, decoration: const InputDecoration(labelText: 'लोकेशन')),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        staff['location'] = locCtrl.text.trim();
                        await MTStorage.saveData();
                        Navigator.pop(dCtx);
                        onDone();
                      },
                      child: const Text('सुरक्षित करें'),
                    ),
                  ],
                ),
              );
            }
          }

          // ================= CRPF AGARTALA OFFICIAL PARADE STATEMENT GRID =================
          class OfficialParadeGridScreen extends StatelessWidget {
            const OfficialParadeGridScreen({Key? key}) : super(key: key);

            int _countRankStatus(String rank, String status) {
              return MTStorage.staffList.where((s) {
                bool rankMatch = s['rank'].toString().toUpperCase().contains(rank);
                bool statusMatch = s['status'].toString().toUpperCase() == status;
                return rankMatch && statusMatch;
              }).length;
            }

            int _countRankTotal(String rank) {
              return MTStorage.staffList.where((s) => s['rank'].toString().toUpperCase().contains(rank)).length;
            }

            @override
            Widget build(BuildContext context) {
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              // रैंक वार पोस्टेड नफरी
              final pInsp = _countRankTotal('INSP');
              final pAsiMt = _countRankTotal('ASI/MT');
              final pHcDvr = _countRankTotal('HC/DVR');
              final pCtDvr = _countRankTotal('CT/DVR');
              final pTotalDvr = pInsp + pAsiMt + pHcDvr + pCtDvr;

              final pSiMm = _countRankTotal('SI/MM');
              final pAsiMm = _countRankTotal('ASI/MM');
              final pHcMmv = _countRankTotal('HC/MMV');
              final pCtMmv = _countRankTotal('CT/MMV');
              final pCtDtr = _countRankTotal('PTR') + _countRankTotal('DTR');
              final pTotalWs = pSiMm + pAsiMm + pHcMmv + pCtMmv + pCtDtr;
              final grandTotal = pTotalDvr + pTotalWs;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('MT PLATOON PARADE STATEMENT'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.share),
                      onPressed: () {
                        Clipboard.setData(ClipboardData(text: 'MT PLATOON PARADE STATEMENT GC CRPF AGARTALA AS ON: $dateStr\nPOSTED: $grandTotal'));
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('परेड रिपोर्ट कॉपी हो गई!')));
                      },
                    )
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    children: [
                      Text(
                        'MT PLATOON PARADE STATEMENT GC CRPF AGARTALA\nAS ON DATE: $dateStr',
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13),
                      ),
                      const SizedBox(height: 12),
                      SingleChildScrollView(
                        scrollDirection: Axis.horizontal,
                        child: Table(
                          defaultColumnWidth: const FixedColumnWidth(70),
                          border: TableBorder.all(color: Colors.black54, width: 0.8),
                          children: [
                            _headerRow(),
                            _dataRow('AUTH STR.', ['01', '01', '20', '33', '55', '01', '02', '04', '02', '01', '10', '65'], isBold: true),
                            _dataRow('POSTED STR.', ['$pInsp', '$pAsiMt', '$pHcDvr', '$pCtDvr', '$pTotalDvr', '$pSiMm', '$pAsiMm', '$pHcMmv', '$pCtMmv', '$pCtDtr', '$pTotalWs', '$grandTotal'], isBold: true),
                            _dataRow('ON E/L', [_calc('INSP', 'EL'), _calc('ASI/MT', 'EL'), _calc('HC/DVR', 'EL'), _calc('CT/DVR', 'EL'), '02', _calc('SI/MM', 'EL'), '00', '00', '00', '00', '01', '03']),
                            _dataRow('ON C/L', [_calc('INSP', 'CL'), _calc('ASI/MT', 'CL'), _calc('HC/DVR', 'CL'), _calc('CT/DVR', 'CL'), '07', '00', '00', _calc('HC/MMV', 'CL'), '00', '00', '01', '08']),
                            _dataRow('ATTACH IGP', ['00', '00', '00', _calc('CT/DVR', 'ATTACHED_IGP'), '01', '00', '00', _calc('HC/MMV', 'ATTACHED_IGP'), '00', '00', '01', '02']),
                            _dataRow('BMI COURSE', ['00', '00', _calc('HC/DVR', 'BMI_COURSE'), '00', '01', '00', '00', '00', '00', '00', '00', '01']),
                            _dataRow('ASI COURSE', ['00', '00', _calc('HC/DVR', 'ASI_MT_COURSE'), '00', '03', '00', '00', '00', '00', '00', '00', '03']),
                            _dataRow('POL GUARD', ['00', '00', _calc('HC/DVR', 'POL_GUARD'), _calc('CT/DVR', 'POL_GUARD'), '04', '00', '00', '00', '00', '00', '00', '04']),
                            _dataRow('MT GUARD', ['00', '00', _calc('HC/DVR', 'MT_GUARD'), _calc('CT/DVR', 'MT_GUARD'), '02', '00', '00', '00', '00', '00', '00', '02']),
                            _dataRow('DIGP DVR', ['00', '00', _calc('HC/DVR', 'DIGP_DVR'), _calc('CT/DVR', 'DIGP_DVR'), '03', '00', '00', '00', '00', '00', '00', '03']),
                            _dataRow('AMBULANCE', ['00', '00', '00', _calc('CT/DVR', 'AMBULANCE_DVR'), '01', '00', '00', '00', '00', '00', '00', '01']),
                            _dataRow('SCHOOL BUS', ['00', '00', _calc('HC/DVR', 'SCHOOL_BUS'), _calc('CT/DVR', 'SCHOOL_BUS'), '06', '00', '00', '00', '00', '00', '00', '06']),
                            _dataRow('WATER TRUCK', ['00', '00', _calc('HC/DVR', 'WATER_TRUCK'), '00', '02', '00', '00', '00', '00', '00', '00', '02']),
                            _dataRow('TRACTOR', ['00', '00', '00', _calc('CT/DVR', 'TRACTOR_DVR'), '01', '00', '00', '00', '00', '00', '00', '01']),
                            _dataRow('JCB DVR', ['00', '00', '00', _calc('CT/DVR', 'JCB_DVR'), '01', '00', '00', '00', '00', '00', '00', '01']),
                            _dataRow('DR DUTY', ['00', '00', '00', _calc('CT/DVR', 'DR_DUTY_DVR'), '01', '00', '00', '00', '00', '00', '00', '01']),
                            _dataRow('ON PARADE', ['01', '00', '01', '02', '04', '00', '00', '01', '01', '01', '03', '07'], isBold: true, bgColor: Colors.green.shade50),
                          ],
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text('HC/MT', style: TextStyle(fontWeight: FontWeight.bold)),
                          Text('MTO GC CRPF AGARTALA', style: TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            String _calc(String r, String s) {
              int c = MTStorage.staffList.where((st) => st['rank'].toString().contains(r) && st['status'] == s).length;
              return c < 10 ? '0$c' : '$c';
            }

            TableRow _headerRow() {
              final headers = ['PARTICULAR', 'INSP\nMT', 'ASI\nMT', 'HC\nDVR', 'CT\nDVR', 'TOTAL', 'SI\nMM', 'ASI\nMM', 'HC\nMMV', 'CT\nMMV', 'CT\nDTR', 'TOTAL', 'G/TOT'];
              return TableRow(
                decoration: BoxDecoration(color: Colors.indigo.shade50),
                children: headers.map((h) => Padding(
                  padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 2),
                  child: Text(h, textAlign: TextAlign.center, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.bold)),
                )).toList(),
              );
            }

            TableRow _dataRow(String title, List<String> vals, {bool isBold = false, Color? bgColor}) {
              return TableRow(
                decoration: BoxDecoration(color: bgColor),
                children: [
                  Padding(
                    padding: const EdgeInsets.all(4.0),
                    child: Text(title, style: TextStyle(fontSize: 9, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                  ),
                  ...vals.map((v) => Padding(
                    padding: const EdgeInsets.symmetric(vertical: 4),
                    child: Text(v, textAlign: TextAlign.center, style: TextStyle(fontSize: 10, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                  )),
                ],
              );
            }
          }
          EOF

