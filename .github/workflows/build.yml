            void _editStaffFullDialog(Map<String, dynamic> s) {
              final mobCtrl = TextEditingController(text: s['mobile']);
              final bloodCtrl = TextEditingController(text: s['blood']);
              final stateCtrl = TextEditingController(text: s['state']);
              final addrCtrl = TextEditingController(text: s['address']);
              final dlCtrl = TextEditingController(text: s['dl_no']);
              final elCtrl = TextEditingController(text: s['el_bal'].toString());
              final clCtrl = TextEditingController(text: s['cl_bal'].toString());

              showDialog(
                context: context,
                builder: (dCtx) => AlertDialog(
                  title: Text('${s['rank']} ${s['name']} (एडिट)'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल नंबर')),
                        TextField(controller: bloodCtrl, decoration: const InputDecoration(labelText: 'ब्लड ग्रुप')),
                        TextField(controller: stateCtrl, decoration: const InputDecoration(labelText: 'राज्य')),
                        TextField(controller: addrCtrl, decoration: const InputDecoration(labelText: 'स्थाई पता')),
                        TextField(controller: dlCtrl, decoration: const InputDecoration(labelText: 'DL नंबर')),
                        TextField(controller: elCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'EL बैलेंस')),
                        TextField(controller: clCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'CL बैलेंस')),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        s['mobile'] = mobCtrl.text.trim();
                        s['blood'] = bloodCtrl.text.trim().toUpperCase();
                        s['state'] = stateCtrl.text.trim().toUpperCase();
                        s['address'] = addrCtrl.text.trim();
                        s['dl_no'] = dlCtrl.text.trim().toUpperCase();
                        s['el_bal'] = int.tryParse(elCtrl.text) ?? s['el_bal'];
                        s['cl_bal'] = int.tryParse(clCtrl.text) ?? s['cl_bal'];
                        await MTStorage.saveData();
                        Navigator.pop(dCtx);
                        setState(() {});
                      },
                      child: const Text('सेव करें'),
                    ),
                  ],
                ),
              );
            }

