                        TextField(controller: toCtrl, decoration: const InputDecoration(labelText: 'To Date (YYYY-MM-DD)')),
                        TextField(controller: totalCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Total Days')),
                        TextField(controller: rsnCtrl, decoration: const InputDecoration(labelText: 'Reason for Leave')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('Cancel')),
                      ElevatedButton(
                        onPressed: () async {
                          MTStorage.leaves.insert(0, {
                            'force': user['force'],
                            'name': '${user['rank']} ${user['name']}',
                            'type': type,
                            'from_date': fromCtrl.text.trim(),
                            'to_date': toCtrl.text.trim(),
                            'total_days': int.tryParse(totalCtrl.text) ?? 1,
                            'reason': rsnCtrl.text.trim(),
