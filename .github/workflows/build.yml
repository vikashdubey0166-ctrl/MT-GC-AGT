            Future<void> _downloadCustomFilePdf(Map<String, dynamic> file) async {
              final pdf = pw.Document();

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(24),
                  build: (pw.Context ctx) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 14))),
                        pw.Center(child: pw.Text('FILE: ${file['name']} (${file['type']})', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 12))),
                        pw.Center(child: pw.Text('DATE: ${file['created_date']}', style: const pw.TextStyle(fontSize: 10))),
                        pw.SizedBox(height: 16),
                        pw.Text('DESCRIPTION: ${file['description']}', style: const pw.TextStyle(fontSize: 10)),
                        pw.SizedBox(height: 16),
                        if (file['type'] == 'EXCEL' && file['headers'] != null)
                          pw.Table(
                            border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                            children: [
                              pw.TableRow(
                                decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                                children: (file['headers'] as List).map((h) => pw.Container(padding: const pw.EdgeInsets.all(4), alignment: pw.Alignment.center, child: pw.Text(h.toString(), style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)))).toList(),
                              ),
                              if (file['rows'] != null)
                                ...(file['rows'] as List).map((row) {
                                  return pw.TableRow(
                                    children: (row as List).map((c) => pw.Container(padding: const pw.EdgeInsets.all(4), alignment: pw.Alignment.center, child: pw.Text(c.toString(), style: const pw.TextStyle(fontSize: 8)))).toList(),
                                  );
                                }).toList(),
                            ],
                          )
                        else
                          pw.Text(file['word_content'] ?? '', style: const pw.TextStyle(fontSize: 9.5)),
                      ],
                    );
                  },
                ),
              );

              await MTStorage.sharePdf(pdf, file['name'] ?? 'CRPF_Document');
            }
          }

          // ================= CUSTOM PARADE FILE EDITOR (WORD & EXCEL & FORMS) =================
          class CustomParadeFileEditorScreen extends StatefulWidget {
            final Map<String, dynamic> file;
            final bool isAdmin;
            const CustomParadeFileEditorScreen({Key? key, required this.file, required this.isAdmin}) : super(key: key);

            @override
            State<CustomParadeFileEditorScreen> createState() => _CustomParadeFileEditorScreenState();
          }

          class _CustomParadeFileEditorScreenState extends State<CustomParadeFileEditorScreen> {
            late TextEditingController _wordTextCtrl;
            late List<String> _headers;
            late List<List<String>> _rows;

            @override
            void initState() {
              super.initState();
              final f = widget.file;
              _wordTextCtrl = TextEditingController(text: f['word_content'] ?? '');
              _headers = List<String>.from(f['headers'] ?? ['SL', 'PARTICULAR', 'TOTAL']);
              _rows = (f['rows'] as List?)?.map((r) => List<String>.from(r)).toList() ?? [];
            }

            Future<void> _saveFile() async {
              widget.file['word_content'] = _wordTextCtrl.text;
              widget.file['headers'] = _headers;
              widget.file['rows'] = _rows;
              await MTStorage.saveData(changeDesc: 'File updated: ${widget.file['name']}');
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('File changes synced live to all devices!'), backgroundColor: Colors.green));
              }
            }

            Future<void> _exportPdf() async {
              final pdf = pw.Document();
              final f = widget.file;
              final bool isExcel = f['type'] == 'EXCEL';

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(24),
                  build: (pw.Context ctx) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                        pw.Center(child: pw.Text('${f['name']} (${f['type']})', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 11))),
                        pw.Center(child: pw.Text('DATE: ${f['created_date']}', style: const pw.TextStyle(fontSize: 9))),
                        pw.SizedBox(height: 14),
                        if (isExcel)
                          pw.Table(
                            border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                            children: [
                              pw.TableRow(
                                decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                                children: _headers.map((h) => pw.Container(padding: const pw.EdgeInsets.all(4), alignment: pw.Alignment.center, child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)))).toList(),
                              ),
                              ..._rows.map((row) => pw.TableRow(
                                children: row.map((cell) => pw.Container(padding: const pw.EdgeInsets.all(3.5), alignment: pw.Alignment.center, child: pw.Text(cell, style: const pw.TextStyle(fontSize: 7.5)))).toList(),
                              )).toList(),
                            ],
                          )
                        else
                          pw.Container(
                            padding: const pw.EdgeInsets.all(10),
                            decoration: pw.BoxDecoration(border: pw.TableBorder.all(color: PdfColors.black, width: 0.5)),
                            child: pw.Text(_wordTextCtrl.text, style: const pw.TextStyle(fontSize: 9.5)),
                          ),
                        pw.SizedBox(height: 30),
                        pw.Row(
                          mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                          children: [
                            pw.Text('HC/MT (CHIEF WRITER)\nGC CRPF AGT', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)),
                            pw.Text('MTO\nGC CRPF AGARTALA', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)),
                          ],
                        ),
                      ],
                    );
                  },
                ),
              );

              await MTStorage.sharePdf(pdf, f['name'] ?? 'CRPF_Document');
            }

            void _addExcelRowDialog() {
              List<TextEditingController> ctrls = List.generate(_headers.length, (i) => TextEditingController(text: i == 0 ? '${_rows.length + 1}' : '00'));

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Add Row to Table'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: List.generate(_headers.length, (i) => TextField(controller: ctrls[i], decoration: InputDecoration(labelText: _headers[i]))),
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () {
                        setState(() {
                          _rows.add(ctrls.map((c) => c.text.trim()).toList());
                        });
                        Navigator.pop(ctx);
                        _saveFile();
                      },
                      child: const Text('Add'),
                    ),
                  ],
                ),
              );
            }

            void _addExcelColumnDialog() {
              final colCtrl = TextEditingController();

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Add Column to Table'),
                  content: TextField(controller: colCtrl, decoration: const InputDecoration(labelText: 'Column Title')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () {
                        if (colCtrl.text.isNotEmpty) {
                          setState(() {
                            _headers.add(colCtrl.text.trim().toUpperCase());
                            for (var r in _rows) {
                              r.add('00');
                            }
                          });
                          Navigator.pop(ctx);
                          _saveFile();
                        }
                      },
                      child: const Text('Add Column'),
                    ),
                  ],
                ),
              );
            }

            void _editCellDialog(int rIdx, int cIdx) {
              final ctrl = TextEditingController(text: _rows[rIdx][cIdx]);

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text('Edit Cell: ${_headers[cIdx]}'),
                  content: TextField(controller: ctrl, decoration: const InputDecoration(labelText: 'New Value')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () {
                        setState(() {
                          _rows[rIdx][cIdx] = ctrl.text.trim();
                        });
                        Navigator.pop(ctx);
                        _saveFile();
                      },
                      child: const Text('Update'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final f = widget.file;
              final bool isExcel = f['type'] == 'EXCEL';
              final bool hasPhoto = f['photo_base64'] != null && f['photo_base64'].toString().isNotEmpty;

              return Scaffold(
                appBar: AppBar(
                  title: Text('${f['name']} (${f['type']})'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.share),
                      tooltip: 'Share PDF',
                      onPressed: _exportPdf,
                    ),
                    if (widget.isAdmin)
                      IconButton(
                        icon: const Icon(Icons.save),
                        tooltip: 'Save File',
                        onPressed: _saveFile,
                      ),
                  ],
                ),
                body: hasPhoto
                    ? SingleChildScrollView(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Card(
                              elevation: 2,
                              child: Padding(
                                padding: const EdgeInsets.all(12.0),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text('CRPF Official Attached Document / Form:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Color(0xFF1B3B6F))),
                                    const SizedBox(height: 4),
                                    Text('Description: ${f['description']}', style: const TextStyle(fontSize: 12, color: Colors.blueGrey)),
                                    const SizedBox(height: 12),
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.memory(base64Decode(f['photo_base64'])),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ],
                        ),
                      )
                    : isExcel
                        ? Column(
                            children: [
                              if (widget.isAdmin)
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                  color: Colors.indigo.shade50,
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      ElevatedButton.icon(
                                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                                        icon: const Icon(Icons.add_circle, size: 14),
                                        label: const Text('New Row'),
                                        onPressed: _addExcelRowDialog,
                                      ),
                                      ElevatedButton.icon(
                                        style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, foregroundColor: Colors.white),
                                        icon: const Icon(Icons.view_column, size: 14),
                                        label: const Text('New Column'),
                                        onPressed: _addExcelColumnDialog,
                                      ),
                                    ],
                                  ),
                                ),
                              Expanded(
                                child: SingleChildScrollView(
                                  scrollDirection: Axis.vertical,
                                  child: SingleChildScrollView(
                                    scrollDirection: Axis.horizontal,
                                    child: Table(
                                      defaultColumnWidth: const FixedColumnWidth(90),
                                      border: TableBorder.all(color: Colors.black45, width: 0.8),
                                      children: [
                                        TableRow(
                                          decoration: BoxDecoration(color: Colors.indigo.shade100),
                                          children: _headers.map((h) => Padding(
                                            padding: const EdgeInsets.all(6),
                                            child: Text(h, textAlign: TextAlign.center, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 11)),
                                          )).toList(),
                                        ),
                                        ..._rows.asMap().entries.map((rEntry) {
                                          final rIdx = rEntry.key;
                                          final row = rEntry.value;
                                          return TableRow(
                                            children: row.asMap().entries.map((cEntry) {
                                              final cIdx = cEntry.key;
                                              final cellVal = cEntry.value;
                                              return InkWell(
                                                onTap: widget.isAdmin ? () => _editCellDialog(rIdx, cIdx) : null,
                                                child: Padding(
                                                  padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 4),
                                                  child: Text(cellVal, textAlign: TextAlign.center, style: const TextStyle(fontSize: 11)),
                                                ),
                                              );
                                            }).toList(),
                                          );
                                        }).toList(),
                                      ],
                                    ),
                                  ),
                                ),
                              ),
                            ],
                          )
                        : Padding(
                            padding: const EdgeInsets.all(16.0),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(widget.isAdmin ? 'Word Document Text Editor (Admin):' : 'Word Document View:', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.blueGrey)),
                                const SizedBox(height: 8),
                                Expanded(
                                  child: TextField(
                                    controller: _wordTextCtrl,
                                    enabled: widget.isAdmin,
                                    maxLines: null,
                                    expands: true,
                                    decoration: const InputDecoration(
                                      border: OutlineInputBorder(),
                                      hintText: 'Type order details, official letter, or parade description here...',
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          ),
              );
            }
          }

          // ================= CONTACT DIRECTORY SCREEN =================
          class ContactDirectoryScreen extends StatefulWidget {
            final bool isAdmin;
            const ContactDirectoryScreen({Key? key, required this.isAdmin}) : super(key: key);

            @override
            State<ContactDirectoryScreen> createState() => _ContactDirectoryScreenState();
          }

          class _ContactDirectoryScreenState extends State<ContactDirectoryScreen> {
            String _searchQuery = '';

            Future<void> _exportDirectoryPdf() async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.MultiPage(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(20),
                  header: (pw.Context ctx) => pw.Column(
                    children: [
                      pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                      pw.Center(child: pw.Text('MT PLATOON - PERSONNEL CONTACT DIRECTORY (AS ON $dateStr)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10))),
                      pw.SizedBox(height: 8),
                    ],
                  ),
                  build: (pw.Context ctx) => [
                    pw.Table(
                      border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                      children: [
                        pw.TableRow(
                          decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                          children: ['SL', 'FORCE NUMBER', 'RANK', 'NAME', 'MOBILE NUMBER'].map((h) => pw.Container(
                            padding: const pw.EdgeInsets.all(4),
                            alignment: pw.Alignment.center,
                            child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8.5)),
                          )).toList(),
                        ),
                        ...MTStorage.staffList.asMap().entries.map((e) {
                          final i = e.key + 1;
                          final s = e.value;
                          return pw.TableRow(
                            children: [
                              '$i',
                              s['force'] ?? '',
                              s['rank'] ?? '',
                              s['name'] ?? '',
                              '+91 ${s['mobile'] ?? ''}',
                            ].map((c) => pw.Container(
                              padding: const pw.EdgeInsets.symmetric(vertical: 3.5, horizontal: 4),
                              alignment: pw.Alignment.center,
                              child: pw.Text(c, style: const pw.TextStyle(fontSize: 8)),
                            )).toList(),
                          );
                        }).toList(),
                      ],
                    ),
                  ],
                ),
              );

              await MTStorage.sharePdf(pdf, 'MT_Contact_Directory');
            }

            void _addOrEditContactDialog(Map<String, dynamic>? staff) {
              final isEdit = staff != null;
              final forceCtrl = TextEditingController(text: isEdit ? staff['force'] : '');
              final nameCtrl = TextEditingController(text: isEdit ? staff['name'] : '');
              final rankCtrl = TextEditingController(text: isEdit ? staff['rank'] : 'CT/DVR');
              final mobCtrl = TextEditingController(text: isEdit ? staff['mobile'] : '');

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setD) => AlertDialog(
                    title: Text(isEdit ? 'Edit Contact' : 'Add New Contact'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: forceCtrl, enabled: !isEdit, decoration: const InputDecoration(labelText: 'Force Number')),
                          DropdownButtonFormField<String>(
                            value: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR'].contains(rankCtrl.text) ? rankCtrl.text : 'CT/DVR',
                            decoration: const InputDecoration(labelText: 'Rank'),
                            items: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR']
                                .map((r) => DropdownMenuItem(value: r, child: Text(r))).toList(),
                            onChanged: (val) => setD(() => rankCtrl.text = val!),
                          ),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'Full Name')),
                          TextField(controller: mobCtrl, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: 'Mobile Number')),
                        ],
                      ),
                    ),
                    actions: [
                      if (isEdit && widget.isAdmin)
                        TextButton(
                          style: TextButton.styleFrom(foregroundColor: Colors.red),
                          onPressed: () async {
                            MTStorage.staffList.remove(staff);
                            await MTStorage.saveData(changeDesc: 'Contact removed: ${staff['name']}');
                            Navigator.pop(ctx);
                            setState(() {});
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Contact removed!'), backgroundColor: Colors.red));
                          },
                          child: const Text('Delete'),
                        ),
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                      ElevatedButton(
                        onPressed: () async {
                          if (forceCtrl.text.isNotEmpty && nameCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              staff['name'] = nameCtrl.text.trim().toUpperCase();
                              staff['rank'] = rankCtrl.text.trim().toUpperCase();
                              staff['mobile'] = mobCtrl.text.trim();
                            } else {
                              MTStorage.staffList.add({
                                'force': forceCtrl.text.trim(),
                                'rank': rankCtrl.text.trim().toUpperCase(),
                                'name': nameCtrl.text.trim().toUpperCase(),
                                'role': 'STAFF',
                                'mobile': mobCtrl.text.trim(),
                                'status': 'PRESENT',
                                'leave_days': 0,
                                'course_name': '',
                                'location': 'GC AGT',
                                'duty_type': 'CAMP',
                                'gc_reporting_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                                'blood': 'B+',
                                'icard_no': 'AGT-${forceCtrl.text.trim()}',
                                'dl_no': '',
                                'dl_validity': '',
                                'state': '',
                                'address': '',
                                'photo_base64': '',
                                'attach_type': 'NONE',
                                'attach_office': '',
                                'el_bal': 60,
                                'cl_bal': 15,
                                'pl_bal': 30
                              });
                            }
                            await MTStorage.saveData(changeDesc: 'Contact directory updated: ${nameCtrl.text.trim()}');
                            Navigator.pop(ctx);
                            setState(() {});
                          }
                        },
                        child: const Text('Save Contact'),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final filtered = MTStorage.staffList.where((s) {
                final query = _searchQuery.toLowerCase();
                final name = (s['name'] ?? '').toString().toLowerCase();
                final force = (s['force'] ?? '').toString().toLowerCase();
                final mob = (s['mobile'] ?? '').toString().toLowerCase();
                return name.contains(query) || force.contains(query) || mob.contains(query);
              }).toList();

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Personnel Directory'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.share),
                      tooltip: 'Share Directory PDF',
                      onPressed: _exportDirectoryPdf,
                    ),
                    if (widget.isAdmin)
                      IconButton(
                        icon: const Icon(Icons.person_add),
                        tooltip: 'Add Contact',
                        onPressed: () => _addOrEditContactDialog(null),
                      ),
                  ],
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: TextField(
                        decoration: InputDecoration(
                          hintText: 'Search by Name, Force No, or Mobile...',
                          prefixIcon: const Icon(Icons.search),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                          contentPadding: const EdgeInsets.symmetric(vertical: 0, horizontal: 12),
                        ),
                        onChanged: (val) => setState(() => _searchQuery = val.trim()),
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.horizontal(16.0),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text('Total Personnel: ${filtered.length}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.blueGrey)),
                          if (widget.isAdmin)
                            const Text('* Tap personnel to edit or delete', style: TextStyle(fontSize: 11, color: Colors.green, fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                    const Divider(),
                    Expanded(
                      child: ListView.builder(
                        itemCount: filtered.length,
                        itemBuilder: (ctx, i) {
                          final s = filtered[i];
                          return Card(
                            margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                            child: ListTile(
                              onTap: widget.isAdmin ? () => _addOrEditContactDialog(s) : null,
                              leading: CircleAvatar(
                                backgroundColor: const Color(0xFF1B3B6F),
                                child: Text(s['name'] != null && s['name'].toString().isNotEmpty ? s['name'][0] : 'U', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                              ),
                              title: Text('${s['rank']} ${s['name']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                              subtitle: Text('Force No: ${s['force']}\nMobile: +91 ${s['mobile']}'),
                              trailing: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.phone, color: Colors.teal),
                                    onPressed: () async {
                                      final uri = Uri.parse('tel:+91${s['mobile']}');
                                      if (await canLaunchUrl(uri)) await launchUrl(uri);
                                    },
                                  ),
                                  if (widget.isAdmin)
                                    IconButton(
                                      icon: const Icon(Icons.edit, color: Colors.blueGrey, size: 20),
                                      onPressed: () => _addOrEditContactDialog(s),
                                    ),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: |
          cd mt_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT_GC_AGT_Release_APK
          path: mt_app/build/app/outputs/flutter-apk/app-release.apk
