          // ================= LOGIN SCREEN =================
          class LoginScreen extends StatefulWidget {
            const LoginScreen({Key? key}) : super(key: key);

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _forceCtrl = TextEditingController();
            final _passCtrl = TextEditingController();
            bool _obscure = true;

            void _processLogin() {
              final force = _forceCtrl.text.trim();
              final pass = _passCtrl.text.trim();

              final staff = MTStorage.staffList.firstWhere(
                (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                orElse: () => {},
              );

              if (staff.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('फोर्स नंबर रिकॉर्ड में मौजूद नहीं है!')),
                );
                return;
              }

              final expectedPass = MTStorage.passwords[staff['force']] ?? 'Mt@${staff['force']}';
              if (pass != expectedPass) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('गलत पासवर्ड! कृपया पुनः प्रयास करें।')),
                );
                return;
              }

              // एडमिन (165060166) सीधा प्रवेश
              if (staff['force'] == '165060166') {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                );
                return;
              }

              // अन्य कार्मिकों हेतु OTP सत्यापन
              _showOtpVerificationDialog(staff);
            }

            void _showOtpVerificationDialog(Map<String, dynamic> staff) {
              final otp = (100000 + Random().nextInt(900000)).toString();
              String deliveryMethod = 'WHATSAPP';
              final otpInputCtrl = TextEditingController();

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setDialogState) => AlertDialog(
                    title: const Row(
                      children: [
                        Icon(Icons.mark_email_read, color: Color(0xFF1B3B6F)),
                        SizedBox(width: 8),
                        Text('सुरक्षा सत्यापन (OTP)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('कार्मिक: ${staff['rank']} ${staff['name']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                          Text('पंजीकृत मोबाइल: +91 ${staff['mobile']}', style: const TextStyle(color: Colors.blueGrey, fontSize: 13)),
                          const SizedBox(height: 14),
                          const Text('OTP माध्यम चुनें:', style: TextStyle(fontWeight: FontWeight.w600, fontSize: 13)),
                          RadioListTile<String>(
                            dense: true,
                            contentPadding: EdgeInsets.zero,
                            title: const Text('WhatsApp पर भेजें', style: TextStyle(fontSize: 13)),
                            value: 'WHATSAPP',
                            groupValue: deliveryMethod,
                            onChanged: (val) => setDialogState(() => deliveryMethod = val!),
                          ),
                          RadioListTile<String>(
                            dense: true,
                            contentPadding: EdgeInsets.zero,
                            title: const Text('सामान्य SMS से भेजें', style: TextStyle(fontSize: 13)),
                            value: 'SMS',
                            groupValue: deliveryMethod,
                            onChanged: (val) => setDialogState(() => deliveryMethod = val!),
                          ),
                          const SizedBox(height: 10),
                          Container(
                            padding: const EdgeInsets.all(10),
                            decoration: BoxDecoration(color: Colors.amber.shade50, borderRadius: BorderRadius.circular(8)),
                            child: Row(
                              children: [
                                const Icon(Icons.security, size: 20, color: Colors.amber),
                                const SizedBox(width: 8),
                                Expanded(
                                  child: Text(
                                    'आपका 6 अंकों का OTP है: $otp',
                                    style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.black87),
                                  ),
                                ),
                              ],
                            ),
                          ),
                          const SizedBox(height: 14),
                          TextField(
                            controller: otpInputCtrl,
                            keyboardType: TextInputType.number,
                            maxLength: 6,
                            textAlign: TextAlign.center,
                            style: const TextStyle(fontSize: 20, letterSpacing: 4, fontWeight: FontWeight.bold),
                            decoration: const InputDecoration(
                              labelText: 'प्राप्त OTP दर्ज करें',
                              border: OutlineInputBorder(),
                            ),
                          ),
                          if (deliveryMethod == 'WHATSAPP')
                            Center(
                              child: TextButton.icon(
                                icon: const Icon(Icons.chat, color: Colors.green, size: 18),
                                label: const Text('WhatsApp पर OTP भेजें', style: TextStyle(color: Colors.green, fontSize: 12)),
                                onPressed: () async {
                                  final msg = Uri.encodeComponent('CRPF MT GC AGT लॉगिन OTP है: $otp');
                                  final uri = Uri.parse('https://wa.me/91${staff['mobile']}?text=$msg');
                                  if (await canLaunchUrl(uri)) {
                                    await launchUrl(uri, mode: LaunchMode.externalApplication);
                                  }
                                },
                              ),
                            ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                        onPressed: () {
                          if (otpInputCtrl.text.trim() == otp) {
                            Navigator.pop(ctx);
                            Navigator.pushReplacement(
                              context,
                              MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                            );
                          } else {
                            ScaffoldMessenger.of(context).showSnackBar(
                              const SnackBar(content: Text('अमान्य OTP! कृपया सही कोड दर्ज करें।')),
                            );
                          }
                        },
                        child: const Text('सत्यापित करें व लॉगिन करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF0F4F8),
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24.0),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          padding: const EdgeInsets.all(16),
                          decoration: const BoxDecoration(
                            color: Color(0xFF1B3B6F),
                            shape: BoxShape.circle,
                          ),
                          child: const Icon(Icons.security, size: 55, color: Colors.white),
                        ),
                        const SizedBox(height: 16),
                        const Text(
                          'MT GC AGT',
                          textAlign: TextAlign.center,
                          style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Color(0xFF1B3B6F), letterSpacing: 1),
                        ),
                        const Text(
                          'एम टी शाखा समूह केंद्र अगरतला',
                          textAlign: TextAlign.center,
                          style: TextStyle(fontSize: 16, fontWeight: FontWeight.w600, color: Colors.blueGrey),
                        ),
                        const SizedBox(height: 24),
