            Future<void> _pickAndAssignMedia(ImageSource src, String section, String targetKey, BuildContext dCtx) async {
              final picker = ImagePicker();
              final img = await picker.pickImage(source: src, imageQuality: 60);
              if (img != null) {
                final bytes = await img.readAsBytes();
                final b64 = base64Encode(bytes);

                if (section == 'STAFF') {
                  final staff = MTStorage.staffList.firstWhere((s) => s['force'] == targetKey, orElse: () => {});
                  if (staff.isNotEmpty) {
                    staff['photo_base64'] = b64;
                    await MTStorage.addNotification('कार्मिक फोटो अपडेट', '${staff['rank']} ${staff['name']} का फोटो अपडेट किया गया।');
                  }
                } else if (section == 'VEHICLE') {
                  final veh = MTStorage.vehicles.firstWhere((v) => v['no'] == targetKey, orElse: () => {});
                  if (veh.isNotEmpty) {
                    veh['photo_base64'] = b64;
                    veh['tools_issued'] = '${veh['tools_issued'] ?? ''} [फोटो संलग्न: ${DateFormat('dd/MM/yy').format(DateTime.now())}]';
                    await MTStorage.addNotification('वाहन लॉगबुक अपडेट', '${veh['no']} के रिकॉर्ड में नया दस्तावेज/फोटो जोड़ा गया।');
                  }
                } else if (section == 'PARADE') {
                  MTStorage.customParadeFiles.add({
                    'id': 'file_${DateTime.now().millisecondsSinceEpoch}',
                    'name': 'CRPF_FORM_${DateFormat('ddMM_HHmm').format(DateTime.now())}',
                    'type': 'FORM',
                    'created_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                    'description': 'आधिकारिक सीआरपीएफ फॉर्म/दस्तावेज',
                    'headers': ['SL', 'CRPF DOCUMENT DETAILS', 'STATUS'],
                    'rows': [['1', 'CRPF OFFICIAL ATTACHMENT', 'VERIFIED & ISSUED']],
                    'word_content': 'कार्यालय पुलिस उप महानिरीक्षक, समूह केंद्र, के.रि.पु.बल अगरतला। आधिकारिक दस्तावेज संलग्न है।',
                    'photo_base64': b64
                  });
                  await MTStorage.addNotification('सीआरपीएफ फॉर्म अपलोड', 'परेड सेक्शन में नया सीआरपीएफ फॉर्म अपलोड किया गया है।');
                }

                Navigator.pop(dCtx);
                setState(() {});
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('फाइल सभी कार्मिकों के डिवाइस हेतु तुरंत सिंक हो गई!'), backgroundColor: Colors.green));
              }
            }

