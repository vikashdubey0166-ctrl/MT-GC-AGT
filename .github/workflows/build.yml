            Widget _buildStaffAvatar(Map<String, dynamic> staff, {double radius = 24}) {
              if (staff['photo_base64'] != null && staff['photo_base64'].toString().isNotEmpty) {
                try {
                  final bytes = base64Decode(staff['photo_base64']);
                  return CircleAvatar(radius: radius, backgroundImage: MemoryImage(bytes));
                } catch (_) {}
              }
              return CircleAvatar(
                radius: radius,
                backgroundColor: const Color(0xFF1B3B6F),
                child: Text(staff['name'] != null && staff['name'].toString().isNotEmpty ? staff['name'][0] : 'U',
                    style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
              );
            }

