            void _selectDriverForVehicleDialog(BuildContext ctx, Map<String, dynamic> veh, VoidCallback onSelected) {
              String selected = veh['driver_incharge'] ?? '${MTStorage.staffList[0]['rank']} ${MTStorage.staffList[0]['name']}';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text('${veh['no']} का इंचार्ज चालक चुनें'),
                    content: DropdownButtonFormField<String>(
                      isExpanded: true,
                      value: MTStorage.staffList.any((s) => '${s['rank']} ${s['name']}' == selected) ? selected : null,
                      hint: const Text('ड्राइवर चुनें'),
                      items: MTStorage.staffList.map<DropdownMenuItem<String>>((s) {
                        final full = '${s['rank']} ${s['name']}';
                        return DropdownMenuItem(value: full, child: Text(full, style: const TextStyle(fontSize: 12)));
                      }).toList(),
                      onChanged: (val) => setD(() => selected = val!),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          veh['driver_incharge'] = selected;
                          Navigator.pop(dCtx);
                          onSelected();
                        },
                        child: const Text('चार्ज सौंपें'),
                      ),
                    ],
                  ),
                ),
              );
            }

