            void _editStaffDetailsDialog(Map<String, dynamic> staff) {
              final rankCtrl = TextEditingController(text: staff['rank']);
              final nameCtrl = TextEditingController(text: staff['name']);
              final mobCtrl = TextEditingController(text: staff['mobile']);
              final repDateCtrl = TextEditingController(text: staff['gc_reporting_date']);
              final bloodCtrl = TextEditingController(text: staff['blood']);
              final icardCtrl = TextEditingController(text: staff['icard_no']);
              final dlCtrl = TextEditingController(text: staff['dl_no']);
              final dlValCtrl = TextEditingController(text: staff['dl_validity']);
              final addrCtrl = TextEditingController(text: staff['address']);
              final stateCtrl = TextEditingController(text: staff['state']);
              final leaveDaysCtrl = TextEditingController(text: (staff['leave_days'] ?? 15).toString());
              final courseNameCtrl = TextEditingController(text: staff['course_name'] ?? '');
              final attachOfficeCtrl = TextEditingController(text: staff['attach_office'] ?? '');
              String status = staff['status'] ?? 'PRESENT';

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text('${staff['rank']} ${staff['name']} (Edit Details)'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          DropdownButtonFormField<String>(
                            value: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR'].contains(rankCtrl.text) ? rankCtrl.text : 'MTO',
                            decoration: const InputDecoration(labelText: 'Rank'),
                            items: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR']
                                .map((r) => DropdownMenuItem(value: r, child: Text(r))).toList(),
                            onChanged: (val) => setD(() => rankCtrl.text = val!),
                          ),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'Full Name')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'Mobile Number')),
                          DropdownButtonFormField<String>(
                            value: ['PRESENT', 'EL', 'CL', 'PL', 'LEAVE', 'MEDICAL', 'ATTACHED', 'COURSE'].contains(status) ? status : 'PRESENT',
                            decoration: const InputDecoration(labelText: 'Status'),
                            items: const [
                              DropdownMenuItem(value: 'PRESENT', child: Text('PRESENT (On Campus)')),
                              DropdownMenuItem(value: 'EL', child: Text('LEAVE: E/L (Earned Leave)')),
                              DropdownMenuItem(value: 'CL', child: Text('LEAVE: C/L (Casual Leave)')),
                              DropdownMenuItem(value: 'PL', child: Text('LEAVE: P/L (Paternity Leave)')),
                              DropdownMenuItem(value: 'MEDICAL', child: Text('LEAVE: Medical Leave')),
                              DropdownMenuItem(value: 'ATTACHED', child: Text('ATTACHED (External/Internal)')),
                              DropdownMenuItem(value: 'COURSE', child: Text('COURSE (In Training)')),
                            ],
                            onChanged: (val) => setD(() => status = val!),
                          ),
                          if (['EL', 'CL', 'PL', 'LEAVE', 'MEDICAL'].contains(status))
                            TextField(controller: leaveDaysCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Leave Duration (Days)')),
                          if (status == 'ATTACHED')
                            TextField(controller: attachOfficeCtrl, decoration: const InputDecoration(labelText: 'Attached Office / Unit')),
                          if (status == 'COURSE')
                            TextField(controller: courseNameCtrl, decoration: const InputDecoration(labelText: 'Course Name')),
                          TextField(controller: repDateCtrl, decoration: const InputDecoration(labelText: 'GC AGT Reporting Date')),
                          TextField(controller: bloodCtrl, decoration: const InputDecoration(labelText: 'Blood Group')),
                          TextField(controller: icardCtrl, decoration: const InputDecoration(labelText: 'I-Card Number')),
                          TextField(controller: dlCtrl, decoration: const InputDecoration(labelText: 'Driving Licence No. (Drivers)')),
                          TextField(controller: dlValCtrl, decoration: const InputDecoration(labelText: 'DL Validity Date')),
                          TextField(controller: addrCtrl, decoration: const InputDecoration(labelText: 'Permanent Address')),
                          TextField(controller: stateCtrl, decoration: const InputDecoration(labelText: 'Home State')),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('Cancel')),
                      ElevatedButton(
                        onPressed: () async {
                          staff['rank'] = rankCtrl.text.trim().toUpperCase();
                          staff['name'] = nameCtrl.text.trim().toUpperCase();
                          staff['mobile'] = mobCtrl.text.trim();
                          staff['status'] = status;
                          staff['leave_days'] = int.tryParse(leaveDaysCtrl.text) ?? 15;
                          staff['attach_office'] = attachOfficeCtrl.text.trim().toUpperCase();
                          staff['course_name'] = courseNameCtrl.text.trim().toUpperCase();
                          staff['gc_reporting_date'] = repDateCtrl.text.trim();
                          staff['blood'] = bloodCtrl.text.trim().toUpperCase();
                          staff['icard_no'] = icardCtrl.text.trim().toUpperCase();
                          staff['dl_no'] = dlCtrl.text.trim().toUpperCase();
                          staff['dl_validity'] = dlValCtrl.text.trim();
                          staff['address'] = addrCtrl.text.trim();
                          staff['state'] = stateCtrl.text.trim().toUpperCase();

                          await MTStorage.saveData(changeDesc: 'Updated personnel: ${staff['rank']} ${staff['name']}');
                          Navigator.pop(dCtx);
                          setState(() {});
                        },
                        child: const Text('Save Details'),
                      ),
                    ],
                  ),
                ),
              );
            }

