          class _DashboardScreenState extends State<DashboardScreen> {
            void _showSelfChangePasswordDialog() {
              final oldPassCtrl = TextEditingController();
              final newPassCtrl = TextEditingController();
              final confirmPassCtrl = TextEditingController();
              bool obs = true;

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setD) => AlertDialog(
                    title: const Text('पासवर्ड बदलें (Change Password)'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: oldPassCtrl, obscureText: obs, decoration: const InputDecoration(labelText: 'वर्तमान पासवर्ड', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: newPassCtrl, obscureText: obs, decoration: const InputDecoration(labelText: 'नया पासवर्ड', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: confirmPassCtrl, obscureText: obs, decoration: const InputDecoration(labelText: 'नए पासवर्ड की पुष्टि करें', border: OutlineInputBorder())),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                        onPressed: () async {
                          final currentPass = MTStorage.passwords[widget.currentUser['force']] ?? 'Mt@${widget.currentUser['force']}';
                          if (oldPassCtrl.text.trim() != currentPass) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('वर्तमान पासवर्ड गलत है!')));
                            return;
                          }
                          if (newPassCtrl.text.trim().isEmpty || newPassCtrl.text.trim() != confirmPassCtrl.text.trim()) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('नए पासवर्ड मेल नहीं खाते!')));
                            return;
                          }
                          MTStorage.passwords[widget.currentUser['force']] = newPassCtrl.text.trim();
                          await MTStorage.saveData();
                          Navigator.pop(ctx);
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('पासवर्ड सफलतापूर्वक अपडेट हो गया!'), backgroundColor: Colors.green));
