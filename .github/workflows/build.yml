            // ================= 1. VEHICLE MANAGEMENT =================
            void _openVehicles(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) {
                    final lvList = MTStorage.vehicles.where((v) => v['category'] == 'LIGHT VEHICLE (LV)').toList();
                    final mvList = MTStorage.vehicles.where((v) => v['category'] == 'MEDIUM VEHICLE (MV)').toList();
                    final hvList = MTStorage.vehicles.where((v) => v['category'] == 'HEAVY VEHICLE (HV)').toList();
                    final svList = MTStorage.vehicles.where((v) => v['category'] == 'SPECIAL VEHICLE (SV)').toList();

                    return Container(
                      height: MediaQuery.of(ctx).size.height * 0.90,
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('वाहन रिकॉर्ड (${MTStorage.vehicles.length})', style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                              if (isAdmin)
                                ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                                  icon: const Icon(Icons.add, size: 16),
                                  label: const Text('नई गाड़ी'),
                                  onPressed: () {
                                    _addOrEditVehicleDialog(ctx, null, () async {
                                      await MTStorage.saveData();
                                      setSheetState(() {});
                                      setState(() {});
                                    });
                                  },
                                ),
                            ],
                          ),
                          const Text('पूरी जानकारी देखने के लिए किसी भी गाड़ी के नंबर पर क्लिक करें', style: TextStyle(fontSize: 11, color: Colors.blueGrey)),
                          const Divider(),
                          Expanded(
                            child: ListView(
                              children: [
                                _vehicleCategoryHeader('1. LIGHT VEHICLES (LV)', lvList.length, Colors.blue),
                                ...lvList.map((v) => _vehicleTile(ctx, v, isAdmin, setSheetState)),
                                _vehicleCategoryHeader('2. MEDIUM VEHICLES (MV)', mvList.length, Colors.orange),
                                ...mvList.map((v) => _vehicleTile(ctx, v, isAdmin, setSheetState)),
                                _vehicleCategoryHeader('3. HEAVY VEHICLES (HV)', hvList.length, Colors.red),
                                ...hvList.map((v) => _vehicleTile(ctx, v, isAdmin, setSheetState)),
                                _vehicleCategoryHeader('4. SPECIAL VEHICLES (SV)', svList.length, Colors.purple),
                                ...svList.map((v) => _vehicleTile(ctx, v, isAdmin, setSheetState)),
                              ],
                            ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            Widget _vehicleCategoryHeader(String title, int count, Color col) {
              return Container(
                padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 10),
                margin: const EdgeInsets.only(top: 10, bottom: 4),
                decoration: BoxDecoration(color: col.withOpacity(0.12), borderRadius: BorderRadius.circular(6)),
                child: Text('$title ($count)', style: TextStyle(fontWeight: FontWeight.bold, color: col, fontSize: 13)),
              );
            }

            Widget _vehicleTile(BuildContext ctx, Map<String, dynamic> v, bool isAdmin, StateSetter setSheetState) {
              Color col = Colors.green;
              if (v['status'] == 'ON_DUTY') col = Colors.blue;
              if (v['status'] == 'ATTACHED') col = Colors.purple;
              if (v['status'] == 'OFF_ROAD') col = Colors.red;

              return Card(
                margin: const EdgeInsets.symmetric(vertical: 3),
                child: ListTile(
                  onTap: () {
                    _viewVehicleDetailsDialog(ctx, v, isAdmin, () async {
                      await MTStorage.saveData();
                      setSheetState(() {});
                      setState(() {});
                    });
                  },
                  leading: CircleAvatar(
                    backgroundColor: col.withOpacity(0.15),
                    child: Icon(Icons.directions_car, color: col, size: 20),
                  ),
                  title: Text('${v['no']} (${v['type']})', style: const TextStyle(fontWeight: FontWeight.bold)),
                  subtitle: Text('स्थिति: ${v['status']} | लोकेशन: ${v['attach_loc']}'),
                  trailing: const Icon(Icons.arrow_forward_ios, size: 14),
                ),
              );
            }

