              showDialog(
                context: ctx,
                builder: (vCtx) => StatefulBuilder(
                  builder: (vCtx, setVState) => AlertDialog(
                    title: Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        Text('${v['no']}', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                        Chip(label: Text(v['status'], style: const TextStyle(fontSize: 10))),
                      ],
                    ),
                    content: SingleChildScrollView(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          _detailRow('वाहन प्रकार', v['type']),
                          _detailRow('श्रेणी (Category)', v['category']),
                          _detailRow('मॉडल वर्ष', v['model_year']),
                          _detailRow('रजिस्ट्रेशन दिनांक', v['reg_date']),
                          _detailRow('वाहन मालिक', v['owner']),
                          _detailRow('वाहन की कीमत', '₹ ${v['cost']}'),
                          _detailRow('मरम्मत में कुल खर्च', '₹ ${v['repair_cost']}'),
                          _detailRow('ईंधन क्षमता', v['fuel_cap']),
                          _detailRow('कुल किलोमीटर', '${v['total_km']} KM'),
                          _detailRow('सर्विस दिनांक', v['service_date']),
                          _detailRow('टायर रोटेशन KM', '${v['tyre_rot_km']} KM'),
                          _detailRow('अटैचमेंट स्थिति', '${v['attach_type']} (${v['attach_loc']})'),
                          const Divider(),
                          const Text('इश्यू टूल किट (Issued Tools):', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                          Text(v['tools_issued'] ?? 'Jack, Wheel Pana', style: const TextStyle(fontSize: 12)),
                          const Divider(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('चार्ज हैंडओवर इतिहास:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                              if (isAdmin)
                                TextButton.icon(
                                  icon: const Icon(Icons.add, size: 14),
                                  label: const Text('चार्ज हैंडओवर', style: TextStyle(fontSize: 11)),
                                  onPressed: () {
                                    _addChargeHandoverDialog(vCtx, v, () {
                                      setVState(() {});
                                      onUpdated();
                                    });
                                  },
                                ),
                            ],
                          ),
                          ...((v['driver_charge_history'] as List? ?? []).map((ch) {
                            return Card(
                              color: Colors.grey.shade100,
                              child: Padding(
                                padding: const EdgeInsets.all(6.0),
                                child: Text('ड्राइवर: ${ch['driver']}\nदिनांक: ${ch['date']} (द्वारा: ${ch['handed_over_by']})', style: const TextStyle(fontSize: 11)),
                              ),
                            );
                          })),
                        ],
                      ),
                    ),
                    actions: [
                      if (isAdmin)
                        TextButton(
                          style: TextButton.styleFrom(foregroundColor: Colors.red),
                          onPressed: () {
                            Navigator.pop(vCtx);
                            _confirmDelete(ctx, 'गाड़ी ${v['no']}', () async {
                              MTStorage.vehicles.remove(v);
                              await MTStorage.saveData();
                              onUpdated();
                            });
                          },
                          child: const Text('हटाएं (Delete)'),
                        ),
                      if (isAdmin)
                        ElevatedButton(
                          onPressed: () {
                            Navigator.pop(vCtx);
                            _addOrEditVehicleDialog(ctx, v, onUpdated);
                          },
                          child: const Text('एडिट करें'),
                        ),
                      TextButton(onPressed: () => Navigator.pop(vCtx), child: const Text('बंद करें')),
                    ],
                  ),
                ),
              );
