        /* ==========================================================================
           3. TOAST & REAL-TIME BROADCAST SYSTEM
           ========================================================================== */
        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = "bg-slate-900 border-slate-700 text-white";
            let iconClass = "fa-circle-info text-sky-400";
            if (type === "success") {
                bgClass = "bg-emerald-950 border-emerald-700 text-emerald-100";
                iconClass = "fa-circle-check text-emerald-400";
            } else if (type === "warning") {
                bgClass = "bg-amber-950 border-amber-700 text-amber-100";
                iconClass = "fa-triangle-exclamation text-amber-400";
            } else if (type === "danger") {
                bgClass = "bg-rose-950 border-rose-700 text-rose-100";
                iconClass = "fa-circle-xmark text-rose-400";
            }

            toast.className = `p-3 rounded-2xl border shadow-2xl flex items-center space-x-3 pointer-events-auto transform transition-all duration-300 ease-out text-xs ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${iconClass} text-base shrink-0"></i>
                <div class="flex-1">
                    <p class="font-semibold">${message}</p>
                    <span class="text-[9px] opacity-70">Instant Device Sync Active</span>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3800);
        }

        function triggerBroadcast(text) {
            const bar = document.getElementById('broadcast-bar');
            const txt = document.getElementById('broadcast-text');
            txt.innerText = text;
            bar.classList.remove('hidden');
            showToast(text, "success");
        }

        function dismissBroadcast() {
            document.getElementById('broadcast-bar').classList.add('hidden');
        }

        /* ==========================================================================
           4. AUTHENTICATION & ADMIN PERMISSIONS
           ========================================================================== */
        function openLoginModal() {
            document.getElementById('modal-login').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function checkIsAdmin() {
            return state.currentUser && (state.currentUser.forceNo === state.adminForceNo);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const uname = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            const p = state.personnel.find(item => item.forceNo === uname);
            if (!p) {
                showToast("Force Number not found in MT Nominal Roll!", "danger");
                return;
            }

            const expectedDefault = `Mt@${p.forceNo}`;
            const actualPass = p.customPassword || expectedDefault;

            if (pass !== actualPass) {
                showToast(`Incorrect password! Default format: Mt@${p.forceNo}`, "danger");
                return;
            }

            state.currentUser = p;
            closeModal('modal-login');
            updateUserInterface();
            showToast(`Welcome ${p.rank} ${p.name}! Authentication successful.`, "success");
        }

        function logout() {
            state.currentUser = null;
            updateUserInterface();
            showToast("Logged out successfully.", "info");
        }

        function updateUserInterface() {
            const badge = document.getElementById('header-role-badge');
            const btnContainer = document.getElementById('user-profile-btn-container');
            const addVehBtn = document.getElementById('btn-admin-add-veh');
            const addPrsBtn = document.getElementById('btn-admin-add-prs');

            const isAdmin = checkIsAdmin();

            if (!state.currentUser) {
                badge.innerText = "Guest";
                badge.className = "px-2 py-0.5 text-[10px] rounded-full font-bold uppercase bg-slate-800 text-slate-300 border border-slate-700";
                btnContainer.innerHTML = `
                    <button onclick="openLoginModal()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow transition">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Login</span>
                    </button>
                `;
                if (addVehBtn) addVehBtn.classList.add('hidden');
                if (addPrsBtn) addPrsBtn.classList.add('hidden');
            } else {
                if (isAdmin) {
                    badge.innerText = "ADMIN MASTER";
                    badge.className = "px-2.5 py-0.5 text-[10px] rounded-full font-black uppercase bg-amber-500 text-slate-950 border border-amber-300 shadow";
                    if (addVehBtn) addVehBtn.classList.remove('hidden');
                    if (addPrsBtn) addPrsBtn.classList.remove('hidden');
                } else {
                    badge.innerText = `${state.currentUser.rank}`;
                    badge.className = "px-2 py-0.5 text-[10px] rounded-full font-semibold uppercase bg-sky-950 text-sky-300 border border-sky-800";
                    if (addVehBtn) addVehBtn.classList.add('hidden');
                    if (addPrsBtn) addPrsBtn.classList.add('hidden');
                }

                btnContainer.innerHTML = `
                    <div class="flex items-center gap-2">
                        <button onclick="openPersonnelModal('${state.currentUser.forceNo}')" class="text-left hidden sm:block">
                            <span class="block text-[11px] font-bold text-sky-400 truncate max-w-[120px]">${state.currentUser.name}</span>
                            <span class="block text-[9px] text-slate-400">${state.currentUser.forceNo}</span>
                        </button>
                        <button onclick="logout()" title="Logout" class="bg-slate-800 hover:bg-rose-900/60 text-slate-200 border border-slate-700 p-2 rounded-xl text-xs transition">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                `;
            }

            renderDashboard();
            renderVehiclesList();
            renderPersonnelList();
            renderLogsTable();
            renderDutySection();
            populateFormDropdowns();
        }

        /* ==========================================================================
           5. DASHBOARD CALCULATIONS & RENDERING
           ========================================================================== */
        function calculateStats() {
            const totalVeh = state.vehicles.length;
            const vehDuty = state.vehicles.filter(v => v.status === "ON_DUTY").length;
            const vehOffRoad = state.vehicles.filter(v => v.status === "OFF_ROAD").length;
            const vehCvp = state.vehicles.filter(v => v.status === "UNDER_CVP").length;
            const vehAttachedOut = state.vehicles.filter(v => v.status === "ATTACHED_OUT" || (v.attachment && v.attachment.type === "OUT")).length;

            const totalPrs = state.personnel.length;
            const prsLeave = state.personnel.filter(p => p.status === "LEAVE").length;
            const prsCourse = state.personnel.filter(p => p.status === "COURSE").length;
            const prsAttached = state.personnel.filter(p => p.attachment && p.attachment.type === "OUT").length;
            const prsPresent = state.personnel.filter(p => p.status === "PRESENT").length;

            return {
                totalVeh, vehDuty, vehOffRoad, vehCvp, vehAttachedOut,
                totalPrs, prsLeave, prsCourse, prsAttached, prsPresent
            };
        }

        function renderDashboard() {
            const stats = calculateStats();

            document.getElementById('stat-total-veh').innerText = stats.totalVeh;
            document.getElementById('stat-veh-duty').innerText = `${stats.vehDuty} On Duty`;
            document.getElementById('stat-veh-offroad').innerText = `${stats.vehOffRoad} Off Road`;
            document.getElementById('stat-veh-on-duty').innerText = stats.vehDuty;
            document.getElementById('stat-veh-off-road').innerText = stats.vehOffRoad;
            document.getElementById('stat-veh-cvp').innerText = stats.vehCvp;
            document.getElementById('stat-veh-attached-out').innerText = stats.vehAttachedOut;

            document.getElementById('stat-total-prs').innerText = stats.totalPrs;
            document.getElementById('stat-prs-present').innerText = `${stats.prsPresent} Present`;
            document.getElementById('stat-prs-leave').innerText = `${stats.prsLeave} Leave`;
            document.getElementById('stat-prs-present-count').innerText = stats.prsPresent;
            document.getElementById('stat-prs-leave-count').innerText = stats.prsLeave;
            document.getElementById('stat-prs-course-count').innerText = stats.prsCourse;
            document.getElementById('stat-prs-attached-count').innerText = stats.prsAttached;

            // Live Out Section
            const activeLogs = state.logs.filter(l => l.status === "ACTIVE");
            const liveOutContainer = document.getElementById('dashboard-live-out-list');
            const outBadge = document.getElementById('nav-active-out-badge');
            
            if (activeLogs.length > 0) {
                outBadge.classList.remove('hidden');
                liveOutContainer.innerHTML = activeLogs.map(log => `
                    <div class="bg-rose-950/40 border border-rose-800/50 rounded-xl p-2.5 flex items-center justify-between text-xs">
                        <div>
                            <span class="font-black text-rose-300">${log.vehRegNo}</span>
                            <span class="text-slate-300 block text-[11px]">${log.vehType} • ${log.driverName}</span>
                            <span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock"></i> ${log.outTime} • ${log.purpose}</span>
                        </div>
                        <button onclick="openCheckInModal('${log.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-md transition">
                            Check In
                        </button>
                    </div>
                `).join('');
            } else {
                outBadge.classList.add('hidden');
                liveOutContainer.innerHTML = `
                    <div class="text-center py-4 text-xs text-slate-400">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-lg mb-1 block"></i>
                        No vehicles currently on out-duty. All available in MT Park.
                    </div>
                `;
            }

            // Duty Highlights
            const polHc = state.personnel.find(p => p.forceNo === state.duties.polGuard.hc);
            const polCts = [state.duties.polGuard.ct1, state.duties.polGuard.ct2, state.duties.polGuard.ct3, state.duties.polGuard.ct4]
                .map(fno => state.personnel.find(p => p.forceNo === fno)?.name || fno).join(', ');

            document.getElementById('dash-pol-guard-names').innerHTML = `
                <div><strong class="text-sky-300">HC:</strong> ${polHc ? `${polHc.rank} ${polHc.name}` : 'Not Assigned'}</div>
                <div class="mt-0.5"><strong class="text-sky-300">CTs (1-4):</strong> ${polCts || 'Not Assigned'}</div>
            `;

            const mtparkHc = state.personnel.find(p => p.forceNo === state.duties.mtPark.hc);
            const mtparkCt = state.personnel.find(p => p.forceNo === state.duties.mtPark.ct);

            document.getElementById('dash-mt-park-names').innerHTML = `
                <div><strong class="text-amber-300">HC:</strong> ${mtparkHc ? `${mtparkHc.rank} ${mtparkHc.name}` : 'Not Assigned'}</div>
                <div class="mt-0.5"><strong class="text-amber-300">CT:</strong> ${mtparkCt ? `${mtparkCt.rank} ${mtparkCt.name}` : 'Not Assigned'}</div>
            `;

            document.getElementById('dash-attach-prs-summary').innerText = `${stats.prsAttached} personnel currently attached out of GC AGT`;
        }

        /* ==========================================================================
           6. VEHICLES LIST & ADMIN MANAGEMENT
           ========================================================================== */
        function filterVehicles(filterType) {
            state.vehFilter = filterType;
            document.querySelectorAll('.veh-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === filterType) {
                    btn.className = "veh-filter-btn px-3 py-1.5 rounded-xl bg-sky-600 text-white font-semibold shrink-0";
                } else {
                    btn.className = "veh-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0";
                }
            });
            renderVehiclesList();
        }

        function renderVehiclesList() {
            const query = (document.getElementById('veh-search-input')?.value || '').toLowerCase();
            const container = document.getElementById('vehicles-list-container');
            if (!container) return;

            let filtered = state.vehicles.filter(v => {
                const matchesQuery = v.regNo.toLowerCase().includes(query) || v.type.toLowerCase().includes(query) || v.inCharge.toLowerCase().includes(query);
                if (!matchesQuery) return false;

                if (state.vehFilter === 'ALL') return true;
                if (state.vehFilter === 'AVAILABLE') return v.status === 'AVAILABLE';
                if (state.vehFilter === 'ON_DUTY') return v.status === 'ON_DUTY';
                if (state.vehFilter === 'OFF_ROAD') return v.status === 'OFF_ROAD';
                if (state.vehFilter === 'UNDER_CVP') return v.status === 'UNDER_CVP';
                if (state.vehFilter === 'ATTACHED_OUT') return v.status === 'ATTACHED_OUT' || (v.attachment && v.attachment.type === 'OUT');
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-slate-400">No vehicles match current query.</div>`;
                return;
            }

            const isAdmin = checkIsAdmin();

            container.innerHTML = filtered.map(v => {
                let statusBadge = "";
                if (v.status === "AVAILABLE") {
                    statusBadge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">Available</span>';
                } else if (v.status === "ON_DUTY") {
                    statusBadge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-sky-950 text-sky-300 border border-sky-800">On Duty</span>';
                } else if (v.status === "OFF_ROAD") {
                    statusBadge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-950 text-rose-300 border border-rose-800">Off Road</span>';
                } else if (v.status === "UNDER_CVP") {
                    statusBadge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-800">Under CVP</span>';
                } else if (v.status === "ATTACHED_OUT") {
                    statusBadge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-purple-950 text-purple-300 border border-purple-800">Attached Out</span>';
                }

                return `
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3.5 shadow-sm hover:border-sky-500/50 transition">
                        <div class="flex items-start justify-between cursor-pointer" onclick="openVehicleDetailModal('${v.regNo}')">
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">SL ${v.sl} • Model ${v.year}</span>
                                <h3 class="text-base font-black text-white mt-0.5">${v.regNo}</h3>
                                <p class="text-xs font-semibold text-sky-400">${v.type}</p>
                            </div>
                            ${statusBadge}
                        </div>
                        <div class="mt-3 pt-2.5 border-t border-slate-700/80 grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <span class="text-[10px] text-slate-400 block">Odometer Reading:</span>
                                <strong class="text-slate-200">${v.km.toLocaleString()} KM</strong>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block">In-Charge:</span>
                                <span class="text-slate-200 text-[11px] truncate block font-medium" title="${v.inCharge}">${v.inCharge}</span>
                            </div>
                        </div>
                        ${isAdmin ? `
                            <div class="mt-2.5 pt-2 border-t border-slate-700/60 flex items-center justify-end gap-2 text-xs">
                                <button onclick="openEditVehicleModal('${v.regNo}')" class="text-sky-400 hover:text-sky-300 font-semibold px-2 py-1 rounded bg-slate-900 border border-slate-700">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit
                                </button>
                                <button onclick="deleteVehicle('${v.regNo}')" class="text-rose-400 hover:text-rose-300 font-semibold px-2 py-1 rounded bg-slate-900 border border-slate-700">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function openVehicleDetailModal(regNo) {
            const v = state.vehicles.find(item => item.regNo === regNo);
            if (!v) return;

            const logs = state.logs.filter(l => l.vehRegNo === regNo);
            const modalContent = document.getElementById('veh-modal-content');
            const isAdmin = checkIsAdmin();

            modalContent.innerHTML = `
                <div class="border-b border-slate-700 pb-3 mb-3">
                    <span class="text-[10px] font-bold bg-sky-950 text-sky-300 border border-sky-800 px-2 py-0.5 rounded uppercase">Vehicle Logbook Ledger</span>
                    <h2 class="text-xl font-black text-white mt-1">${v.regNo}</h2>
                    <p class="text-xs text-slate-400">${v.type} | Model Year: ${v.year} | Fuel: ${v.fuelType}</p>
                </div>

                <div class="bg-slate-950/60 p-3 rounded-2xl border border-slate-800 grid grid-cols-2 gap-3 text-xs mb-4">
                    <div>
                        <span class="text-[10px] text-slate-400 block">Vehicle In-Charge:</span>
                        <strong class="text-white text-xs">${v.inCharge}</strong>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block">Current Odometer:</span>
                        <strong class="text-sky-400 text-sm font-black">${v.km.toLocaleString()} KM</strong>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block">Fleet Status:</span>
                        <strong class="text-white">${v.status}</strong>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block">Attachment:</span>
                        <span class="text-slate-300">${v.attachment?.type === 'OUT' ? `Attached Out (${v.attachment.location})` : 'Stationed at GC AGT'}</span>
                    </div>
                </div>

                <!-- Admin Status Modifiers -->
                ${isAdmin ? `
                    <div class="bg-amber-950/40 border border-amber-800/50 p-2.5 rounded-xl text-xs mb-4">
                        <span class="font-bold text-amber-300 block mb-1.5">Admin Quick Status Override:</span>
                        <div class="flex flex-wrap gap-1.5">
                            <button onclick="changeVehStatus('${v.regNo}', 'AVAILABLE')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[10px] font-bold">Available</button>
                            <button onclick="changeVehStatus('${v.regNo}', 'OFF_ROAD')" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-[10px] font-bold">Off Road</button>
                            <button onclick="changeVehStatus('${v.regNo}', 'UNDER_CVP')" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded-lg text-[10px] font-bold">Under CVP</button>
                        </div>
                    </div>
                ` : ''}

                <!-- Logbook History -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-white text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-book-journal-whills text-sky-400"></i> Trip Run History
                        </h4>
                        <button onclick="exportSingleVehicleLogPDF('${v.regNo}')" class="text-[10px] text-rose-300 hover:text-white bg-slate-800 border border-slate-700 px-2 py-0.5 rounded flex items-center gap-1">
                            <i class="fa-solid fa-file-pdf"></i> Export Vehicle PDF
                        </button>
                    </div>
                    <div class="space-y-2 text-xs max-h-48 overflow-y-auto">
                        ${logs.length > 0 ? logs.map(l => `
                            <div class="border border-slate-800 rounded-xl p-2.5 bg-slate-950/80 text-[11px] space-y-1">
                                <div class="flex justify-between font-bold">
                                    <span class="text-slate-200">${l.driverName}</span>
                                    <span class="${l.status === 'ACTIVE' ? 'text-rose-400' : 'text-emerald-400'}">${l.status === 'ACTIVE' ? 'Active Out' : 'Trip Completed'}</span>
                                </div>
                                <div class="text-slate-400 text-[10px]">Out: ${l.outTime} (${l.outKm} KM)</div>
                                ${l.inTime ? `<div class="text-slate-400 text-[10px]">In: ${l.inTime} (${l.inKm} KM) | <strong class="text-sky-300">Run: ${l.totalKm} KM</strong></div>` : ''}
                                <div class="text-slate-300">Purpose: ${l.purpose}</div>
                            </div>
                        `).join('') : '<p class="text-slate-500 text-center py-2">No historical trips logged yet.</p>'}
                    </div>
                </div>
            `;

            document.getElementById('modal-vehicle-detail').classList.remove('hidden');
        }

        function changeVehStatus(regNo, newStatus) {
            const v = state.vehicles.find(item => item.regNo === regNo);
            if (v) {
                v.status = newStatus;
                triggerBroadcast(`Vehicle ${v.regNo} status updated to '${newStatus}'`);
                openVehicleDetailModal(regNo);
                renderDashboard();
                renderVehiclesList();
            }
        }

        function openAddVehicleModal() {
            document.getElementById('modal-veh-title').innerText = "Add New Vehicle";
            document.getElementById('admin-veh-orig-reg').value = "";
            document.getElementById('admin-veh-form').reset();
            document.getElementById('modal-add-vehicle').classList.remove('hidden');
        }

        function openEditVehicleModal(regNo) {
            const v = state.vehicles.find(item => item.regNo === regNo);
            if (!v) return;

            document.getElementById('modal-veh-title').innerText = "Edit Vehicle: " + v.regNo;
            document.getElementById('admin-veh-orig-reg').value = v.regNo;
            document.getElementById('admin-veh-reg').value = v.regNo;
            document.getElementById('admin-veh-type').value = v.type;
            document.getElementById('admin-veh-year').value = v.year;
            document.getElementById('admin-veh-km').value = v.km;
            document.getElementById('admin-veh-status').value = v.status;
            document.getElementById('admin-veh-incharge').value = v.inCharge;

            document.getElementById('modal-add-vehicle').classList.remove('hidden');
        }

        function handleAdminSaveVehicle(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only Admin can perform this action!", "danger");
                return;
            }

            const origReg = document.getElementById('admin-veh-orig-reg').value;
            const regNo = document.getElementById('admin-veh-reg').value.trim().toUpperCase();
            const type = document.getElementById('admin-veh-type').value.trim().toUpperCase();
            const year = parseInt(document.getElementById('admin-veh-year').value, 10);
            const km = parseInt(document.getElementById('admin-veh-km').value, 10);
            const status = document.getElementById('admin-veh-status').value;
            const inCharge = document.getElementById('admin-veh-incharge').value.trim();

            if (origReg) {
                // Edit existing
                const v = state.vehicles.find(item => item.regNo === origReg);
                if (v) {
                    v.regNo = regNo;
                    v.type = type;
                    v.year = year;
                    v.km = km;
                    v.status = status;
                    v.inCharge = inCharge;
                    triggerBroadcast(`Vehicle ${regNo} record updated.`);
                }
            } else {
                // Add new
                const newVeh = {
                    sl: state.vehicles.length + 1,
                    regNo,
                    type,
                    year,
                    km,
                    status,
                    inCharge: inCharge || "MT Section",
                    fuelType: "Diesel",
                    attachment: { type: "NONE", location: "GC AGT" }
                };
                state.vehicles.push(newVeh);
                triggerBroadcast(`New vehicle ${regNo} added to fleet.`);
            }

            closeModal('modal-add-vehicle');
            renderDashboard();
            renderVehiclesList();
            populateFormDropdowns();
        }

        function deleteVehicle(regNo) {
            if (!checkIsAdmin()) {
                showToast("Only Admin can delete records!", "danger");
                return;
            }
            state.vehicles = state.vehicles.filter(v => v.regNo !== regNo);
            triggerBroadcast(`Vehicle ${regNo} removed from fleet.`);
            renderDashboard();
            renderVehiclesList();
            populateFormDropdowns();
        }

        /* ==========================================================================
           7. PERSONNEL LIST & FULL DETAILS (PHOTO UPLOAD, DL & ADMIN CONTROLS)
           ========================================================================== */
        function filterPersonnel(cadreType) {
            state.prsFilter = cadreType;
            document.querySelectorAll('.prs-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === cadreType) {
                    btn.className = "prs-filter-btn px-3 py-1.5 rounded-xl bg-sky-600 text-white font-semibold shrink-0";
                } else {
                    btn.className = "prs-filter-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 font-medium shrink-0";
                }
            });
            renderPersonnelList();
        }

        function renderPersonnelList() {
            const query = (document.getElementById('prs-search-input')?.value || '').toLowerCase();
            const container = document.getElementById('personnel-list-container');
            if (!container) return;

            let filtered = state.personnel.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || p.forceNo.includes(query) || p.rank.toLowerCase().includes(query);
                if (!matchesQuery) return false;

                if (state.prsFilter === 'ALL') return true;
                if (state.prsFilter === 'SO') return p.cadre === 'SO';
                if (state.prsFilter === 'HC_DVR') return p.cadre === 'HC_DVR';
                if (state.prsFilter === 'CT_DVR') return p.cadre === 'CT_DVR';
                if (state.prsFilter === 'WORKSHOP') return p.cadre === 'WORKSHOP';
                if (state.prsFilter === 'LEAVE') return p.status === 'LEAVE';
                if (state.prsFilter === 'COURSE') return p.status === 'COURSE';
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-slate-400">No personnel found.</div>`;
                return;
            }

            const isAdmin = checkIsAdmin();

            container.innerHTML = filtered.map(p => {
                let badgeClass = "bg-emerald-950 text-emerald-300 border border-emerald-800";
                let statusLabel = "Present";
                if (p.status === "LEAVE") {
                    badgeClass = "bg-amber-950 text-amber-300 border border-amber-800";
                    statusLabel = "Leave";
                } else if (p.status === "COURSE") {
                    badgeClass = "bg-indigo-950 text-indigo-300 border border-indigo-800";
                    statusLabel = "Course";
                }

                const isDriverCadre = (p.cadre === 'HC_DVR' || p.cadre === 'CT_DVR' || p.isDriver);
                const dlBadge = isDriverCadre ? `
                    <div class="mt-2 text-[10px] bg-slate-950/70 border border-slate-800 p-1.5 rounded-xl text-slate-300">
                        <span class="font-bold text-slate-400">DL:</span> ${p.dlNo || 'N/A'} • <span class="font-bold text-slate-400">Valid:</span> <span class="text-rose-400 font-semibold">${p.dlValidity || 'N/A'}</span>
                    </div>
                ` : '';

                const isAdm = (p.forceNo === state.adminForceNo);

                return `
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3.5 shadow-sm hover:border-emerald-500/50 transition">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="openPersonnelModal('${p.forceNo}')">
                            <div class="relative shrink-0">
                                ${p.photo ? `
                                    <img src="${p.photo}" class="w-12 h-12 rounded-2xl object-cover border border-slate-600">
                                ` : `
                                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-900 to-sky-950 text-sky-400 border border-slate-700 flex items-center justify-center font-black text-sm shadow">
                                        ${p.name.charAt(0)}
                                    </div>
                                `}
                                ${isAdm ? '<span class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-black shadow" title="Admin">👑</span>' : ''}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between">
                                    <span class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">${p.rank}</span>
                                    <span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${badgeClass}">${statusLabel}</span>
                                </div>
                                <h3 class="text-xs font-bold text-white truncate">${p.name}</h3>
                                <p class="text-[11px] text-slate-400 font-mono">${p.forceNo}</p>
                            </div>
                        </div>
                        ${dlBadge}
                        ${isAdmin ? `
                            <div class="mt-2.5 pt-2 border-t border-slate-700/60 flex items-center justify-end gap-2 text-xs">
                                <button onclick="openEditPersonnelModal('${p.forceNo}')" class="text-sky-400 hover:text-sky-300 font-semibold px-2 py-1 rounded bg-slate-900 border border-slate-700">
                                    <i class="fa-solid fa-user-pen"></i> Edit
                                </button>
                                <button onclick="deletePersonnel('${p.forceNo}')" class="text-rose-400 hover:text-rose-300 font-semibold px-2 py-1 rounded bg-slate-900 border border-slate-700">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function openPersonnelModal(forceNo) {
            const p = state.personnel.find(item => item.forceNo === forceNo);
            if (!p) return;

            const modalContent = document.getElementById('prs-modal-content');
            const isDriver = (p.cadre === 'HC_DVR' || p.cadre === 'CT_DVR' || p.isDriver);
            const isAdmin = checkIsAdmin();
            const isUserAdminCurrent = (p.forceNo === state.adminForceNo);

            modalContent.innerHTML = `
                <div class="text-center mb-4">
                    <div class="relative inline-block mx-auto mb-2">
                        ${p.photo ? `
                            <img src="${p.photo}" class="w-24 h-24 rounded-3xl object-cover border-2 border-sky-500 shadow-xl">
                        ` : `
                            <div class="w-24 h-24 rounded-3xl bg-slate-950 text-sky-400 font-black text-3xl flex items-center justify-center border-2 border-sky-500 shadow-xl">
                                ${p.name.charAt(0)}
                            </div>
                        `}
                        ${isUserAdminCurrent ? '<span class="absolute -bottom-1 -right-1 bg-amber-500 text-slate-950 font-black text-xs px-2 py-0.5 rounded-full shadow">ADMIN</span>' : ''}
                    </div>
                    <h3 class="text-lg font-black text-white">${p.rank} ${p.name}</h3>
                    <p class="text-xs font-mono text-slate-400">Force No: ${p.forceNo}</p>
                    <p class="text-xs font-semibold text-sky-400 mt-0.5">Cadre: ${p.cadre === 'SO' ? "SO's Cadre" : p.cadre}</p>
                </div>

                <!-- Admin Photo Upload -->
                ${isAdmin ? `
                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-2xl mb-3 text-xs">
                        <span class="font-bold text-amber-300 block mb-1">Admin: Upload / Change Photo</span>
                        <input type="file" accept="image/*" onchange="handleAdminPhotoUpload('${p.forceNo}', event)" class="block w-full text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-xl file:border-0 file:text-[11px] file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500">
                    </div>
                ` : ''}

                <!-- Details Grid -->
                <div class="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-2 text-xs mb-4">
                    <div class="flex justify-between py-1 border-b border-slate-800">
                        <span class="text-slate-400">Mobile Phone:</span>
                        <a href="tel:${p.phone}" class="font-bold text-emerald-400 flex items-center gap-1">
                            <i class="fa-solid fa-phone"></i> ${p.phone}
                        </a>
                    </div>
                    <div class="flex justify-between py-1 border-b border-slate-800">
                        <span class="text-slate-400">Attendance Status:</span>
                        <strong class="text-white">${p.status}</strong>
                    </div>

                    ${isDriver ? `
                        <div class="flex justify-between py-1 border-b border-slate-800">
                            <span class="text-slate-400">Driving License No:</span>
                            <strong class="font-mono text-white">${p.dlNo || 'Not Available'}</strong>
                        </div>
                        <div class="flex justify-between py-1 border-b border-slate-800">
                            <span class="text-slate-400">DL Validity:</span>
                            <strong class="font-semibold text-rose-400">${p.dlValidity || 'Not Available'}</strong>
                        </div>
                    ` : `
                        <div class="py-1 text-slate-500 italic text-[11px]">
                            * Driving License and validity are applicable only for Drivers.
                        </div>
                    `}

                    <div class="flex justify-between py-1">
                        <span class="text-slate-400">Attachment:</span>
                        <strong class="text-purple-400">${p.attachment?.type === 'OUT' ? `Attached Out (${p.attachment.location})` : 'Present at GC AGT'}</strong>
                    </div>
                </div>

                <!-- Admin Status Modifiers -->
                ${isAdmin ? `
                    <div class="space-y-2 mb-3">
                        <label class="block text-xs font-bold text-slate-300">Admin: Quick Attendance Update</label>
                        <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                            <button onclick="changePersonnelStatus('${p.forceNo}', 'PRESENT')" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-center transition">Present</button>
                            <button onclick="changePersonnelStatus('${p.forceNo}', 'LEAVE')" class="bg-amber-600 hover:bg-amber-500 text-slate-950 py-2 rounded-xl text-center transition">Leave</button>
                            <button onclick="changePersonnelStatus('${p.forceNo}', 'COURSE')" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-center transition">Course</button>
                        </div>
                    </div>
                ` : ''}

                <!-- Direct Phone Action -->
                <a href="tel:${p.phone}" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 transition">
                    <i class="fa-solid fa-phone-volume"></i> Direct Call (${p.phone})
                </a>
            `;

            document.getElementById('modal-personnel-detail').classList.remove('hidden');
