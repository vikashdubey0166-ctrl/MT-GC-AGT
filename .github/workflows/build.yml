            // 1. VEHICLES SCREEN WITH ADMIN CONTROLS
            void _openVehicles(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.85,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('वाहन रिकॉर्ड (40 Vehicles)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            if (isAdmin)
                              ElevatedButton.icon(
                                icon: const Icon(Icons.add, size: 16),
                                label: const Text('नई गाड़ी'),
                                onPressed: () {
                                  _addVehicleDialog(ctx, () {
                                    setSheetState(() {});
                                    setState(() {});
                                  });
                                },
                              ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTData.vehicles.length,
                            itemBuilder: (ctx, i) {
                              final v = MTData.vehicles[i];
                              Color col = Colors.green;
                              if (v['status'] == 'ON_DUTY') col = Colors.blue;
                              if (v['status'] == 'OFF_ROAD') col = Colors.red;

                              return Card(
                                child: ListTile(
                                  leading: CircleAvatar(
                                    backgroundColor: col.withOpacity(0.15),
                                    child: Icon(Icons.directions_car, color: col),
                                  ),
                                  title: Text('${v['no']} (${v['type']})', style: const TextStyle(fontWeight: FontWeight.bold)),
                                  subtitle: Text('मीटर रीडिंग: ${v['km']} KM'),
                                  trailing: DropdownButton<String>(
                                    value: v['status'],
                                    underline: Container(),
                                    items: ['AVAILABLE', 'ON_DUTY', 'OFF_ROAD'].map((st) {
                                      return DropdownMenuItem(value: st, child: Text(st, style: const TextStyle(fontSize: 12)));
                                    }).toList(),
                                    onChanged: isAdmin ? (newSt) {
                                      setSheetState(() {
                                        v['status'] = newSt;
                                      });
                                      setState(() {});
                                    } : null,
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _addVehicleDialog(BuildContext ctx, VoidCallback onAdded) {
              final noCtrl = TextEditingController();
              final typeCtrl = TextEditingController();
              final kmCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => AlertDialog(
                  title: const Text('नई गाड़ी जोड़ें'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: noCtrl, decoration: const InputDecoration(labelText: 'गाड़ी नंबर (उदा. TR01-A-0000)')),
                      TextField(controller: typeCtrl, decoration: const InputDecoration(labelText: 'प्रकार (Gypsy/Bus/Truck)')),
                      TextField(controller: kmCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'मीटर KM')),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () {
                        if (noCtrl.text.isNotEmpty) {
                          MTData.vehicles.add({
                            'no': noCtrl.text.trim().toUpperCase(),
                            'type': typeCtrl.text.trim().toUpperCase(),
                            'status': 'AVAILABLE',
                            'km': int.tryParse(kmCtrl.text) ?? 0,
                          });
                          Navigator.pop(dCtx);
                          onAdded();
                        }
                      },
                      child: const Text('सुरक्षित करें'),
                    ),
                  ],
                ),
              );
            }

            // 2. LOGBOOK SCREEN
            void _openLogBook(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.85,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('डिजिटल लॉग बुक (कार पास)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            ElevatedButton.icon(
                              icon: const Icon(Icons.add, size: 16),
                              label: const Text('गाड़ी आउट करें'),
                              onPressed: () => _addTripDialog(ctx, () {
                                setSheetState(() {});
                                setState(() {});
                              }),
                            ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTData.trips.length,
                            itemBuilder: (ctx, i) {
                              final t = MTData.trips[i];
                              final bool isActive = t['status'] == 'ACTIVE';

                              return Card(
                                child: ListTile(
                                  title: Text('${t['vehicle']} - ${t['purpose']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                  subtitle: Text('चालक: ${t['driver']} | ओपनिंग KM: ${t['km']}'),
                                  trailing: isActive
                                      ? ElevatedButton(
                                          style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, foregroundColor: Colors.white),
                                          onPressed: () {
                                            setSheetState(() {
                                              t['status'] = 'COMPLETED';
                                            });
                                            setState(() {});
                                          },
                                          child: const Text('इन करें', style: TextStyle(fontSize: 11)),
                                        )
                                      : const Chip(label: Text('वापस (In)')),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _addTripDialog(BuildContext ctx, VoidCallback onAdded) {
              String selectedVeh = MTData.vehicles[0]['no'];
              String selectedDvr = MTData.staffList[3]['name'];
              final purCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('गाड़ी रवानगी (Trip Out)'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: selectedVeh,
                          decoration: const InputDecoration(labelText: 'गाड़ी चुनें'),
                          items: MTData.vehicles.map<DropdownMenuItem<String>>((v) {
                            return DropdownMenuItem(value: v['no'] as String, child: Text(v['no'] as String, style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedVeh = val!),
                        ),
                        DropdownButtonFormField<String>(
                          value: selectedDvr,
                          decoration: const InputDecoration(labelText: 'ड्राइवर चुनें'),
                          items: MTData.staffList.map<DropdownMenuItem<String>>((s) {
                            return DropdownMenuItem(value: s['name'] as String, child: Text('${s['rank']} ${s['name']}', style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedDvr = val!),
                        ),
                        TextField(controller: purCtrl, decoration: const InputDecoration(labelText: 'ड्यूटी का उद्देश्य')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          if (purCtrl.text.isNotEmpty) {
                            MTData.trips.insert(0, {
                              'vehicle': selectedVeh,
                              'driver': selectedDvr,
                              'purpose': purCtrl.text.trim(),
                              'status': 'ACTIVE',
                              'km': 0
                            });
                            Navigator.pop(dCtx);
                            onAdded();
                          }
                        },
                        child: const Text('आउट दर्ज करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // 3. LEAVE SCREEN
            void _openLeaves(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.85,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('अवकाश रिकॉर्ड (Leaves)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            ElevatedButton.icon(
                              icon: const Icon(Icons.add, size: 16),
                              label: const Text('छुट्टी अर्जी'),
                              onPressed: () => _applyLeaveDialog(ctx, () {
                                setSheetState(() {});
                                setState(() {});
                              }),
                            ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTData.leaves.length,
                            itemBuilder: (ctx, i) {
                              final l = MTData.leaves[i];
                              Color bg = Colors.orange;
                              if (l['status'] == 'APPROVED') bg = Colors.green;
                              if (l['status'] == 'REJECTED') bg = Colors.red;

                              return Card(
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(l['name'], style: const TextStyle(fontWeight: FontWeight.bold)),
                                          Chip(label: Text(l['status']), backgroundColor: bg.withOpacity(0.15)),
                                        ],
                                      ),
                                      Text('प्रकार: ${l['type']} | अवधि: ${l['days']} दिन | कारण: ${l['reason']}'),
                                      if (isAdmin && l['status'] == 'PENDING')
                                        Row(
                                          mainAxisAlignment: MainAxisAlignment.end,
                                          children: [
                                            TextButton(
                                              onPressed: () {
                                                setSheetState(() => l['status'] = 'REJECTED');
                                                setState(() {});
                                              },
                                              child: const Text('अस्वीकार', style: TextStyle(color: Colors.red)),
                                            ),
                                            ElevatedButton(
                                              style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                                              onPressed: () {
                                                setSheetState(() => l['status'] = 'APPROVED');
                                                final staff = MTData.staffList.firstWhere((s) => s['force'] == l['force'], orElse: () => {});
                                                if (staff.isNotEmpty) staff['status'] = 'LEAVE';
                                                setState(() {});
                                              },
                                              child: const Text('मंजूर करें'),
                                            ),
                                          ],
                                        )
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _applyLeaveDialog(BuildContext ctx, VoidCallback onAdded) {
              String type = 'CL';
              final daysCtrl = TextEditingController(text: '2');
              final rsnCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('छुट्टी के लिए आवेदन'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: type,
                          decoration: const InputDecoration(labelText: 'प्रकार'),
                          items: ['CL', 'EL', 'MEDICAL', 'REST'].map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                          onChanged: (val) => setDlg(() => type = val!),
                        ),
                        TextField(controller: daysCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'दिन')),
                        TextField(controller: rsnCtrl, decoration: const InputDecoration(labelText: 'कारण')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          MTData.leaves.insert(0, {
                            'force': widget.currentUser['force'],
                            'name': '${widget.currentUser['rank']} ${widget.currentUser['name']}',
                            'type': type,
                            'days': int.tryParse(daysCtrl.text) ?? 1,
                            'reason': rsnCtrl.text.trim(),
                            'status': 'PENDING'
                          });
                          Navigator.pop(dCtx);
                          onAdded();
                        },
                        child: const Text('आवेदन भेजें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // 4. STAFF MANAGEMENT SCREEN (ADMIN EDIT STATUS & PASSWORD)
            void _openStaff(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.85,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('एम टी स्टाफ विवरण (45 Staff)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            if (isAdmin)
                              ElevatedButton.icon(
                                icon: const Icon(Icons.person_add, size: 16),
                                label: const Text('नया स्टाफ'),
                                onPressed: () => _addStaffDialog(ctx, () {
                                  setSheetState(() {});
                                  setState(() {});
                                }),
                              ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTData.staffList.length,
                            itemBuilder: (ctx, i) {
                              final s = MTData.staffList[i];
                              Color statusCol = Colors.green;
                              if (s['status'] == 'LEAVE') statusCol = Colors.orange;
                              if (s['status'] == 'SICK') statusCol = Colors.red;

                              return Card(
                                child: ListTile(
                                  leading: CircleAvatar(child: Text(s['name'][0])),
                                  title: Text('${s['rank']} ${s['name']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                  subtitle: Text('फोर्स सं: ${s['force']} | रोल: ${s['role']} | मो: ${s['mobile']}'),
                                  trailing: isAdmin
                                      ? DropdownButton<String>(
                                          value: s['status'],
                                          underline: Container(),
                                          items: ['PRESENT', 'ON_DUTY', 'LEAVE', 'SICK', 'REST'].map((st) {
                                            return DropdownMenuItem(value: st, child: Text(st, style: const TextStyle(fontSize: 11)));
                                          }).toList(),
                                          onChanged: (newSt) {
                                            setSheetState(() {
                                              s['status'] = newSt;
                                            });
                                            setState(() {});
                                          },
                                        )
                                      : Chip(label: Text(s['status'])),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _addStaffDialog(BuildContext ctx, VoidCallback onAdded) {
              final forceCtrl = TextEditingController();
              final nameCtrl = TextEditingController();
              final rankCtrl = TextEditingController(text: 'CT/DVR');
              final mobCtrl = TextEditingController();
              String role = 'DRIVER';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('नया स्टाफ जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: forceCtrl, decoration: const InputDecoration(labelText: 'फोर्स नंबर (User ID)')),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'नाम')),
                          TextField(controller: rankCtrl, decoration: const InputDecoration(labelText: 'रैंक (Rank)')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल नंबर')),
                          DropdownButtonFormField<String>(
                            value: role,
                            decoration: const InputDecoration(labelText: 'रोल'),
                            items: ['DRIVER', 'CLERK', 'ADMIN', 'WORKSHOP'].map((r) => DropdownMenuItem(value: r, child: Text(r))).toList(),
                            onChanged: (val) => setDlg(() => role = val!),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          if (forceCtrl.text.isNotEmpty && nameCtrl.text.isNotEmpty) {
                            MTData.staffList.add({
                              'force': forceCtrl.text.trim().toUpperCase(),
                              'name': nameCtrl.text.trim().toUpperCase(),
                              'rank': rankCtrl.text.trim().toUpperCase(),
                              'mobile': mobCtrl.text.trim(),
                              'role': role,
                              'status': 'PRESENT',
                            });
                            Navigator.pop(dCtx);
                            onAdded();
                          }
                        },
                        child: const Text('जोड़ें'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
