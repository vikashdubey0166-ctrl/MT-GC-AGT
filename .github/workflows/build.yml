            // ================= ADD / EDIT VEHICLE DIALOG (ADMIN ONLY) =================
            void _addOrEditVehicleDialog(BuildContext ctx, Map<String, dynamic>? vehicle, VoidCallback onDone) {
              final isEdit = vehicle != null;
              final noCtrl = TextEditingController(text: isEdit ? vehicle['no'] : '');
              final typeCtrl = TextEditingController(text: isEdit ? vehicle['type'] : '');
              final dvrCtrl = TextEditingController(text: isEdit ? vehicle['driver_incharge'] : 'अनावंटित');
              final purCtrl = TextEditingController(text: isEdit ? vehicle['duty_purpose'] : '-');
              String status = isEdit ? vehicle['status'] : 'AVAILABLE';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text(isEdit ? 'वाहन विवरण संशोधित करें' : 'नया वाहन जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: noCtrl, decoration: const InputDecoration(labelText: 'गाड़ी नंबर')),
                          TextField(controller: typeCtrl, decoration: const InputDecoration(labelText: 'प्रकार')),
                          DropdownButtonFormField<String>(
                            value: ['AVAILABLE', 'ON_DUTY', 'OFF_ROAD', 'ATTACHED'].contains(status) ? status : 'AVAILABLE',
                            decoration: const InputDecoration(labelText: 'वर्तमान स्थिति'),
                            items: ['AVAILABLE', 'ON_DUTY', 'OFF_ROAD', 'ATTACHED']
                                .map((st) => DropdownMenuItem(value: st, child: Text(st))).toList(),
                            onChanged: (val) => setD(() => status = val!),
                          ),
                          TextField(controller: dvrCtrl, decoration: const InputDecoration(labelText: 'इंचार्ज चालक')),
                          TextField(controller: purCtrl, decoration: const InputDecoration(labelText: 'वर्तमान ड्यूटी / कार्य विवरण')),
                        ],
                      ),
                    ),
                    actions: [
                      if (isEdit)
                        TextButton(
                          style: TextButton.styleFrom(foregroundColor: Colors.red),
                          onPressed: () async {
                            MTStorage.vehicles.remove(vehicle);
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onDone();
                          },
                          child: const Text('हटाएं'),
                        ),
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (noCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              vehicle['no'] = noCtrl.text.trim().toUpperCase();
                              vehicle['type'] = typeCtrl.text.trim().toUpperCase();
                              vehicle['status'] = status;
                              vehicle['driver_incharge'] = dvrCtrl.text.trim();
                              vehicle['duty_purpose'] = purCtrl.text.trim();
                            } else {
                              MTStorage.vehicles.insert(0, {
                                'no': noCtrl.text.trim().toUpperCase(),
                                'type': typeCtrl.text.trim().toUpperCase(),
                                'category': 'LIGHT VEHICLE (LV)',
                                'status': status,
                                'driver_incharge': dvrCtrl.text.trim(),
                                'attach_type': 'NONE',
                                'attach_loc': 'GC AGT',
                                'duty_purpose': purCtrl.text.trim(),
                                'model_year': '2023',
                                'cost': '10,00,000',
                                'fuel_cap': '50 Ltr',
                                'total_km': '10,000'
                              });
                            }
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onDone();
                          }
                        },
                        child: const Text('सेव करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // ================= PDF EXPORTS (ADMIN EXCLUSIVE) =================
            Future<void> _exportStaffListPdf(String title, List<Map<String, dynamic>> list) async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.MultiPage(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(20),
                  header: (pw.Context ctx) => pw.Column(
                    children: [
                      pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                      pw.Center(child: pw.Text('$title - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10))),
                      pw.SizedBox(height: 8),
                    ],
                  ),
                  build: (pw.Context ctx) => [
                    pw.Table(
                      border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                      children: [
                        pw.TableRow(
                          decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                          children: ['SL', 'FORCE NO', 'RANK', 'NAME', 'STATUS', 'ATTACH/OFFICE', 'EL', 'CL', 'PL'].map((h) => pw.Container(
                            padding: const pw.EdgeInsets.all(3),
                            alignment: pw.Alignment.center,
                            child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 7.5)),
                          )).toList(),
                        ),
                        ...list.asMap().entries.map((e) {
                          final i = e.key + 1;
                          final s = e.value;
                          final att = s['attach_type'] != 'NONE' ? '${s['attach_type']}\n(${s['attach_office']})' : '-';
                          return pw.TableRow(
                            children: [
                              '$i',
                              s['force'] ?? '',
                              s['rank'] ?? '',
                              s['name'] ?? '',
                              s['status'] ?? '',
                              att,
                              '${s['el_bal'] ?? ''}',
                              '${s['cl_bal'] ?? ''}',
                              '${s['pl_bal'] ?? 30}',
                            ].map((c) => pw.Container(
                              padding: const pw.EdgeInsets.symmetric(vertical: 2.5, horizontal: 2),
                              alignment: pw.Alignment.center,
