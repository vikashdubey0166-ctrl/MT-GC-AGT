            void _addOrEditVehicleDialog(Map<String, dynamic>? v, VoidCallback onDone) {
              final isEdit = v != null;
              final noCtrl = TextEditingController(text: isEdit ? v['no'] : '');
              final typeCtrl = TextEditingController(text: isEdit ? v['type'] : '');
              final mfgCtrl = TextEditingController(text: isEdit ? v['model_year'] : '2023');
              final commCtrl = TextEditingController(text: isEdit ? (v['commission_date'] ?? v['reg_date']) : DateFormat('dd/MM/yyyy').format(DateTime.now()));
