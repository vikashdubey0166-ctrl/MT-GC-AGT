            void _openLeaves(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.88,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('अवकाश रिकॉर्ड (संभव लीव पास)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                              icon: const Icon(Icons.add, size: 16),
                              label: const Text('छुट्टी अर्जी दें'),
                              onPressed: () => _applyLeaveDialog(ctx, () async {
                                await MTStorage.saveData();
                                setSheetState(() {});
                                setState(() {});
                              }),
                            ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTStorage.leaves.length,
                            itemBuilder: (ctx, i) {
                              final l = MTStorage.leaves[i];
                              Color bg = Colors.orange;
                              if (l['status'] == 'APPROVED') bg = Colors.green;
                              if (l['status'] == 'REJECTED') bg = Colors.red;

                              return Card(
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(l['name'], style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                                          Chip(label: Text(l['status']), backgroundColor: bg.withOpacity(0.15)),
                                        ],
                                      ),
                                      Text('अवकाश प्रकार: ${l['type']} | कुल दिन: ${l['total_days']} दिन (Sunday/RH: ${l['sundays_rh'] ?? 0})'),
                                      Text('अवधि: ${l['from_date']} से ${l['to_date']}'),
                                      Text('रिपोर्टिंग दिनांक: ${l['reporting_date']}'),
                                      Text('कारण: ${l['reason']}'),
                                      if (isAdmin && l['status'] == 'PENDING')
                                        Padding(
                                          padding: const EdgeInsets.only(top: 8.0),
                                          child: Row(
                                            mainAxisAlignment: MainAxisAlignment.end,
                                            children: [
                                              OutlinedButton(
                                                style: OutlinedButton.styleFrom(foregroundColor: Colors.red),
                                                onPressed: () async {
                                                  l['status'] = 'REJECTED';
                                                  await MTStorage.saveData();
                                                  setSheetState(() {});
                                                  setState(() {});
                                                },
                                                child: const Text('अस्वीकार'),
                                              ),
                                              const SizedBox(width: 8),
                                              ElevatedButton(
                                                style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                                                onPressed: () async {
                                                  l['status'] = 'APPROVED';
                                                  final staff = MTStorage.staffList.firstWhere((s) => s['force'] == l['force'], orElse: () => {});
                                                  if (staff.isNotEmpty) {
                                                    staff['status'] = 'LEAVE';
                                                    int daysToDeduct = l['total_days'] ?? 1;
                                                    if (l['type'] == 'EL') {
                                                      staff['el_bal'] = (staff['el_bal'] - daysToDeduct).clamp(0, 60);
                                                    } else if (l['type'] == 'CL') {
                                                      staff['cl_bal'] = (staff['cl_bal'] - daysToDeduct).clamp(0, 15);
                                                    }
                                                  }
                                                  await MTStorage.saveData();
                                                  setSheetState(() {});
                                                  setState(() {});
                                                },
                                                child: const Text('मंजूर करें (Approve)'),
                                              ),
                                            ],
                                          ),
                                        )
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _applyLeaveDialog(BuildContext ctx, VoidCallback onAdded) {
              String type = 'EL';
              final fromCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now()));
              final toCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now().add(const Duration(days: 30))));
              final sunCtrl = TextEditingController(text: '4');
              final totalCtrl = TextEditingController(text: '30');
              final repCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now().add(const Duration(days: 31))));
              final rsnCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('संभव लीव पास आवेदन'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          DropdownButtonFormField<String>(
                            value: type,
                            decoration: const InputDecoration(labelText: 'अवकाश प्रकार'),
                            items: ['EL', 'CL', 'P/L', 'MEDICAL'].map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                            onChanged: (val) => setDlg(() => type = val!),
                          ),
                          TextField(controller: fromCtrl, decoration: const InputDecoration(labelText: 'शुरू दिनांक (YYYY-MM-DD)')),
                          TextField(controller: toCtrl, decoration: const InputDecoration(labelText: 'समाप्ति दिनांक (YYYY-MM-DD)')),
                          TextField(controller: sunCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'रविवार एवं आर.एच. (संख्या)')),
                          TextField(controller: totalCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'कुल स्वीकृत अवकाश दिन')),
                          TextField(controller: repCtrl, decoration: const InputDecoration(labelText: 'रिपोर्टिंग दिनांक (YYYY-MM-DD)')),
                          TextField(controller: rsnCtrl, decoration: const InputDecoration(labelText: 'अवकाश का कारण')),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          MTStorage.leaves.insert(0, {
                            'force': widget.currentUser['force'],
                            'name': '${widget.currentUser['rank']} ${widget.currentUser['name']}',
                            'type': type,
                            'from_date': fromCtrl.text.trim(),
                            'to_date': toCtrl.text.trim(),
                            'sundays_rh': int.tryParse(sunCtrl.text) ?? 0,
                            'total_days': int.tryParse(totalCtrl.text) ?? 1,
                            'reporting_date': repCtrl.text.trim(),
                            'reason': rsnCtrl.text.trim(),
                            'status': 'PENDING'
                          });
                          await MTStorage.saveData();
                          Navigator.pop(dCtx);
                          onAdded();
                        },
                        child: const Text('आवेदन जमा करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

