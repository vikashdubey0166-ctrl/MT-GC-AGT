            // ================= ADD / EDIT STAFF DIALOG (ADMIN ONLY) =================
            void _addOrEditStaffDialog(BuildContext ctx, Map<String, dynamic>? staff, VoidCallback onDone) {
              final isEdit = staff != null;
              final forceCtrl = TextEditingController(text: isEdit ? staff['force'] : '');
              final nameCtrl = TextEditingController(text: isEdit ? staff['name'] : '');
              final mobCtrl = TextEditingController(text: isEdit ? staff['mobile'] : '');
              final rankCtrl = TextEditingController(text: isEdit ? staff['rank'] : 'MTO');
              final stateCtrl = TextEditingController(text: isEdit ? staff['state'] : '');
              final elCtrl = TextEditingController(text: isEdit ? staff['el_bal'].toString() : '60');
              final clCtrl = TextEditingController(text: isEdit ? staff['cl_bal'].toString() : '15');
              final plCtrl = TextEditingController(text: isEdit ? (staff['pl_bal'] ?? 30).toString() : '30');
              String status = isEdit ? staff['status'] : 'PRESENT';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text(isEdit ? 'कार्मिक विवरण संशोधित करें' : 'नया कार्मिक जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: forceCtrl, decoration: const InputDecoration(labelText: 'फोर्स नंबर'), enabled: !isEdit),
                          DropdownButtonFormField<String>(
                            value: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR'].contains(rankCtrl.text) ? rankCtrl.text : 'MTO',
                            decoration: const InputDecoration(labelText: 'रैंक चुनें'),
                            items: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR']
                                .map((r) => DropdownMenuItem(value: r, child: Text(r))).toList(),
                            onChanged: (val) => setD(() => rankCtrl.text = val!),
                          ),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'नाम')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल')),
                          DropdownButtonFormField<String>(
                            value: ['PRESENT', 'EL', 'CL', 'PL', 'ATTACHED', 'CAMP', 'DUTY'].contains(status) ? status : 'PRESENT',
                            decoration: const InputDecoration(labelText: 'स्थिति'),
                            items: ['PRESENT', 'EL', 'CL', 'PL', 'ATTACHED', 'CAMP', 'DUTY']
                                .map((s) => DropdownMenuItem(value: s, child: Text(s))).toList(),
                            onChanged: (val) => setD(() => status = val!),
                          ),
                          Row(
                            children: [
                              Expanded(child: TextField(controller: elCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'EL'))),
                              const SizedBox(width: 6),
                              Expanded(child: TextField(controller: clCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'CL'))),
                              const SizedBox(width: 6),
                              Expanded(child: TextField(controller: plCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'PL'))),
                            ],
                          ),
                          TextField(controller: stateCtrl, decoration: const InputDecoration(labelText: 'गृह राज्य')),
                        ],
                      ),
                    ),
                    actions: [
                      if (isEdit)
                        TextButton(
                          style: TextButton.styleFrom(foregroundColor: Colors.red),
                          onPressed: () async {
                            MTStorage.staffList.remove(staff);
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onDone();
                          },
                          child: const Text('हटाएं'),
                        ),
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (forceCtrl.text.isNotEmpty && nameCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              staff['rank'] = rankCtrl.text.trim().toUpperCase();
                              staff['name'] = nameCtrl.text.trim().toUpperCase();
                              staff['mobile'] = mobCtrl.text.trim();
                              staff['status'] = status;
                              staff['state'] = stateCtrl.text.trim().toUpperCase();
                              staff['el_bal'] = int.tryParse(elCtrl.text) ?? 60;
                              staff['cl_bal'] = int.tryParse(clCtrl.text) ?? 15;
                              staff['pl_bal'] = int.tryParse(plCtrl.text) ?? 30;
                            } else {
                              MTStorage.staffList.add({
                                'force': forceCtrl.text.trim(),
                                'rank': rankCtrl.text.trim().toUpperCase(),
                                'name': nameCtrl.text.trim().toUpperCase(),
                                'role': rankCtrl.text == 'MTO' ? 'MTO' : 'STAFF',
                                'mobile': mobCtrl.text.trim(),
                                'status': status,
                                'location': 'GC AGT',
                                'duty_type': 'CAMP',
                                'attach_type': 'NONE',
                                'attach_office': '',
                                'el_bal': int.tryParse(elCtrl.text) ?? 60,
                                'cl_bal': int.tryParse(clCtrl.text) ?? 15,
                                'pl_bal': int.tryParse(plCtrl.text) ?? 30,
                                'blood': 'B+',
                                'state': stateCtrl.text.trim().toUpperCase(),
                                'address': '',
                                'dl_no': '',
                                'photo_base64': ''
                              });
                            }
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onDone();
