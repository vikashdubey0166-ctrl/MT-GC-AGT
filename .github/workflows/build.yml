                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('3. अटैच वाहन विवरण:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Color(0xFF1B3B6F))),
                              SizedBox(height: 4),
