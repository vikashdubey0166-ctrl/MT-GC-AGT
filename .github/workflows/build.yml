                          textAlign: TextAlign.center,
                          style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF1B3B6F)),
                        ),
                        const Text('वाहन, बायोडाटा एवं उपस्थिति प्रणाली', style: TextStyle(color: Colors.grey)),
                        const SizedBox(height: 24),
                        Card(
                          elevation: 4,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                          child: Padding(
                            padding: const EdgeInsets.all(20.0),
                            child: Column(
                              children: [
                                TextField(
                                  controller: _forceCtrl,
                                  decoration: const InputDecoration(
