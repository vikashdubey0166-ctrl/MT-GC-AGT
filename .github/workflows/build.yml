              {'force': '900991221', 'rank': 'SI/MM', 'name': 'EDLAPALLI HARINATH', 'role': 'SI/MM', 'mobile': '7889915950', 'status': 'EL', 'leave_days': 30, 'course_name': '', 'location': 'HOME', 'duty_type': 'LEAVE', 'gc_reporting_date': '20/04/2023', 'blood': 'O+', 'icard_no': 'CRPF-AGT-90099', 'dl_no': '', 'dl_validity': '', 'state': 'ANDHRA PRADESH', 'address': 'Dist- Chittoor, Andhra Pradesh', 'photo_base64': '', 'attach_type': 'NONE', 'attach_office': '', 'el_bal': 30, 'cl_bal': 15, 'pl_bal': 30},
              {'force': '923050413', 'rank': 'ASI/MT', 'name': 'HIT LAL PANDIT', 'role': 'ASI/MT', 'mobile': '6005871431', 'status': 'CL', 'leave_days': 14, 'course_name': '', 'location': 'GC AGT', 'duty_type': 'CAMP', 'gc_reporting_date': '10/05/2022', 'blood': 'A+', 'icard_no': 'CRPF-AGT-92305', 'dl_no': 'BR06-1993-005612', 'dl_validity': '14/05/2027', 'state': 'BIHAR', 'address': 'Muzaffarpur, Bihar', 'photo_base64': '', 'attach_type': 'NONE', 'attach_office': '', 'el_bal': 60, 'cl_bal': 14, 'pl_bal': 30},
