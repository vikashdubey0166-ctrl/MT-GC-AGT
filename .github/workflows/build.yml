      - name: Build Release APK
        run: |
          cd mt_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT_GC_Agartala_Full_App_APK
          path: mt_app/build/app/outputs/flutter-apk/app-release.apk
