        function handleAdminPhotoUpload(forceNo, event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Photo = e.target.result;
                const p = state.personnel.find(item => item.forceNo === forceNo);
                if (p) {
                    p.photo = base64Photo;
                    triggerBroadcast(`Photo updated for ${p.name}`);
                    openPersonnelModal(forceNo);
                    renderPersonnelList();
                }
            };
            reader.readAsDataURL(file);
        }

        function changePersonnelStatus(forceNo, newStatus) {
            const p = state.personnel.find(item => item.forceNo === forceNo);
            if (p) {
                p.status = newStatus;
                triggerBroadcast(`${p.name} status updated to '${newStatus}'`);
                openPersonnelModal(forceNo);
                renderPersonnelList();
                renderDashboard();
            }
        }

        function openAddPersonnelModal() {
            document.getElementById('modal-prs-title').innerText = "Add New Personnel";
            document.getElementById('admin-prs-orig-force').value = "";
            document.getElementById('admin-prs-form').reset();
            toggleDriverFieldsInForm();
            document.getElementById('modal-add-personnel').classList.remove('hidden');
        }

        function openEditPersonnelModal(forceNo) {
            const p = state.personnel.find(item => item.forceNo === forceNo);
            if (!p) return;

            document.getElementById('modal-prs-title').innerText = "Edit Personnel: " + p.name;
            document.getElementById('admin-prs-orig-force').value = p.forceNo;
            document.getElementById('admin-prs-force').value = p.forceNo;
            document.getElementById('admin-prs-rank').value = p.rank;
            document.getElementById('admin-prs-name').value = p.name;
            document.getElementById('admin-prs-cadre').value = p.cadre;
            document.getElementById('admin-prs-phone').value = p.phone;
            document.getElementById('admin-prs-dlno').value = p.dlNo || '';
            document.getElementById('admin-prs-dlvalid').value = p.dlValidity || '';
            document.getElementById('admin-prs-status').value = p.status;

            toggleDriverFieldsInForm();
            document.getElementById('modal-add-personnel').classList.remove('hidden');
        }

        function toggleDriverFieldsInForm() {
            const cadre = document.getElementById('admin-prs-cadre').value;
            const container = document.getElementById('admin-prs-driver-fields');
            if (cadre === 'HC_DVR' || cadre === 'CT_DVR') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function handleAdminSavePersonnel(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only Admin can perform this action!", "danger");
                return;
            }

            const origForce = document.getElementById('admin-prs-orig-force').value;
            const forceNo = document.getElementById('admin-prs-force').value.trim();
            const rank = document.getElementById('admin-prs-rank').value.trim();
            const name = document.getElementById('admin-prs-name').value.trim().toUpperCase();
            const cadre = document.getElementById('admin-prs-cadre').value;
            const phone = document.getElementById('admin-prs-phone').value.trim();
            const dlNo = document.getElementById('admin-prs-dlno').value.trim();
            const dlValidity = document.getElementById('admin-prs-dlvalid').value;
            const status = document.getElementById('admin-prs-status').value;

            const isDriver = (cadre === 'HC_DVR' || cadre === 'CT_DVR');

            if (origForce) {
                const p = state.personnel.find(item => item.forceNo === origForce);
                if (p) {
                    p.forceNo = forceNo;
                    p.rank = rank;
                    p.name = name;
                    p.cadre = cadre;
                    p.phone = phone;
                    p.dlNo = isDriver ? dlNo : '';
                    p.dlValidity = isDriver ? dlValidity : '';
                    p.status = status;
                    p.isDriver = isDriver;
                    triggerBroadcast(`Personnel ${name} profile updated.`);
                }
            } else {
                const newPrs = {
                    id: forceNo,
                    forceNo,
                    rank,
                    name,
                    cadre,
                    phone,
                    status,
                    dlNo: isDriver ? dlNo : '',
                    dlValidity: isDriver ? dlValidity : '',
                    photo: '',
                    isDriver,
                    attachment: { type: "NONE", location: "GC AGT" }
                };
                state.personnel.push(newPrs);
                triggerBroadcast(`New personnel ${name} added.`);
            }

            closeModal('modal-add-personnel');
            renderDashboard();
            renderPersonnelList();
            renderDirectoryList();
            populateFormDropdowns();
        }

        function deletePersonnel(forceNo) {
            if (!checkIsAdmin()) {
                showToast("Only Admin can delete records!", "danger");
                return;
            }
            if (forceNo === state.adminForceNo) {
                showToast("Cannot delete the active Administrator!", "danger");
                return;
            }
            state.personnel = state.personnel.filter(p => p.forceNo !== forceNo);
            triggerBroadcast(`Personnel (${forceNo}) removed.`);
            renderDashboard();
            renderPersonnelList();
            renderDirectoryList();
            populateFormDropdowns();
        }

        /* ==========================================================================
           8. VEHICLE IN / OUT LOGBOOK ENGINE (DRIVER-LOCKED RETURN)
           ========================================================================== */
        function handleVehicleOut(e) {
            e.preventDefault();

            const regNo = document.getElementById('out-veh-select').value;
            const driverForceNo = document.getElementById('out-driver-select').value;
            const km = parseInt(document.getElementById('out-km-input').value, 10);
            const purpose = document.getElementById('out-purpose-input').value.trim();

            const veh = state.vehicles.find(v => v.regNo === regNo);
            const driver = state.personnel.find(p => p.forceNo === driverForceNo);

            if (!veh || !driver) {
                showToast("Please choose valid vehicle and driver!", "danger");
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const fullTime = `${dateStr} ${timeStr}`;

            const newLog = {
                id: "LOG-" + Math.floor(1000 + Math.random() * 9000),
                vehRegNo: veh.regNo,
                vehType: veh.type,
                driverForceNo: driver.forceNo,
                driverName: `${driver.name} (${driver.rank})`,
                outTime: fullTime,
                outKm: km,
                inTime: null,
                inKm: null,
                totalKm: null,
                purpose,
                status: "ACTIVE",
                remarks: "On Road"
            };

            veh.status = "ON_DUTY";
            veh.km = km;

            state.logs.unshift(newLog);
            document.getElementById('vehicle-out-form').reset();

            triggerBroadcast(`Vehicle ${veh.regNo} checked out by ${driver.name}.`);
            renderDashboard();
            renderVehiclesList();
            renderLogsTable();
            populateFormDropdowns();
        }

        function openCheckInModal(logId) {
            const log = state.logs.find(l => l.id === logId);
            if (!log) return;

            // Driver-locked rule: Only the checkout driver OR Admin can check in
            const isAdmin = checkIsAdmin();
            const isDriver = state.currentUser && (state.currentUser.forceNo === log.driverForceNo);

            if (!isAdmin && !isDriver) {
                showToast(`Restricted: Only Admin or checkout driver (${log.driverName}) can check-in!`, "warning");
                if (!state.currentUser) openLoginModal();
                return;
            }

            document.getElementById('in-log-id').value = log.id;
            document.getElementById('modal-in-veh-subtitle').innerText = `${log.vehRegNo} (${log.vehType}) • Driver: ${log.driverName}`;
            document.getElementById('in-closing-km').value = log.outKm;
            document.getElementById('in-closing-km').min = log.outKm;
            document.getElementById('in-open-km-hint').innerText = `Out KM: ${log.outKm} KM (Enter greater than or equal)`;

            document.getElementById('modal-vehicle-in').classList.remove('hidden');
        }

        function handleVehicleInSubmit(e) {
            e.preventDefault();
            const logId = document.getElementById('in-log-id').value;
            const closingKm = parseInt(document.getElementById('in-closing-km').value, 10);
            const remarks = document.getElementById('in-remarks').value.trim();

            const log = state.logs.find(l => l.id === logId);
            if (!log) return;

            if (closingKm < log.outKm) {
                showToast("Closing KM cannot be less than Opening KM!", "danger");
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            log.inTime = `${dateStr} ${timeStr}`;
            log.inKm = closingKm;
            log.totalKm = closingKm - log.outKm;
            log.status = "COMPLETED";
            log.remarks = remarks || "Vehicle returned safe";

            const veh = state.vehicles.find(v => v.regNo === log.vehRegNo);
            if (veh) {
                veh.status = "AVAILABLE";
                veh.km = closingKm;
            }

            closeModal('modal-vehicle-in');
            triggerBroadcast(`Vehicle ${log.vehRegNo} checked in. Total distance run: ${log.totalKm} KM`);

            renderDashboard();
            renderVehiclesList();
            renderLogsTable();
            populateFormDropdowns();
        }

        function renderLogsTable() {
            const filter = document.getElementById('log-filter-status')?.value || 'ACTIVE';
            const tbody = document.getElementById('logs-table-body');
            if (!tbody) return;

            let filtered = state.logs;
            if (filter === 'ACTIVE') {
                filtered = state.logs.filter(l => l.status === 'ACTIVE');
            } else if (filter === 'COMPLETED') {
                filtered = state.logs.filter(l => l.status === 'COMPLETED');
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500 text-xs">No matching log records.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(log => `
                <tr class="hover:bg-slate-900/60 transition border-b border-slate-700/60">
                    <td class="p-2.5 font-bold text-white">
                        ${log.vehRegNo}
                        <span class="block text-[10px] text-slate-400 font-normal">${log.vehType}</span>
                    </td>
                    <td class="p-2.5 font-medium text-slate-300">${log.driverName}</td>
                    <td class="p-2.5">
                        <span class="font-semibold text-white">${log.outTime}</span>
                        <span class="block text-[10px] text-slate-400">${log.outKm} KM</span>
                    </td>
                    <td class="p-2.5">
                        ${log.inTime ? `
                            <span class="font-semibold text-white">${log.inTime}</span>
                            <span class="block text-[10px] text-slate-400">${log.inKm} KM</span>
                        ` : '<span class="text-rose-400 font-bold text-[11px]">Active Out</span>'}
                    </td>
                    <td class="p-2.5 font-black text-sky-400">
                        ${log.totalKm !== null ? `${log.totalKm} KM` : '-'}
                    </td>
                    <td class="p-2.5 text-slate-300 text-[11px] max-w-xs truncate">${log.purpose}</td>
                    <td class="p-2.5">
                        ${log.status === 'ACTIVE' ? `
                            <button onclick="openCheckInModal('${log.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1 rounded-xl text-[10px] shadow transition">
                                Check In
                            </button>
                        ` : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900 text-slate-400 border border-slate-700">Completed</span>'}
                    </td>
                </tr>
            `).join('');
        }

        /* ==========================================================================
           9. DUTY ROSTER SYSTEM (POL GUARD & MT PARK)
           ========================================================================== */
        function renderDutySection() {
            const isAdmin = checkIsAdmin();
            const polBtn = document.getElementById('pol-guard-save-btn');
            const mtBtn = document.getElementById('mt-park-save-btn');

            if (polBtn) polBtn.disabled = !isAdmin;
            if (mtBtn) mtBtn.disabled = !isAdmin;

            if (!isAdmin) {
                if (polBtn) polBtn.innerText = "Admin Rights Required to Modify Roster";
                if (mtBtn) mtBtn.innerText = "Admin Rights Required to Modify Roster";
            } else {
                if (polBtn) polBtn.innerText = "Save Pol Guard Roster";
                if (mtBtn) mtBtn.innerText = "Save MT Park Roster";
            }

            const polHc = state.personnel.find(p => p.forceNo === state.duties.polGuard.hc);
            const polCt1 = state.personnel.find(p => p.forceNo === state.duties.polGuard.ct1);
            const polCt2 = state.personnel.find(p => p.forceNo === state.duties.polGuard.ct2);
            const polCt3 = state.personnel.find(p => p.forceNo === state.duties.polGuard.ct3);
            const polCt4 = state.personnel.find(p => p.forceNo === state.duties.polGuard.ct4);

            document.getElementById('pol-active-preview').innerHTML = `
                <div>• <strong class="text-sky-300">HC:</strong> ${polHc ? `${polHc.rank} ${polHc.name} (${polHc.forceNo})` : 'Unassigned'}</div>
                <div>• <strong class="text-sky-300">CT 1:</strong> ${polCt1 ? `${polCt1.rank} ${polCt1.name}` : '-'}</div>
                <div>• <strong class="text-sky-300">CT 2:</strong> ${polCt2 ? `${polCt2.rank} ${polCt2.name}` : '-'}</div>
                <div>• <strong class="text-sky-300">CT 3:</strong> ${polCt3 ? `${polCt3.rank} ${polCt3.name}` : '-'}</div>
                <div>• <strong class="text-sky-300">CT 4:</strong> ${polCt4 ? `${polCt4.rank} ${polCt4.name}` : '-'}</div>
            `;

            const mtparkHc = state.personnel.find(p => p.forceNo === state.duties.mtPark.hc);
            const mtparkCt = state.personnel.find(p => p.forceNo === state.duties.mtPark.ct);

            document.getElementById('mtpark-active-preview').innerHTML = `
                <div>• <strong class="text-amber-300">HC:</strong> ${mtparkHc ? `${mtparkHc.rank} ${mtparkHc.name} (${mtparkHc.forceNo})` : 'Unassigned'}</div>
                <div>• <strong class="text-amber-300">CT:</strong> ${mtparkCt ? `${mtparkCt.rank} ${mtparkCt.name} (${mtparkCt.forceNo})` : 'Unassigned'}</div>
            `;
        }

        function savePolGuardDuty(e) {
            e.preventDefault();
