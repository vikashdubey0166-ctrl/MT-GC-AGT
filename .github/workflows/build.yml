                                                      tooltip: 'Approve',
                                                      onPressed: () async {
                                                        l['status'] = 'APPROVED';
                                                        final staff = MTStorage.staffList.firstWhere((s) => s['force'] == l['force'], orElse: () => {});
                                                        if (staff.isNotEmpty) {
                                                          staff['status'] = l['type'];
                                                          staff['leave_days'] = l['total_days'] ?? 15;
                                                        }
                                                        await MTStorage.saveData(changeDesc: 'Leave Approved: ${l['name']}');
                                                        setSState(() {});
                                                        setState(() {});
                                                      },
                                                    ),
                                                    IconButton(
                                                      icon: const Icon(Icons.cancel, color: Colors.red),
                                                      tooltip: 'Reject',
                                                      onPressed: () async {
                                                        l['status'] = 'REJECTED';
                                                        await MTStorage.saveData(changeDesc: 'Leave Rejected: ${l['name']}');
                                                        setSState(() {});
                                                        setState(() {});
                                                      },
                                                    ),
                                                  ],
                                                )
                                              : Chip(label: Text(l['status'] ?? 'PENDING')),
                                        ),
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            void _applyLeaveDialog(BuildContext ctx, Map<String, dynamic> user, VoidCallback onDone) {
              String type = 'EL';
              final fromCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now()));
              final toCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now().add(const Duration(days: 15))));
