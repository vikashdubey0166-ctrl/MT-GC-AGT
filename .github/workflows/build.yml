        /* ==========================================================================
           14. FORM SELECTORS POPULATION
           ========================================================================== */
        function populateFormDropdowns() {
            // Vehicle checkout selector
            const vehSelect = document.getElementById('out-veh-select');
            if (vehSelect) {
                const availVehs = state.vehicles.filter(v => v.status === "AVAILABLE");
                vehSelect.innerHTML = availVehs.map(v => `
                    <option value="${v.regNo}">${v.regNo} - ${v.type} (${v.km.toLocaleString()} KM)</option>
                `).join('') || '<option disabled>No vehicles currently available</option>';
            }

            // Driver selector
            const driverSelect = document.getElementById('out-driver-select');
            if (driverSelect) {
                const drivers = state.personnel.filter(p => p.cadre === 'HC_DVR' || p.cadre === 'CT_DVR' || p.isDriver);
                driverSelect.innerHTML = drivers.map(d => `
                    <option value="${d.forceNo}">${d.rank} ${d.name} (${d.forceNo})</option>
                `).join('');
            }

            // Duty selectors
            const allHcs = state.personnel.filter(p => p.rank.startsWith('HC') || p.cadre === 'HC_DVR' || p.rank.includes('HC'));
            const allCts = state.personnel.filter(p => p.rank.startsWith('CT') || p.cadre === 'CT_DVR' || p.rank.includes('CT'));

            const polHc = document.getElementById('pol-hc');
            const mtHc = document.getElementById('mtpark-hc');
            if (polHc && mtHc) {
                const hcOptions = allHcs.map(h => `<option value="${h.forceNo}">${h.rank} ${h.name} (${h.forceNo})</option>`).join('');
                polHc.innerHTML = hcOptions;
                mtHc.innerHTML = hcOptions;
                polHc.value = state.duties.polGuard.hc;
                mtHc.value = state.duties.mtPark.hc;
            }

            const ctOptions = allCts.map(c => `<option value="${c.forceNo}">${c.rank} ${c.name} (${c.forceNo})</option>`).join('');
            ['pol-ct-1', 'pol-ct-2', 'pol-ct-3', 'pol-ct-4', 'mtpark-ct'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = ctOptions;
            });

            if (document.getElementById('pol-ct-1')) document.getElementById('pol-ct-1').value = state.duties.polGuard.ct1;
            if (document.getElementById('pol-ct-2')) document.getElementById('pol-ct-2').value = state.duties.polGuard.ct2;
            if (document.getElementById('pol-ct-3')) document.getElementById('pol-ct-3').value = state.duties.polGuard.ct3;
            if (document.getElementById('pol-ct-4')) document.getElementById('pol-ct-4').value = state.duties.polGuard.ct4;
            if (document.getElementById('mtpark-ct')) document.getElementById('mtpark-ct').value = state.duties.mtPark.ct;

            // Attachment selectors
            const attachVehSelect = document.getElementById('attach-veh-select');
            if (attachVehSelect) {
                attachVehSelect.innerHTML = state.vehicles.map(v => `<option value="${v.regNo}">${v.regNo} - ${v.type}</option>`).join('');
            }
            const attachPrsSelect = document.getElementById('attach-prs-select');
            if (attachPrsSelect) {
                attachPrsSelect.innerHTML = state.personnel.map(p => `<option value="${p.forceNo}">${p.rank} ${p.name} (${p.forceNo})</option>`).join('');
            }

            // Admin selectors
            const transferSelect = document.getElementById('transfer-admin-select');
            const resetSelect = document.getElementById('reset-prs-select');
            if (transferSelect) {
                transferSelect.innerHTML = state.personnel.map(p => `<option value="${p.forceNo}" ${p.forceNo === state.adminForceNo ? 'selected' : ''}>${p.rank} ${p.name} (${p.forceNo})</option>`).join('');
            }
            if (resetSelect) {
                resetSelect.innerHTML = state.personnel.map(p => `<option value="${p.forceNo}">${p.rank} ${p.name} (${p.forceNo})</option>`).join('');
            }
        }

        /* ==========================================================================
           15. TAB ROUTING
           ========================================================================== */
        function switchTab(tabId) {
            state.activeTab = tabId;
            const views = ['dashboard', 'vehicles', 'personnel', 'inout', 'duty', 'directory', 'attachments', 'admin'];

            views.forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.classList.add('hidden');
                const nav = document.getElementById(`nav-${v}`);
                if (nav) nav.classList.remove('tab-active');
            });

            const targetView = document.getElementById(`view-${tabId}`);
            if (targetView) targetView.classList.remove('hidden');

            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) activeNav.classList.add('tab-active');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'vehicles') renderVehiclesList();
            if (tabId === 'personnel') renderPersonnelList();
            if (tabId === 'inout') renderLogsTable();
            if (tabId === 'duty') renderDutySection();
            if (tabId === 'directory') renderDirectoryList();
            if (tabId === 'attachments') renderAttachmentsSection();
        }

        /* ==========================================================================
           16. INITIALIZATION
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            populateFormDropdowns();
            renderDashboard();
            renderVehiclesList();
            renderPersonnelList();
            renderLogsTable();
            renderDutySection();
            renderDirectoryList();
            renderAttachmentsSection();

            // Default logged in as Administrator (Md. Moktar Hussain)
            state.currentUser = state.personnel.find(p => p.forceNo === state.adminForceNo);
            updateUserInterface();

            showToast("MT GC AGT Application initialized. 48 Personnel and 38 Vehicles ready.", "success");
        });
    </script>
