            void _editTodayDutyDialog(VoidCallback onDone) {
              final duty = MTStorage.todayDuty;
              final dateCtrl = TextEditingController(text: DateFormat('dd/MM/yyyy').format(DateTime.now()));

              // पेट्रोल पंप ड्यूटी के पात्र: HC (DVR, MMV) और CT (DVR, MMV, PTR)
              final allEligibleHC = MTStorage.staffList.where((s) => s['rank'].toString().contains('HC')).toList();
              final allEligibleCT = MTStorage.staffList.where((s) => s['rank'].toString().contains('CT')).toList();

              String pCommander = duty['pump_commander'] ?? (allEligibleHC.isNotEmpty ? '${allEligibleHC[0]['rank']} ${allEligibleHC[0]['name']}' : '');
              String pg1 = duty['pump_guard_1st'] ?? (allEligibleCT.isNotEmpty ? '${allEligibleCT[0]['rank']} ${allEligibleCT[0]['name']}' : '');
              String pg2 = duty['pump_guard_2nd'] ?? (allEligibleCT.length > 1 ? '${allEligibleCT[1]['rank']} ${allEligibleCT[1]['name']}' : '');
              String pg3 = duty['pump_guard_3rd'] ?? (allEligibleCT.length > 2 ? '${allEligibleCT[2]['rank']} ${allEligibleCT[2]['name']}' : '');
              String pg4 = duty['pump_guard_4th'] ?? (allEligibleCT.length > 3 ? '${allEligibleCT[3]['rank']} ${allEligibleCT[3]['name']}' : '');

              String parkCommander = duty['park_commander'] ?? (allEligibleHC.length > 1 ? '${allEligibleHC[1]['rank']} ${allEligibleHC[1]['name']}' : '');
              String parkg1 = duty['park_guard_1st'] ?? (allEligibleCT.length > 4 ? '${allEligibleCT[4]['rank']} ${allEligibleCT[4]['name']}' : '');
              String parkg2 = duty['park_guard_2nd'] ?? (allEligibleCT.length > 5 ? '${allEligibleCT[5]['rank']} ${allEligibleCT[5]['name']}' : '');
              String parkg3 = duty['park_guard_3rd'] ?? (allEligibleCT.length > 6 ? '${allEligibleCT[6]['rank']} ${allEligibleCT[6]['name']}' : '');
              String parkg4 = duty['park_guard_4th'] ?? (allEligibleCT.length > 7 ? '${allEligibleCT[7]['rank']} ${allEligibleCT[7]['name']}' : '');

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: const Text('टुडे ड्यूटी लगाएं (एडमिन)'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          TextField(controller: dateCtrl, decoration: const InputDecoration(labelText: 'ड्यूटी दिनांक (DD/MM/YYYY)')),
                          const SizedBox(height: 12),
                          const Text('1. पेट्रोल पंप गार्ड ड्यूटी (01 HC + 04 CT):', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.indigo)),
                          _buildDropdownHC(allEligibleHC, pCommander, 'गार्ड कमांडर (HC)', (v) => setD(() => pCommander = v)),
                          _buildDropdownCT(allEligibleCT, pg1, '1st गार्ड सिपाही (CT)', (v) => setD(() => pg1 = v)),
                          _buildDropdownCT(allEligibleCT, pg2, '2nd गार्ड सिपाही (CT)', (v) => setD(() => pg2 = v)),
                          _buildDropdownCT(allEligibleCT, pg3, '3rd गार्ड सिपाही (CT)', (v) => setD(() => pg3 = v)),
                          _buildDropdownCT(allEligibleCT, pg4, '4th गार्ड सिपाही (CT)', (v) => setD(() => pg4 = v)),
                          const SizedBox(height: 14),
                          const Text('2. MT PARK DUTY (01 HC + 04 CT):', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.teal)),
                          _buildDropdownHC(allEligibleHC, parkCommander, 'पार्क कमांडर (HC)', (v) => setD(() => parkCommander = v)),
                          _buildDropdownCT(allEligibleCT, parkg1, '1st पार्क गार्ड (CT)', (v) => setD(() => parkg1 = v)),
                          _buildDropdownCT(allEligibleCT, parkg2, '2nd पार्क गार्ड (CT)', (v) => setD(() => parkg2 = v)),
                          _buildDropdownCT(allEligibleCT, parkg3, '3rd पार्क गार्ड (CT)', (v) => setD(() => parkg3 = v)),
                          _buildDropdownCT(allEligibleCT, parkg4, '4th पार्क गार्ड (CT)', (v) => setD(() => parkg4 = v)),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          duty['duty_date'] = dateCtrl.text.trim();
                          duty['pump_commander'] = pCommander;
                          duty['pump_guard_1st'] = pg1;
                          duty['pump_guard_2nd'] = pg2;
                          duty['pump_guard_3rd'] = pg3;
                          duty['pump_guard_4th'] = pg4;

                          duty['park_commander'] = parkCommander;
                          duty['park_guard_1st'] = parkg1;
                          duty['park_guard_2nd'] = parkg2;
                          duty['park_guard_3rd'] = parkg3;
                          duty['park_guard_4th'] = parkg4;

                          await MTStorage.saveData();
                          Navigator.pop(dCtx);
                          onDone();
                        },
                        child: const Text('सुरक्षित करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildDropdownHC(List<Map<String, dynamic>> list, String currentVal, String label, Function(String) onChanged) {
              return DropdownButtonFormField<String>(
                value: list.any((h) => '${h['rank']} ${h['name']}' == currentVal) ? currentVal : null,
                isExpanded: true,
                decoration: InputDecoration(labelText: label),
                items: list.map((h) {
                  final val = '${h['rank']} ${h['name']}';
                  return DropdownMenuItem(value: val, child: Text(val, style: const TextStyle(fontSize: 12)));
                }).toList(),
                onChanged: (v) => onChanged(v!),
              );
            }

            Widget _buildDropdownCT(List<Map<String, dynamic>> list, String currentVal, String label, Function(String) onChanged) {
              return DropdownButtonFormField<String>(
                value: list.any((c) => '${c['rank']} ${c['name']}' == currentVal) ? currentVal : null,
                isExpanded: true,
                decoration: InputDecoration(labelText: label),
                items: list.map((c) {
                  final val = '${c['rank']} ${c['name']}';
                  return DropdownMenuItem(value: val, child: Text(val, style: const TextStyle(fontSize: 12)));
                }).toList(),
                onChanged: (v) => onChanged(v!),
              );
            }

