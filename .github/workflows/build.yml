                MTStorage.dateWiseDuties[selectedDate] = Map<String, dynamic>.from(MTStorage.defaultTodayDuty);
                MTStorage.dateWiseDuties[selectedDate]['duty_date'] = selectedDate;
              }

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setDutyState) {
                    final duty = MTStorage.dateWiseDuties[selectedDate] ?? MTStorage.defaultTodayDuty;

                    return Container(
                      height: MediaQuery.of(ctx).size.height * 0.90,
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
