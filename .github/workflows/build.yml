                      ),
                      const SizedBox(height: 14),
                      Card(
                        elevation: 2,
                        child: Padding(
                          padding: const EdgeInsets.all(12),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text('1. कार्मिक स्थिति (Personnel Parade State)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: Color(0xFF1B3B6F))),
                              const Divider(),
                              _rowItem('कुल पोस्टेड संख्या (Posted Str)', '${MTStorage.staffList.length}'),
