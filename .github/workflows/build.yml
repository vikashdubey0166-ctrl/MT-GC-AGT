        /* ==========================================================================
           12. ADMIN TRANSFER & PASSWORD RESET
           ========================================================================== */
        function handleAdminTransfer(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only current Admin can transfer privileges!", "danger");
                return;
            }

            const newAdminForceNo = document.getElementById('transfer-admin-select').value;
            const newAdmin = state.personnel.find(p => p.forceNo === newAdminForceNo);
            if (!newAdmin) return;

            state.adminForceNo = newAdminForceNo;
            triggerBroadcast(`Admin Role Transferred! ${newAdmin.rank} ${newAdmin.name} (${newAdmin.forceNo}) is now Chief Admin.`);
            updateUserInterface();
            switchTab('dashboard');
        }

        function handleAdminResetPassword(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only Admin can reset passwords!", "danger");
                return;
            }

            const targetForceNo = document.getElementById('reset-prs-select').value;
            const customPass = document.getElementById('reset-new-pwd-input').value.trim();
            const targetUser = state.personnel.find(p => p.forceNo === targetForceNo);

            if (!targetUser) return;

            const finalPass = customPass || `Mt@${targetUser.forceNo}`;
            targetUser.customPassword = finalPass;

            triggerBroadcast(`Password reset for ${targetUser.name}`);
            document.getElementById('reset-pwd-form').reset();
            showToast(`Password successfully reset to: ${finalPass}`, "success");
        }

        /* ==========================================================================
           13. PDF GENERATION, LOCAL STORAGE & DIRECT SYSTEM SHARING
           ========================================================================== */
        async function saveAndSharePDF(doc, filename, shareTitle) {
            try {
                const pdfBlob = doc.output('blob');
                
                // Direct Web Share API (if supported on mobile browsers)
                if (navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], filename, { type: 'application/pdf' })] })) {
                    const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                    await navigator.share({
                        title: shareTitle,
                        text: `MT GC AGT Document: ${shareTitle}`,
                        files: [file]
                    });
                    showToast("PDF shared successfully!", "success");
                } else {
                    // Fallback to direct download/save
                    doc.save(filename);
                    showToast(`PDF saved to device: ${filename}`, "success");
                }
            } catch (err) {
                // If sharing was cancelled or blocked, trigger save
                doc.save(filename);
                showToast(`PDF saved to device: ${filename}`, "info");
            }
        }

