      - name: Build Release APK
        run: |
          cd mt_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT_GC_AGT_Release_APK
          path: mt_app/build/app/outputs/flutter-apk/app-release.apk
