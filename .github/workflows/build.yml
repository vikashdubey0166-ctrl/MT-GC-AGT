            void _insertRowAtDialog(int index) {
              final titleCtrl = TextEditingController();
              final int colCount = MTStorage.paradeCustomColumns.length - 1;
              List<TextEditingController> valCtrls = List.generate(
                colCount,
                (i) => TextEditingController(text: '00'),
              );

              showDialog(
                context: context,
                builder: (dCtx) => AlertDialog(
                  title: Text('पंक्ति जोड़ें (क्रम संख्या: ${index + 1})'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: titleCtrl, decoration: const InputDecoration(labelText: 'पर्टिकुलर / विवरण नाम')),
                        const SizedBox(height: 8),
                        Wrap(
                          spacing: 6,
                          runSpacing: 4,
                          children: List.generate(colCount, (i) {
                            return SizedBox(
                              width: 65,
                              child: TextField(
                                controller: valCtrls[i],
                                textAlign: TextAlign.center,
                                decoration: InputDecoration(labelText: MTStorage.paradeCustomColumns[i + 1].replaceAll('\n', ' ')),
                              ),
                            );
                          }),
                        ),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        if (titleCtrl.text.isNotEmpty) {
                          MTStorage.paradeCustomRows.insert(index, {
                            'title': titleCtrl.text.trim().toUpperCase(),
                            'vals': valCtrls.map((c) => c.text.trim()).toList(),
                            'isBold': false
                          });
                          await MTStorage.saveData(changeDesc: 'परेड रो जोड़ी गई: ${titleCtrl.text.trim()}');
                          Navigator.pop(dCtx);
                          setState(() {});
                        }
                      },
                      child: const Text('पंक्ति इन्सर्ट करें'),
                    ),
                  ],
                ),
              );
            }

