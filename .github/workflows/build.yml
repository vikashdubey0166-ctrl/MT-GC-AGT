              final offRoadVehicles = MTStorage.vehicles.where((v) => v['status'] == 'OFF_ROAD').length;
              final attachedVehicles = MTStorage.vehicles.where((v) => v['status'] == 'ATTACHED' || (v['attach_type'] != null && v['attach_type'] != 'NONE')).length;

              // Staff Counts
              final totalStaff = MTStorage.staffList.length;
              final presentStaff = MTStorage.staffList.where((s) => s['status'] == 'PRESENT' || s['status'].toString().contains('CAMP')).length;
              final leaveStaff = MTStorage.staffList.where((s) => ['EL', 'CL', 'PL', 'LEAVE', 'MEDICAL'].contains(s['status'])).length;
              final attachedStaff = MTStorage.staffList.where((s) => s['status'] == 'ATTACHED' || (s['attach_type'] != null && s['attach_type'] != 'NONE')).length;

              return Scaffold(
                backgroundColor: const Color(0xFFF7F9FC),
                appBar: AppBar(
                  title: Text(isAdmin ? 'MT GC AGT (ADMIN)' : 'MT GC AGT (${user['name']})'),
