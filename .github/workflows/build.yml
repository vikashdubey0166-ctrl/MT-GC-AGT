          // ================= LOGIN SCREEN WITH FORGOT PASSWORD RESET =================
          class LoginScreen extends StatefulWidget {
            const LoginScreen({Key? key}) : super(key: key);

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _forceCtrl = TextEditingController();
            final _passCtrl = TextEditingController();
            bool _obscure = true;

            void _login() {
              final force = _forceCtrl.text.trim();
              final pass = _passCtrl.text.trim();

              final staff = MTStorage.staffList.firstWhere(
                (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                orElse: () => {},
              );

              if (staff.isNotEmpty) {
                final expectedPass = MTStorage.passwords[staff['force']] ?? 'Mt@${staff['force']}';
                if (pass == expectedPass) {
                  Navigator.pushReplacement(
                    context,
                    MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                  );
                  return;
                }
              }

              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('गलत फोर्स नंबर या पासवर्ड!')),
              );
            }

            void _forgotPasswordDialog() {
              final fCtrl = TextEditingController();
              final mobCtrl = TextEditingController();
              final newPCtrl = TextEditingController();

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('पासवर्ड रीसेट (Admin / Staff Recovery)'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: fCtrl, decoration: const InputDecoration(labelText: 'फोर्स नंबर दर्ज करें')),
                      TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'पंजीकृत मोबाइल नंबर दर्ज करें')),
                      TextField(controller: newPCtrl, obscureText: true, decoration: const InputDecoration(labelText: 'नया पासवर्ड दर्ज करें')),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        final force = fCtrl.text.trim();
                        final mob = mobCtrl.text.trim();
                        final newP = newPCtrl.text.trim();

                        final staff = MTStorage.staffList.firstWhere(
                          (s) => s['force'] == force && s['mobile'] == mob,
                          orElse: () => {},
                        );

                        if (staff.isNotEmpty && newP.isNotEmpty) {
                          MTStorage.passwords[force] = newP;
                          await MTStorage.saveData();
                          Navigator.pop(ctx);
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('पासवर्ड सफलतापूर्वक रीसेट हो गया! अब लॉगिन करें।')),
                          );
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('फोर्स नंबर या मोबाइल नंबर रिकॉर्ड से मेल नहीं खा रहा!')),
                          );
                        }
                      },
                      child: const Text('रीसेट करें'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF0F4F8),
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24.0),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          padding: const EdgeInsets.all(16),
                          decoration: const BoxDecoration(
                            color: Color(0xFF1B3B6F),
                            shape: BoxShape.circle,
                          ),
                          child: const Icon(Icons.security, size: 55, color: Colors.white),
                        ),
                        const SizedBox(height: 16),
                        const Text(
                          'एम टी शाखा समूह केंद्र अगरतला',
                          textAlign: TextAlign.center,
                          style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF1B3B6F)),
                        ),
                        const Text('वाहन, बायोडाटा, इन-आउट एवं परेड स्टेट', style: TextStyle(color: Colors.grey)),
                        const SizedBox(height: 24),
                        Card(
                          elevation: 4,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                          child: Padding(
                            padding: const EdgeInsets.all(20.0),
                            child: Column(
                              children: [
                                TextField(
                                  controller: _forceCtrl,
                                  decoration: const InputDecoration(
                                    labelText: 'फोर्स नंबर (User ID)',
                                    prefixIcon: Icon(Icons.badge),
                                    border: OutlineInputBorder(),
                                  ),
                                ),
                                const SizedBox(height: 16),
                                TextField(
                                  controller: _passCtrl,
                                  obscureText: _obscure,
                                  decoration: InputDecoration(
                                    labelText: 'पासवर्ड',
                                    prefixIcon: const Icon(Icons.lock),
                                    suffixIcon: IconButton(
                                      icon: Icon(_obscure ? Icons.visibility_off : Icons.visibility),
                                      onPressed: () => setState(() => _obscure = !_obscure),
                                    ),
                                    border: const OutlineInputBorder(),
                                  ),
                                ),
                                const SizedBox(height: 12),
                                Align(
                                  alignment: Alignment.centerRight,
                                  child: TextButton(
                                    onPressed: _forgotPasswordDialog,
                                    child: const Text('पासवर्ड भूल गए? (Reset Password)', style: TextStyle(fontSize: 12)),
                                  ),
                                ),
                                SizedBox(
                                  width: double.infinity,
                                  height: 48,
                                  child: ElevatedButton(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: const Color(0xFF1B3B6F),
                                      foregroundColor: Colors.white,
                                    ),
                                    onPressed: _login,
                                    child: const Text('लॉग इन करें', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(height: 14),
                        Card(
                          color: Colors.indigo.shade50,
                          child: const Padding(
                            padding: EdgeInsets.all(10.0),
                            child: Text(
                              'एम टी राइटर (एडमिन):\nफोर्स नं: 165060166 (VIKASH DUBEY)\nपासवर्ड: Mt@165060166',
                              textAlign: TextAlign.center,
                              style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: Color(0xFF1B3B6F)),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

