            void _changePasswordDialog() {
              final oldPassCtrl = TextEditingController();
              final newPassCtrl = TextEditingController();

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('पासवर्ड बदलें (Change Password)'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: oldPassCtrl, obscureText: true, decoration: const InputDecoration(labelText: 'पुराना पासवर्ड')),
                      const SizedBox(height: 10),
                      TextField(controller: newPassCtrl, obscureText: true, decoration: const InputDecoration(labelText: 'नया पासवर्ड')),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () {
                        final currentPass = MTData.passwords[widget.currentUser['force']] ?? 'Mt@${widget.currentUser['force']}';
                        if (oldPassCtrl.text.trim() == currentPass) {
                          if (newPassCtrl.text.trim().isNotEmpty) {
                            setState(() {
                              MTData.passwords[widget.currentUser['force']] = newPassCtrl.text.trim();
                            });
                            Navigator.pop(ctx);
                            ScaffoldMessenger.of(context).showSnackBar(
                              const SnackBar(content: Text('पासवर्ड सफलतापूर्वक बदल दिया गया है!')),
                            );
                          }
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('पुराना पासवर्ड गलत है!')),
                          );
                        }
                      },
                      child: const Text('अपडेट करें'),
                    ),
                  ],
                ),
              );
            }

