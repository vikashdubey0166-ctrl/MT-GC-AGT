              final mfgCtrl = TextEditingController(text: isEdit ? v['model_year'] : '2023');
              final commCtrl = TextEditingController(text: isEdit ? (v['commission_date'] ?? v['reg_date']) : DateFormat('dd/MM/yyyy').format(DateTime.now()));
              final chassisCtrl = TextEditingController(text: isEdit ? v['chassis_no'] : '');
              final engCtrl = TextEditingController(text: isEdit ? v['engine_no'] : '');
              final dvrCtrl = TextEditingController(text: isEdit ? v['driver_incharge'] : 'अनावंटित');
              final purCtrl = TextEditingController(text: isEdit ? v['duty_purpose'] : '-');
              final kmCtrl = TextEditingController(text: isEdit ? v['total_km'] : '0');
              final mileageCtrl = TextEditingController(text: isEdit ? v['mileage'] : '12 KMPL');
              final fuelCtrl = TextEditingController(text: isEdit ? v['fuel_cap'] : '60 Ltr');
              final lastServCtrl = TextEditingController(text: isEdit ? v['last_service_date'] : '');
              final nextServCtrl = TextEditingController(text: isEdit ? v['next_service_km'] : '');
              final batteryCtrl = TextEditingController(text: isEdit ? v['battery_no'] : '');
              final tyreCtrl = TextEditingController(text: isEdit ? v['tyre_details'] : '');
