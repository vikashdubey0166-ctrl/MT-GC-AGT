            Future<void> _pickAndAssignMedia(ImageSource src, String section, String targetKey, BuildContext dCtx) async {
              final picker = ImagePicker();
              final img = await picker.pickImage(source: src, imageQuality: 60);
              if (img != null) {
                final bytes = await img.readAsBytes();
                final b64 = base64Encode(bytes);

                if (section == 'STAFF') {
                  final staff = MTStorage.staffList.firstWhere((s) => s['force'] == targetKey, orElse: () => {});
                  if (staff.isNotEmpty) {
                    staff['photo_base64'] = b64;
                    await MTStorage.addNotification('Photo Updated', 'Profile photo updated for ${staff['rank']} ${staff['name']}.');
                  }
                } else if (section == 'VEHICLE') {
                  final veh = MTStorage.vehicles.firstWhere((v) => v['no'] == targetKey, orElse: () => {});
                  if (veh.isNotEmpty) {
                    veh['photo_base64'] = b64;
                    veh['tools_issued'] = '${veh['tools_issued'] ?? ''} [Doc Attached: ${DateFormat('dd/MM/yy').format(DateTime.now())}]';
                    await MTStorage.addNotification('Vehicle Doc Updated', 'Document/Photo added for vehicle ${veh['no']}.');
                  }
                } else if (section == 'PARADE') {
                  MTStorage.customParadeFiles.add({
                    'id': 'file_${DateTime.now().millisecondsSinceEpoch}',
                    'name': 'CRPF_FORM_${DateFormat('ddMM_HHmm').format(DateTime.now())}',
                    'type': 'FORM',
                    'created_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                    'description': 'Official CRPF Form / Circular Attachment',
                    'headers': ['SL', 'CRPF DOCUMENT DETAILS', 'STATUS'],
                    'rows': [['1', 'CRPF OFFICIAL ATTACHMENT', 'VERIFIED & ISSUED']],
                    'word_content': 'OFFICE OF THE DIGP, GROUP CENTRE CRPF AGARTALA. Official Form Attached.',
                    'photo_base64': b64
                  });
                  await MTStorage.addNotification('CRPF Form Uploaded', 'A new official CRPF form has been added to Parade Section.');
                }

                Navigator.pop(dCtx);
                setState(() {});
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Media synced across all devices!'), backgroundColor: Colors.green));
              }
            }

