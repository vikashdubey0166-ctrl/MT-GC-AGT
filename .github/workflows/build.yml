                    IconButton(
                      icon: const Icon(Icons.logout),
                      tooltip: 'लॉगआउट',
                      onPressed: () async {
                        await MTStorage.logout();
                        Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
                      },
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Card(
                        elevation: 2,
                        child: ListTile(
                          leading: CircleAvatar(
                            backgroundColor: const Color(0xFF1B3B6F),
                            child: Text(user['name'] != null ? user['name'][0] : 'U', style: const TextStyle(color: Colors.white)),
                          ),
                          title: Text('${user['rank']} ${user['name']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                          subtitle: Text('फोर्स सं: ${user['force']} | स्थिति: ${user['status']}'),
                        ),
                      ),
                      const SizedBox(height: 16),

                      // VEHICLE STATS (CLICKABLE FOR EVERYONE)
                      const Text('वाहन स्थिति (क्लिक कर सूची देखें)', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 8),
                      Row(
                        children: [
                          _interactiveStatCard('कुल वाहन', '$totalVehicles', Colors.indigo, () => _showVehiclesListModal('कुल वाहन', MTStorage.vehicles, isAdmin)),
                          _interactiveStatCard('उपलब्ध वाहन', '$availVehicles', Colors.green, () => _showVehiclesListModal('उपलब्ध वाहन', MTStorage.vehicles.where((v) => v['status'] == 'AVAILABLE').toList(), isAdmin)),
                          _interactiveStatCard('ड्यूटी पर', '$dutyVehicles', Colors.blue, () => _showVehiclesListModal('ड्यूटी पर वाहन', MTStorage.vehicles.where((v) => v['status'] == 'ON_DUTY').toList(), isAdmin)),
                        ],
                      ),
                      const SizedBox(height: 8),
                      Row(
