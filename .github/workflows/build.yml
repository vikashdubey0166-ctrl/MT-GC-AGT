                'photo_base64': '', 'attach_type': 'NONE', 'attach_office': '', 'el_bal': 60, 'cl_bal': 15, 'pl_bal': 30
              },
              {'force': '165060166', 'rank': 'CT/DVR', 'name': 'VIKASH DUBEY', 'role': 'MT WRITER (ADMIN)', 'mobile': '9149753674', 'status': 'PRESENT', 'leave_days': 0, 'course_name': '', 'location': 'GC AGT', 'duty_type': 'CAMP', 'gc_reporting_date': '10/08/2022', 'blood': 'B+', 'icard_no': 'CRPF-AGT-16506', 'dl_no': 'UP78-2016-004521', 'dl_validity': '15/10/2030', 'state': 'UTTAR PRADESH', 'address': 'Vill- Dubeypur, Kanpur Nagar, UP - 208001', 'photo_base64': '', 'attach_type': 'NONE', 'attach_office': '', 'el_bal': 60, 'cl_bal': 15, 'pl_bal': 30},
