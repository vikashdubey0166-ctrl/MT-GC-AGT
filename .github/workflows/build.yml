                  onTap: onTap,
                  child: Card(
                    elevation: 2,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 4),
                      child: Column(
                        children: [
                          Text(count, style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: col)),
                          const SizedBox(height: 2),
                          Text(title, textAlign: TextAlign.center, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.w600)),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget _menuBtn(IconData icon, String title, Color color, String subtitle, VoidCallback onTap) {
