            void _showSelfChangePasswordDialog() {
              final oldPassCtrl = TextEditingController();
              final newPassCtrl = TextEditingController();
              final confirmPassCtrl = TextEditingController();
              bool obs = true;

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setD) => AlertDialog(
                    title: const Text('Change Password'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: oldPassCtrl, obscureText: obs, decoration: const InputDecoration(labelText: 'Current Password', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: newPassCtrl, obscureText: obs, decoration: const InputDecoration(labelText: 'New Password', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: confirmPassCtrl, obscureText: obs, decoration: const InputDecoration(labelText: 'Confirm New Password', border: OutlineInputBorder())),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                        onPressed: () async {
                          final currentPass = MTStorage.passwords[widget.currentUser['force']] ?? 'Mt@${widget.currentUser['force']}';
                          if (oldPassCtrl.text.trim() != currentPass) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Current password is incorrect!')));
                            return;
                          }
                          if (newPassCtrl.text.trim().isEmpty || newPassCtrl.text.trim() != confirmPassCtrl.text.trim()) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('New passwords do not match!')));
                            return;
                          }
                          MTStorage.passwords[widget.currentUser['force']] = newPassCtrl.text.trim();
                          await MTStorage.saveData(changeDesc: 'Password updated: ${widget.currentUser['name']}');
                          Navigator.pop(ctx);
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Password updated successfully!'), backgroundColor: Colors.green));
                        },
                        child: const Text('Update'),
