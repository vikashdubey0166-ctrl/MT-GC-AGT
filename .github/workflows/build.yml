                      crossAxisAlignment: pw.CrossAxisAlignment.center,
                      children: [
                        pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13)),
                        pw.SizedBox(height: 2),
                        pw.Text('DAILY MT PLATOON PARADE STATEMENT - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10)),
                        pw.SizedBox(height: 10),
                        pw.Table(
                          border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                          children: [
                            pw.TableRow(
                              decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                              children: MTStorage.paradeCustomColumns.map((h) => pw.Container(
                                padding: const pw.EdgeInsets.symmetric(vertical: 3, horizontal: 1),
                                alignment: pw.Alignment.center,
                                child: pw.Text(h.replaceAll('\n', ' '), textAlign: pw.TextAlign.center, style: pw.TextStyle(fontSize: 5.5, fontWeight: pw.FontWeight.bold)),
                              )).toList(),
                            ),
                            ...MTStorage.paradeCustomRows.map((r) {
                              final List<String> rowCells = [r['title'].toString(), ...List<String>.from(r['vals'])];
                              final bool isB = r['isBold'] == true;
                              return pw.TableRow(
                                children: rowCells.map((c) => pw.Container(
                                  padding: const pw.EdgeInsets.symmetric(vertical: 2.5, horizontal: 1),
                                  alignment: pw.Alignment.center,
                                  child: pw.Text(c, textAlign: pw.TextAlign.center, style: pw.TextStyle(fontSize: 5.5, fontWeight: isB ? pw.FontWeight.bold : pw.FontWeight.normal)),
                                )).toList(),
                              );
                            }).toList(),
                          ],
                        ),
                        pw.SizedBox(height: 24),
                        pw.Row(
                          mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                          children: [
                            pw.Text('HC/MT (CHIEF WRITER)\nGC CRPF AGT', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)),
                            pw.Text('MTO\nGC CRPF AGARTALA', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)),
                            pw.Text('DIGP\nGC CRPF AGARTALA', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)),
