            if (!container) return;

            const attachedVehs = state.vehicles.filter(v => v.attachment && v.attachment.type !== 'NONE');
            const attachedPrs = state.personnel.filter(p => p.attachment && p.attachment.type !== 'NONE');

            container.innerHTML = `
                <div class="space-y-3">
                    <div>
                        <h5 class="font-bold text-sky-300 text-xs mb-1.5">Attached Vehicles (${attachedVehs.length}):</h5>
                        ${attachedVehs.length > 0 ? attachedVehs.map(v => `
