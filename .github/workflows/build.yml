                      children: [
                        Text(c, style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: col)),
                        Text(t, textAlign: TextAlign.center, style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w600)),
                      ],
                    ),
                  ),
                ),
              );
            }

