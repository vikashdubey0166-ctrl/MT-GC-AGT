                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Divider(),
                            _bioRow('पद / रोल', staff['role']),
                            _bioRow('दैनिक स्थिति', staff['status']),
                            _bioRow('वर्तमान स्थान', staff['location']),
                            _bioRow('मोबाइल नंबर', staff['mobile']),
                            _bioRow('ड्राइविंग लाइसेंस', staff['dl_no'] ?? 'N/A'),
                            _bioRow('ब्लड ग्रुप', staff['blood'] ?? 'B+'),
                            _bioRow('गृह राज्य', staff['state'] ?? 'N/A'),
                            const Divider(),
                            Text('अवकाश कोटा (Leave Balance):', style: const TextStyle(fontWeight: FontWeight.bold)),
                            Text('अर्जित अवकाश (EL): ${staff['el_bal']} / 60 दिन', style: const TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                            Text('आकस्मिक अवकाश (CL): ${staff['cl_bal']} / 15 दिन', style: const TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                            if (isAdmin) ...[
                              const Divider(),
                              const Text('फोटो प्रबंधन (Admin Photo Control):', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                              const SizedBox(height: 6),
                              Row(
                                children: [
                                  ElevatedButton.icon(
                                    style: ElevatedButton.styleFrom(backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                                    icon: const Icon(Icons.add_a_photo, size: 14),
                                    label: const Text('फोटो लिंक जोड़ें', style: TextStyle(fontSize: 11)),
                                    onPressed: () {
                                      _editPhotoDialog(bCtx, staff, () {
                                        setBioState(() {});
                                        onUpdated();
                                      });
                                    },
                                  ),
                                  const SizedBox(width: 6),
                                  if (hasPhoto)
                                    OutlinedButton.icon(
                                      style: OutlinedButton.styleFrom(foregroundColor: Colors.red),
                                      icon: const Icon(Icons.delete, size: 14),
                                      label: const Text('हटाएं', style: TextStyle(fontSize: 11)),
                                      onPressed: () {
                                        setBioState(() {
                                          staff['photo'] = '';
                                        });
                                        onUpdated();
                                      },
                                    ),
                                ],
                              )
                            ],
                          ],
                        ),
                      ),
                      actions: [
                        if (isAdmin && staff['force'] != '165060166')
                          TextButton(
                            style: TextButton.styleFrom(foregroundColor: Colors.red),
                            onPressed: () {
                              Navigator.pop(bCtx);
                              _confirmDelete(ctx, '${staff['rank']} ${staff['name']}', () {
                                MTData.staffList.remove(staff);
                                onUpdated();
                              });
                            },
                            child: const Text('हटाएं (Delete)'),
                          ),
                        if (isAdmin)
                          ElevatedButton(
                            onPressed: () {
                              Navigator.pop(bCtx);
                              _addOrEditStaffDialog(ctx, staff, onUpdated);
                            },
                            child: const Text('एडिट करें'),
                          ),
                        TextButton(onPressed: () => Navigator.pop(bCtx), child: const Text('बंद करें')),
                      ],
                    );
                  },
                ),
              );
            }

            void _editPhotoDialog(BuildContext ctx, Map<String, dynamic> staff, VoidCallback onPhotoSet) {
              final photoCtrl = TextEditingController(text: staff['photo'] ?? '');
              showDialog(
                context: ctx,
                builder: (pCtx) => AlertDialog(
                  title: const Text('कार्मिक फोटो URL दर्ज करें'),
                  content: TextField(
                    controller: photoCtrl,
                    decoration: const InputDecoration(labelText: 'इमेज URL (उदा. https://.../photo.jpg)'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(pCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () {
                        staff['photo'] = photoCtrl.text.trim();
                        Navigator.pop(pCtx);
                        onPhotoSet();
                      },
                      child: const Text('सुरक्षित करें'),
                    ),
                  ],
                ),
              );
            }

            Widget _bioRow(String label, String value) {
              return Padding(
                padding: const EdgeInsets.symmetric(vertical: 3.0),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Text(label, style: const TextStyle(color: Colors.blueGrey, fontSize: 13)),
                    Text(value, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                  ],
                ),
              );
            }

            void _addOrEditStaffDialog(BuildContext ctx, Map<String, dynamic>? staff, VoidCallback onSuccess) {
              final isEdit = staff != null;
              final forceCtrl = TextEditingController(text: isEdit ? staff['force'] : '');
              final nameCtrl = TextEditingController(text: isEdit ? staff['name'] : '');
              final rankCtrl = TextEditingController(text: isEdit ? staff['rank'] : 'CT/DVR');
              final roleCtrl = TextEditingController(text: isEdit ? staff['role'] : 'STAFF');
              final mobCtrl = TextEditingController(text: isEdit ? staff['mobile'] : '');
              final locCtrl = TextEditingController(text: isEdit ? staff['location'] : 'GC AGT');
              final dlCtrl = TextEditingController(text: isEdit ? (staff['dl_no'] ?? '') : '');
              final bloodCtrl = TextEditingController(text: isEdit ? (staff['blood'] ?? 'B+') : 'B+');
              final stateCtrl = TextEditingController(text: isEdit ? (staff['state'] ?? '') : '');
              final elCtrl = TextEditingController(text: isEdit ? '${staff['el_bal']}' : '60');
              final clCtrl = TextEditingController(text: isEdit ? '${staff['cl_bal']}' : '15');
              String status = isEdit ? staff['status'] : 'PRESENT';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlgState) => AlertDialog(
                    title: Text(isEdit ? 'स्टाफ एवं बायोडाटा बदलें' : 'नया स्टाफ जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: forceCtrl, enabled: !isEdit, decoration: const InputDecoration(labelText: 'फोर्स नंबर')),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'पूरा नाम')),
                          TextField(controller: rankCtrl, decoration: const InputDecoration(labelText: 'रैंक (Rank)')),
                          TextField(controller: roleCtrl, decoration: const InputDecoration(labelText: 'रोल / पद (उदा. MT HAVILDAR)')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल नंबर')),
                          TextField(controller: dlCtrl, decoration: const InputDecoration(labelText: 'ड्राइविंग लाइसेंस नंबर')),
                          TextField(controller: bloodCtrl, decoration: const InputDecoration(labelText: 'ब्लड ग्रुप (उदा. B+, O+)')),
                          TextField(controller: stateCtrl, decoration: const InputDecoration(labelText: 'गृह राज्य (State)')),
                          const SizedBox(height: 10),
                          DropdownButtonFormField<String>(
                            value: status,
                            decoration: const InputDecoration(labelText: 'स्थिति (Duty State)'),
                            items: ['PRESENT', 'ATTACHED', 'GOVT_DUTY', 'LEAVE', 'SICK', 'REST'].map((st) => DropdownMenuItem(value: st, child: Text(st))).toList(),
                            onChanged: (val) => setDlgState(() => status = val!),
                          ),
                          TextField(controller: locCtrl, decoration: const InputDecoration(labelText: 'कहाँ गया है / लोकेशन (उदा. IG TPA)')),
                          Row(
                            children: [
                              Expanded(child: TextField(controller: elCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'बकाया EL'))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: clCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'बकाया CL'))),
                            ],
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          if (forceCtrl.text.isNotEmpty && nameCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              staff['name'] = nameCtrl.text.trim().toUpperCase();
                              staff['rank'] = rankCtrl.text.trim().toUpperCase();
                              staff['role'] = roleCtrl.text.trim().toUpperCase();
                              staff['mobile'] = mobCtrl.text.trim();
                              staff['dl_no'] = dlCtrl.text.trim().toUpperCase();
                              staff['blood'] = bloodCtrl.text.trim().toUpperCase();
                              staff['state'] = stateCtrl.text.trim().toUpperCase();
                              staff['status'] = status;
                              staff['location'] = locCtrl.text.trim().toUpperCase();
                              staff['el_bal'] = int.tryParse(elCtrl.text) ?? 60;
                              staff['cl_bal'] = int.tryParse(clCtrl.text) ?? 15;
                            } else {
                              MTData.staffList.add({
                                'force': forceCtrl.text.trim(),
                                'name': nameCtrl.text.trim().toUpperCase(),
                                'rank': rankCtrl.text.trim().toUpperCase(),
                                'role': roleCtrl.text.trim().toUpperCase(),
                                'mobile': mobCtrl.text.trim(),
                                'dl_no': dlCtrl.text.trim().toUpperCase(),
                                'blood': bloodCtrl.text.trim().toUpperCase(),
                                'state': stateCtrl.text.trim().toUpperCase(),
                                'status': status,
                                'location': locCtrl.text.trim().toUpperCase(),
                                'el_bal': int.tryParse(elCtrl.text) ?? 60,
                                'cl_bal': int.tryParse(clCtrl.text) ?? 15,
                                'photo': '',
                              });
                            }
                            Navigator.pop(dCtx);
                            onSuccess();
                          }
                        },
                        child: Text(isEdit ? 'अपडेट करें' : 'जोड़ें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // 3. VEHICLE IN / OUT (DATE & TIME WISE)
            void _openInOutLogs(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.88,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('वाहन IN / OUT रजिस्टर', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                              icon: const Icon(Icons.exit_to_app, size: 16),
                              label: const Text('गाड़ी OUT करें'),
                              onPressed: () => _addOutDialog(ctx, () {
                                setSheetState(() {});
                                setState(() {});
                              }),
                            ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTData.inOutLogs.length,
                            itemBuilder: (ctx, i) {
                              final log = MTData.inOutLogs[i];
                              final bool isOut = log['status'] == 'OUT';

                              return Card(
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(log['vehicle'], style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                                          Chip(
                                            label: Text(log['status']),
                                            backgroundColor: isOut ? Colors.amber.shade100 : Colors.green.shade100,
                                            labelStyle: TextStyle(fontWeight: FontWeight.bold, color: isOut ? Colors.brown : Colors.green),
                                          )
                                        ],
                                      ),
                                      Text('चालक: ${log['driver']} | ड्यूटी: ${log['purpose']}'),
                                      const SizedBox(height: 4),
                                      Text('OUT समय: ${log['out_time']}'),
                                      Text('IN समय: ${log['in_time']}'),
                                      if (isOut)
                                        Align(
                                          alignment: Alignment.centerRight,
                                          child: ElevatedButton.icon(
                                            style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, foregroundColor: Colors.white),
                                            icon: const Icon(Icons.login, size: 16),
                                            label: const Text('गाड़ी IN करें'),
                                            onPressed: () {
                                              final now = DateTime.now();
                                              setSheetState(() {
                                                log['status'] = 'IN';
                                                log['in_time'] = '${now.year}-${now.month.toString().padLeft(2, '0')}-${now.day.toString().padLeft(2, '0')} ${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}';
                                              });
                                              setState(() {});
                                            },
                                          ),
                                        ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _addOutDialog(BuildContext ctx, VoidCallback onAdded) {
              String selectedVeh = MTData.vehicles[0]['no'];
              String selectedDvr = MTData.staffList[0]['name'];
              final purCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('गाड़ी OUT दर्ज करें'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: selectedVeh,
                          decoration: const InputDecoration(labelText: 'गाड़ी चुनें'),
                          items: MTData.vehicles.map<DropdownMenuItem<String>>((v) {
                            return DropdownMenuItem(value: v['no'] as String, child: Text(v['no'] as String, style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedVeh = val!),
                        ),
                        DropdownButtonFormField<String>(
                          value: selectedDvr,
                          decoration: const InputDecoration(labelText: 'ड्राइवर चुनें'),
                          items: MTData.staffList.map<DropdownMenuItem<String>>((s) {
                            return DropdownMenuItem(value: s['name'] as String, child: Text('${s['rank']} ${s['name']}', style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedDvr = val!),
                        ),
                        TextField(controller: purCtrl, decoration: const InputDecoration(labelText: 'ड्यूटी का उद्देश्य (Purpose)')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          if (purCtrl.text.isNotEmpty) {
                            final now = DateTime.now();
                            final timeStr = '${now.year}-${now.month.toString().padLeft(2, '0')}-${now.day.toString().padLeft(2, '0')} ${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}';

                            MTData.inOutLogs.insert(0, {
                              'vehicle': selectedVeh,
                              'driver': selectedDvr,
                              'purpose': purCtrl.text.trim(),
                              'status': 'OUT',
                              'out_time': timeStr,
                              'in_time': '-'
                            });
                            Navigator.pop(dCtx);
                            onAdded();
                          }
                        },
                        child: const Text('OUT दर्ज करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // 4. LEAVE APPROVAL & BALANCE DEDUCTION
            void _openLeaves(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.88,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('अवकाश रिकॉर्ड (Leaves)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            ElevatedButton.icon(
                              icon: const Icon(Icons.add, size: 16),
                              label: const Text('छुट्टी अर्जी दें'),
                              onPressed: () => _applyLeaveDialog(ctx, () {
                                setSheetState(() {});
                                setState(() {});
                              }),
                            ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTData.leaves.length,
                            itemBuilder: (ctx, i) {
                              final l = MTData.leaves[i];
                              Color bg = Colors.orange;
                              if (l['status'] == 'APPROVED') bg = Colors.green;
                              if (l['status'] == 'REJECTED') bg = Colors.red;

                              return Card(
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(l['name'], style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                                          Chip(label: Text(l['status']), backgroundColor: bg.withOpacity(0.15)),
                                        ],
                                      ),
                                      Text('प्रकार: ${l['type']} | अवधि: ${l['days']} दिन | कारण: ${l['reason']}'),
                                      if (isAdmin && l['status'] == 'PENDING')
                                        Padding(
                                          padding: const EdgeInsets.only(top: 8.0),
                                          child: Row(
                                            mainAxisAlignment: MainAxisAlignment.end,
                                            children: [
                                              OutlinedButton(
                                                style: OutlinedButton.styleFrom(foregroundColor: Colors.red),
                                                onPressed: () {
                                                  setSheetState(() => l['status'] = 'REJECTED');
                                                  setState(() {});
                                                },
                                                child: const Text('अस्वीकार (Reject)'),
                                              ),
                                              const SizedBox(width: 8),
                                              ElevatedButton(
                                                style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                                                onPressed: () {
                                                  setSheetState(() {
                                                    l['status'] = 'APPROVED';
                                                    final staff = MTData.staffList.firstWhere((s) => s['force'] == l['force'], orElse: () => {});
                                                    if (staff.isNotEmpty) {
                                                      staff['status'] = 'LEAVE';
                                                      if (l['type'] == 'EL' && staff['el_bal'] >= l['days']) {
                                                        staff['el_bal'] -= l['days'];
                                                      } else if (l['type'] == 'CL' && staff['cl_bal'] >= l['days']) {
                                                        staff['cl_bal'] -= l['days'];
                                                      }
                                                    }
                                                  });
                                                  setState(() {});
                                                },
                                                child: const Text('मंजूर करें (Approve)'),
                                              ),
                                            ],
                                          ),
                                        )
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _applyLeaveDialog(BuildContext ctx, VoidCallback onAdded) {
              String type = 'CL';
              final daysCtrl = TextEditingController(text: '2');
              final rsnCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('छुट्टी के लिए आवेदन'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: type,
                          decoration: const InputDecoration(labelText: 'प्रकार'),
                          items: ['CL', 'EL', 'MEDICAL', 'REST'].map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                          onChanged: (val) => setDlg(() => type = val!),
                        ),
                        TextField(controller: daysCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'दिन')),
                        TextField(controller: rsnCtrl, decoration: const InputDecoration(labelText: 'कारण')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          MTData.leaves.insert(0, {
                            'force': widget.currentUser['force'],
                            'name': '${widget.currentUser['rank']} ${widget.currentUser['name']}',
                            'type': type,
                            'days': int.tryParse(daysCtrl.text) ?? 1,
                            'reason': rsnCtrl.text.trim(),
                            'status': 'PENDING'
                          });
                          Navigator.pop(dCtx);
                          onAdded();
                        },
                        child: const Text('आवेदन भेजें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            void _confirmDelete(BuildContext ctx, String itemName, VoidCallback onDelete) {
              showDialog(
                context: ctx,
                builder: (c) => AlertDialog(
                  title: const Text('हटाने की पुष्टि करें'),
                  content: Text('क्या आप वाकई $itemName को सूची से हटाना चाहते हैं?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(c), child: const Text('नहीं')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white),
                      onPressed: () {
                        onDelete();
                        Navigator.pop(c);
                      },
                      child: const Text('हाँ, हटाएं'),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: |
          cd mt_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT_GC_Agartala_Full_Control_APK
          path: mt_app/build/app/outputs/flutter-apk/app-release.apk
