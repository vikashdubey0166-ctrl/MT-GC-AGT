                                                          staff['status'] = l['type'];
                                                          staff['leave_days'] = l['total_days'] ?? 15;
                                                        }
                                                        await MTStorage.saveData();
                                                        setSState(() {});
                                                        setState(() {});
                                                      },
                                                    ),
                                                    IconButton(
                                                      icon: const Icon(Icons.cancel, color: Colors.red),
                                                      tooltip: 'अस्वीकार करें',
