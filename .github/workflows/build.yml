            void _editStaffAttachmentDialog(Map<String, dynamic> staff) {
              String attachType = staff['attach_type'] ?? 'NONE';
              final officeCtrl = TextEditingController(text: staff['attach_office'] ?? '');

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text('${staff['rank']} ${staff['name']} - अटैचमेंट विवरण'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: attachType,
                          decoration: const InputDecoration(labelText: 'अटैचमेंट प्रकार'),
                          items: const [
                            DropdownMenuItem(value: 'NONE', child: Text('कोई नहीं (GC AGT में तैनात)')),
                            DropdownMenuItem(value: 'ATTACH_OUT', child: Text('GC AGT से अन्य कार्यालय भेजा गया')),
                            DropdownMenuItem(value: 'ATTACH_IN', child: Text('अन्य कार्यालय से GC AGT में संबद्ध')),
                          ],
                          onChanged: (val) => setD(() => attachType = val!),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: officeCtrl,
                          decoration: const InputDecoration(labelText: 'कार्यालय/यूनिट का नाम', hintText: 'उदा. IG Tripura Sec / 71 BN', border: OutlineInputBorder()),
                        ),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          staff['attach_type'] = attachType;
                          staff['attach_office'] = officeCtrl.text.trim().toUpperCase();
                          if (attachType != 'NONE') {
                            staff['status'] = 'ATTACHED';
                            staff['location'] = officeCtrl.text.trim().toUpperCase();
                          } else {
                            staff['status'] = 'PRESENT';
                            staff['location'] = 'GC AGT';
                          }
                          await MTStorage.saveData(changeDesc: 'अटैचमेंट अपडेट: ${staff['rank']} ${staff['name']}');
                          Navigator.pop(dCtx);
                          setState(() {});
                        },
                        child: const Text('अपडेट करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            Future<void> _exportVehiclesListPdf(String title, List<Map<String, dynamic>> list) async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(20),
                  build: (pw.Context ctx) => pw.Column(
                    children: [
                      pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                      pw.Center(child: pw.Text('$title - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10))),
                      pw.SizedBox(height: 10),
                      pw.Table(
                        border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                        children: [
                          pw.TableRow(
                            decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                            children: ['SL', 'REG NO', 'TYPE', 'CATEGORY', 'STATUS', 'INCHARGE', 'KM', 'INSP. DATE'].map((h) => pw.Container(
                              padding: const pw.EdgeInsets.all(4),
                              alignment: pw.Alignment.center,
                              child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 7.5)),
                            )).toList(),
                          ),
                          ...list.asMap().entries.map((e) {
                            final i = e.key + 1;
                            final v = e.value;
                            return pw.TableRow(
                              children: [
                                '$i',
                                v['no'] ?? '',
                                v['type'] ?? '',
                                v['category'] ?? '',
                                v['status'] ?? '',
                                v['driver_incharge'] ?? '',
                                '${v['total_km']} KM',
                                v['commission_date'] ?? v['reg_date'] ?? '-',
                              ].map((c) => pw.Container(
                                padding: const pw.EdgeInsets.all(3),
                                alignment: pw.Alignment.center,
                                child: pw.Text(c, style: const pw.TextStyle(fontSize: 7)),
                              )).toList(),
                            );
                          }).toList(),
                        ],
                      ),
                    ],
                  ),
                ),
              );

              await MTStorage.sharePdf(pdf, 'MT_Vehicle_List');
            }

            // ================= IN / OUT REGISTER =================
            void _openInOut(bool isAdmin, Map<String, dynamic> user) {
              String selectedFilterDate = 'ALL';

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSState) {
                    final displayLogs = selectedFilterDate == 'ALL'
                        ? MTStorage.inOutLogs
                        : MTStorage.inOutLogs.where((l) => (l['out_time'] ?? '').toString().contains(selectedFilterDate)).toList();

                    return Container(
                      height: MediaQuery.of(ctx).size.height * 0.90,
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('वाहन IN / OUT रजिस्टर', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                              Row(
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.date_range, color: Color(0xFF1B3B6F)),
                                    tooltip: 'तारीख अनुसार देखें',
                                    onPressed: () async {
                                      final picked = await showDatePicker(
                                        context: context,
                                        initialDate: DateTime.now(),
                                        firstDate: DateTime(2025),
                                        lastDate: DateTime(2030),
                                      );
                                      if (picked != null) {
                                        setSState(() => selectedFilterDate = DateFormat('yyyy-MM-dd').format(picked));
                                      }
                                    },
                                  ),
                                  if (selectedFilterDate != 'ALL')
                                    IconButton(
                                      icon: const Icon(Icons.clear, color: Colors.red),
                                      tooltip: 'सभी तारीखें देखें',
                                      onPressed: () => setSState(() => selectedFilterDate = 'ALL'),
                                    ),
                                  ElevatedButton.icon(
                                    style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                                    icon: const Icon(Icons.exit_to_app, size: 16),
                                    label: const Text('OUT करें'),
                                    onPressed: () {
                                      _addOutMovement(user, isAdmin, () {
                                        setSState(() {});
                                        setState(() {});
                                      });
                                    },
                                  ),
                                ],
                              ),
                            ],
                          ),
                          Text('फ़िल्टर तारीख: ${selectedFilterDate == 'ALL' ? 'समस्त रिकॉर्ड (All Dates)' : selectedFilterDate}', style: const TextStyle(fontSize: 12, color: Colors.blueGrey)),
                          const Divider(),
                          Expanded(
                            child: displayLogs.isEmpty
                                ? const Center(child: Text('इस दिनांक का कोई मूवमेंट रिकॉर्ड नहीं है'))
                                : ListView.builder(
                                    itemCount: displayLogs.length,
                                    itemBuilder: (ctx, i) {
                                      final l = displayLogs[i];
                                      final isOut = l['status'] == 'OUT';

                                      final currentUserName = '${user['rank']} ${user['name']}'.trim().toUpperCase();
                                      final logDriverName = (l['driver'] ?? '').toString().trim().toUpperCase();
                                      final bool canOperateIn = isAdmin || (currentUserName == logDriverName);

                                      return Card(
                                        child: ListTile(
                                          title: Text('${l['vehicle']} - ${l['purpose']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                          subtitle: Text('चालक: ${l['driver']}\nOUT: ${l['out_time']} | IN: ${l['in_time']}'),
                                          trailing: isOut
                                              ? (canOperateIn
                                                  ? ElevatedButton(
                                                      style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, foregroundColor: Colors.white),
                                                      onPressed: () async {
                                                        l['status'] = 'IN';
                                                        l['in_time'] = DateFormat('yyyy-MM-dd hh:mm a').format(DateTime.now());
                                                        await MTStorage.saveData(changeDesc: 'वाहन IN दर्ज हुआ: ${l['vehicle']}');
                                                        setSState(() {});
                                                        setState(() {});
                                                      },
                                                      child: const Text('गाड़ी IN'),
                                                    )
                                                  : const Chip(label: Text('OUT (Waiting IN)', style: TextStyle(fontSize: 10, color: Colors.orange))))
                                              : const Chip(label: Text('IN DONE', style: TextStyle(fontSize: 10))),
                                        ),
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            void _addOutMovement(Map<String, dynamic> user, bool isAdmin, VoidCallback onAdded) {
              String selVeh = MTStorage.vehicles.first['no'];
              String selDvr = '${user['rank']} ${user['name']}';
              final purCtrl = TextEditingController();

              final driversList = MTStorage.staffList.where((s) => s['rank'].toString().contains('DVR') || s['rank'].toString().contains('MMV') || s['rank'].toString().contains('PTR')).toList();

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: const Text('वाहन रवानगी (OUT) दर्ज करें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          DropdownButtonFormField<String>(
                            value: selVeh,
                            decoration: const InputDecoration(labelText: 'गाड़ी नंबर'),
                            items: MTStorage.vehicles.map((v) => DropdownMenuItem(value: v['no'] as String, child: Text('${v['no']} (${v['category']})'))).toList(),
                            onChanged: (val) => setD(() => selVeh = val!),
                          ),
                          const SizedBox(height: 8),
                          DropdownButtonFormField<String>(
                            value: driversList.any((d) => '${d['rank']} ${d['name']}' == selDvr) ? selDvr : '${driversList.first['rank']} ${driversList.first['name']}',
                            isExpanded: true,
                            decoration: const InputDecoration(labelText: 'चालक चुनें'),
                            items: driversList.map((d) {
                              final nameVal = '${d['rank']} ${d['name']}';
                              return DropdownMenuItem(value: nameVal, child: Text(nameVal, style: const TextStyle(fontSize: 12)));
                            }).toList(),
                            onChanged: (val) => setD(() => selDvr = val!),
                          ),
                          TextField(controller: purCtrl, decoration: const InputDecoration(labelText: 'ड्यूटी / कार्य का उद्देश्य')),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (purCtrl.text.isNotEmpty) {
                            MTStorage.inOutLogs.insert(0, {
                              'vehicle': selVeh,
                              'driver': selDvr,
                              'purpose': purCtrl.text.trim(),
                              'status': 'OUT',
                              'out_time': DateFormat('yyyy-MM-dd hh:mm a').format(DateTime.now()),
                              'in_time': '-'
                            });
                            await MTStorage.saveData(changeDesc: 'वाहन OUT दर्ज हुआ: $selVeh');
                            Navigator.pop(dCtx);
                            onAdded();
                          }
                        },
                        child: const Text('OUT दर्ज करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

