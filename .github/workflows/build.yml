                          _statCard('ऑफ-रोड (मरम्मत)', '$offVehicles', Colors.red),
                        ],
                      ),
                      const SizedBox(height: 8),
                      Row(
                        children: [
                          _statCard('स्टाफ उपस्थित', '$presentStaff', Colors.green),
                          _statCard('अवकाश पर (Leave)', '$leaveStaff', Colors.orange),
