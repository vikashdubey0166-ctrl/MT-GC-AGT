                        children: [
                          _menuBtn(Icons.directions_car, 'गाड़ियों का रिकॉर्ड (${MTData.vehicles.length})', Colors.indigo, () => _openVehicles(isAdmin)),
                          _menuBtn(Icons.history_edu, 'डिजिटल लॉग बुक', Colors.blue, () => _openLogBook(isAdmin)),
                          _menuBtn(Icons.event_note, 'अवकाश प्रबंधन', Colors.deepOrange, () => _openLeaves(isAdmin)),
                          _menuBtn(Icons.people, 'स्टाफ रिकॉर्ड (${MTData.staffList.length})', Colors.teal, () => _openStaff(isAdmin)),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _statCard(String t, String c, Color col) {
              return Expanded(
                child: Card(
                  child: Padding(
                    padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 4),
                    child: Column(
                      children: [
                        Text(c, style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: col)),
                        Text(t, textAlign: TextAlign.center, style: const TextStyle(fontSize: 11)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _menuBtn(IconData icon, String title, Color color, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                child: Card(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, size: 30, color: color),
                      const SizedBox(height: 6),
                      Text(title, textAlign: TextAlign.center, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                    ],
