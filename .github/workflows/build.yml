            void _addChargeHandoverDialog(BuildContext ctx, Map<String, dynamic> v, VoidCallback onAdded) {
              final dvrCtrl = TextEditingController();
              final fromCtrl = TextEditingController();
              final dateCtrl = TextEditingController(text: DateFormat('dd/MM/yyyy').format(DateTime.now()));

              showDialog(
                context: ctx,
                builder: (cCtx) => AlertDialog(
                  title: const Text('नया चार्ज हैंडओवर दर्ज करें'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: dvrCtrl, decoration: const InputDecoration(labelText: 'किस ड्राइवर के चार्ज में है')),
                      TextField(controller: fromCtrl, decoration: const InputDecoration(labelText: 'किस ड्राइवर से चार्ज लिया')),
                      TextField(controller: dateCtrl, decoration: const InputDecoration(labelText: 'चार्ज लेने की दिनांक')),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(cCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () {
                        if (dvrCtrl.text.isNotEmpty) {
                          if (v['driver_charge_history'] == null) v['driver_charge_history'] = [];
                          v['driver_charge_history'].insert(0, {
                            'driver': dvrCtrl.text.trim().toUpperCase(),
                            'handed_over_by': fromCtrl.text.trim().toUpperCase(),
                            'date': dateCtrl.text.trim(),
                          });
                          Navigator.pop(cCtx);
                          onAdded();
                        }
                      },
                      child: const Text('सुरक्षित करें'),
                    ),
                  ],
                ),
              );
            }

            void _addOrEditVehicleDialog(BuildContext ctx, Map<String, dynamic>? vehicle, VoidCallback onSuccess) {
              final isEdit = vehicle != null;
              final noCtrl = TextEditingController(text: isEdit ? vehicle['no'] : '');
              final typeCtrl = TextEditingController(text: isEdit ? vehicle['type'] : '');
              final myCtrl = TextEditingController(text: isEdit ? vehicle['model_year'] : '2022');
              final ownerCtrl = TextEditingController(text: isEdit ? vehicle['owner'] : 'GC AGT');
              final costCtrl = TextEditingController(text: isEdit ? vehicle['cost'] : '0');
              final repCtrl = TextEditingController(text: isEdit ? vehicle['repair_cost'] : '0');
              final fuelCtrl = TextEditingController(text: isEdit ? vehicle['fuel_cap'] : '60 Ltr');
              final kmCtrl = TextEditingController(text: isEdit ? vehicle['total_km'] : '0');
              final locCtrl = TextEditingController(text: isEdit ? vehicle['attach_loc'] : 'GC AGT');
              final toolsCtrl = TextEditingController(text: isEdit ? vehicle['tools_issued'] : 'Jack, Wheel Pana');

              String category = isEdit ? vehicle['category'] : 'LIGHT VEHICLE (LV)';
              String status = isEdit ? vehicle['status'] : 'AVAILABLE';
              String attachType = isEdit ? vehicle['attach_type'] : 'NONE';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlgState) => AlertDialog(
                    title: Text(isEdit ? 'गाड़ी का संपूर्ण विवरण बदलें' : 'नई गाड़ी जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: noCtrl, decoration: const InputDecoration(labelText: 'गाड़ी नंबर (उदा. TR01-G-1154)')),
                          TextField(controller: typeCtrl, decoration: const InputDecoration(labelText: 'प्रकार (उदा. TATA SAFARI, BUS)')),
                          DropdownButtonFormField<String>(
                            value: category,
                            decoration: const InputDecoration(labelText: 'श्रेणी (Category)'),
                            items: ['LIGHT VEHICLE (LV)', 'MEDIUM VEHICLE (MV)', 'HEAVY VEHICLE (HV)', 'SPECIAL VEHICLE (SV)']
                                .map((c) => DropdownMenuItem(value: c, child: Text(c, style: const TextStyle(fontSize: 11)))).toList(),
                            onChanged: (val) => setDlgState(() => category = val!),
                          ),
                          DropdownButtonFormField<String>(
                            value: status,
                            decoration: const InputDecoration(labelText: 'वर्तमान स्थिति'),
                            items: ['AVAILABLE', 'ON_DUTY', 'ATTACHED', 'OFF_ROAD']
                                .map((st) => DropdownMenuItem(value: st, child: Text(st))).toList(),
                            onChanged: (val) => setDlgState(() => status = val!),
                          ),
                          DropdownButtonFormField<String>(
                            value: attachType,
                            decoration: const InputDecoration(labelText: 'अटैचमेंट विवरण'),
                            items: const [
                              DropdownMenuItem(value: 'NONE', child: Text('GC AGT में उपलब्ध')),
                              DropdownMenuItem(value: 'ATTACHED_OUT', child: Text('GC AGT से अन्य यूनिट में अटैच')),
                              DropdownMenuItem(value: 'ATTACHED_IN', child: Text('अन्य यूनिट से GC AGT में अटैच')),
                            ],
                            onChanged: (val) => setDlgState(() => attachType = val!),
                          ),
                          TextField(controller: locCtrl, decoration: const InputDecoration(labelText: 'अटैच कार्यालय / स्थान (उदा. IG Office, 71 Bn)')),
                          TextField(controller: myCtrl, decoration: const InputDecoration(labelText: 'मॉडल वर्ष')),
                          TextField(controller: ownerCtrl, decoration: const InputDecoration(labelText: 'वाहन मालिक')),
                          TextField(controller: costCtrl, decoration: const InputDecoration(labelText: 'वाहन की कीमत (₹)')),
                          TextField(controller: repCtrl, decoration: const InputDecoration(labelText: 'मरम्मत में खर्च (₹)')),
                          TextField(controller: fuelCtrl, decoration: const InputDecoration(labelText: 'ईंधन क्षमता (Ltr)')),
                          TextField(controller: kmCtrl, decoration: const InputDecoration(labelText: 'कुल किलोमीटर')),
                          TextField(controller: toolsCtrl, decoration: const InputDecoration(labelText: 'इश्यू टूल किट विवरण')),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          if (noCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              vehicle['no'] = noCtrl.text.trim().toUpperCase();
                              vehicle['type'] = typeCtrl.text.trim().toUpperCase();
                              vehicle['category'] = category;
                              vehicle['status'] = status;
                              vehicle['attach_type'] = attachType;
                              vehicle['attach_loc'] = locCtrl.text.trim().toUpperCase();
                              vehicle['model_year'] = myCtrl.text.trim();
                              vehicle['owner'] = ownerCtrl.text.trim();
                              vehicle['cost'] = costCtrl.text.trim();
                              vehicle['repair_cost'] = repCtrl.text.trim();
                              vehicle['fuel_cap'] = fuelCtrl.text.trim();
                              vehicle['total_km'] = kmCtrl.text.trim();
                              vehicle['tools_issued'] = toolsCtrl.text.trim();
                            } else {
                              MTStorage.vehicles.insert(0, {
                                'no': noCtrl.text.trim().toUpperCase(),
                                'type': typeCtrl.text.trim().toUpperCase(),
                                'category': category,
                                'status': status,
                                'attach_type': attachType,
                                'attach_loc': locCtrl.text.trim().toUpperCase(),
                                'model_year': myCtrl.text.trim(),
