        /* ==========================================================================
           11. ATTACHMENTS MANAGEMENT (IN / OUT OF GC AGT)
           ========================================================================== */
        function handleVehAttachmentUpdate(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only Admin has authority to change attachments!", "danger");
                return;
            }

            const regNo = document.getElementById('attach-veh-select').value;
            const type = document.getElementById('attach-veh-type').value;
            const loc = document.getElementById('attach-veh-loc').value.trim() || 'Other Office';

            const veh = state.vehicles.find(v => v.regNo === regNo);
            if (veh) {
                veh.attachment = { type, location: loc };
                if (type === 'OUT') veh.status = 'ATTACHED_OUT';
                else if (veh.status === 'ATTACHED_OUT') veh.status = 'AVAILABLE';

                triggerBroadcast(`Vehicle ${veh.regNo} attachment changed to '${type}' (${loc})`);
                renderDashboard();
                renderVehiclesList();
                renderAttachmentsSection();
            }
        }

        function handlePrsAttachmentUpdate(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only Admin has authority to change attachments!", "danger");
                return;
            }

            const forceNo = document.getElementById('attach-prs-select').value;
            const type = document.getElementById('attach-prs-type').value;
            const loc = document.getElementById('attach-prs-loc').value.trim() || 'Other Unit';

            const p = state.personnel.find(item => item.forceNo === forceNo);
            if (p) {
                p.attachment = { type, location: loc };
                triggerBroadcast(`Personnel ${p.name} attachment set to '${type}' (${loc})`);
                renderDashboard();
                renderPersonnelList();
                renderAttachmentsSection();
            }
        }

