name: Build MT GC AGT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup MT Branch App Code
        run: |
          flutter create mt_app --org com.crpf.agartala --project-name mt_app
          cd mt_app
          
          # Stable Android dependencies
          flutter pub add shared_preferences intl image_picker url_launcher
          
          # Set App Label
          sed -i 's/android:label="mt_app"/android:label="MT GC AGT"/g' android/app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MTStorage.init();
            runApp(const MTBranchApp());
          }

          class MTBranchApp extends StatelessWidget {
            const MTBranchApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MT GC AGT',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF1B3B6F)),
                  useMaterial3: true,
                ),
                home: const LoginScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          // ================= PERSISTENT LOCAL STORAGE =================
          class MTStorage {
            static late SharedPreferences prefs;
            static List<Map<String, dynamic>> staffList = [];
            static List<Map<String, dynamic>> vehicles = [];
            static List<Map<String, dynamic>> inOutLogs = [];
            static List<Map<String, dynamic>> leaves = [];
            static Map<String, String> passwords = {};

            static Future<void> init() async {
              prefs = await SharedPreferences.getInstance();
              loadData();
            }

            static void loadData() {
              final staffStr = prefs.getString('crpf_staff_master_v4');
              if (staffStr != null) {
                staffList = List<Map<String, dynamic>>.from(jsonDecode(staffStr));
              } else {
                staffList = List<Map<String, dynamic>>.from(defaultStaff);
              }
              sortStaffByCategoryAndSeniority();

              final vehStr = prefs.getString('crpf_veh_master_v4');
              if (vehStr != null) {
                vehicles = List<Map<String, dynamic>>.from(jsonDecode(vehStr));
              } else {
                vehicles = List<Map<String, dynamic>>.from(defaultVehicles);
              }

              final logsStr = prefs.getString('crpf_inout_master_v4');
              if (logsStr != null) {
                inOutLogs = List<Map<String, dynamic>>.from(jsonDecode(logsStr));
              } else {
                inOutLogs = List<Map<String, dynamic>>.from(defaultLogs);
              }

              final leavesStr = prefs.getString('crpf_leaves_master_v4');
              if (leavesStr != null) {
                leaves = List<Map<String, dynamic>>.from(jsonDecode(leavesStr));
              } else {
                leaves = List<Map<String, dynamic>>.from(defaultLeaves);
              }

              final passStr = prefs.getString('crpf_passwords_v4');
              if (passStr != null) {
                passwords = Map<String, String>.from(jsonDecode(passStr));
              } else {
                passwords = {'165060166': 'Mt@165060166'};
              }
            }

            static Future<void> saveData() async {
              sortStaffByCategoryAndSeniority();
              await prefs.setString('crpf_staff_master_v4', jsonEncode(staffList));
              await prefs.setString('crpf_veh_master_v4', jsonEncode(vehicles));
              await prefs.setString('crpf_inout_master_v4', jsonEncode(inOutLogs));
              await prefs.setString('crpf_leaves_master_v4', jsonEncode(leaves));
              await prefs.setString('crpf_passwords_v4', jsonEncode(passwords));
            }

            // SO's -> HC/DVR -> CT/DVR -> WORKSHOP (90,91,92...99,00,01,02 क्रम अनुसार)
            static int getGroupPriority(Map<String, dynamic> staff) {
              String rank = staff['rank'].toString().toUpperCase();
              String role = staff['role'].toString().toUpperCase();

              if (rank.contains('INSP') || rank.contains('SI/MT') || rank.contains('ASI/MT')) return 1; // SO's
              if (rank.contains('HC/DVR')) return 2; // Havildar Driver
              if (rank.contains('CT/DVR')) return 3; // Constable Driver
              if (rank.contains('MM') || rank.contains('MMV') || rank.contains('PTR') || rank.contains('DTR') || role.contains('WORKSHOP')) return 4; // Workshop
              return 5;
            }

            static void sortStaffByCategoryAndSeniority() {
              staffList.sort((a, b) {
                int pA = getGroupPriority(a);
                int pB = getGroupPriority(b);
                if (pA != pB) return pA.compareTo(pB);

                // फोर्स नंबर बैच अनुसार सॉर्टिंग (90, 91... 99, 00, 01, 02)
                String fa = a['force'].toString().trim();
                String fb = b['force'].toString().trim();
                return fa.compareTo(fb);
              });
            }

