            void _editStaffDetailsDialog(Map<String, dynamic> staff) {
              final rankCtrl = TextEditingController(text: staff['rank']);
              final nameCtrl = TextEditingController(text: staff['name']);
              final mobCtrl = TextEditingController(text: staff['mobile']);
              final repDateCtrl = TextEditingController(text: staff['gc_reporting_date']);
              final bloodCtrl = TextEditingController(text: staff['blood']);
              final icardCtrl = TextEditingController(text: staff['icard_no']);
              final dlCtrl = TextEditingController(text: staff['dl_no']);
              final dlValCtrl = TextEditingController(text: staff['dl_validity']);
              final addrCtrl = TextEditingController(text: staff['address']);
              final stateCtrl = TextEditingController(text: staff['state']);
              final leaveDaysCtrl = TextEditingController(text: (staff['leave_days'] ?? 15).toString());
              final courseNameCtrl = TextEditingController(text: staff['course_name'] ?? '');
              final attachOfficeCtrl = TextEditingController(text: staff['attach_office'] ?? '');
              String status = staff['status'] ?? 'PRESENT';

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text('${staff['rank']} ${staff['name']} (एडिट विवरण)'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          DropdownButtonFormField<String>(
                            value: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR'].contains(rankCtrl.text) ? rankCtrl.text : 'MTO',
                            decoration: const InputDecoration(labelText: 'रैंक चुनें (स्वतः कैडर तय होगा)'),
                            items: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR']
                                .map((r) => DropdownMenuItem(value: r, child: Text(r))).toList(),
                            onChanged: (val) => setD(() => rankCtrl.text = val!),
                          ),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'नाम')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल नंबर')),
                          DropdownButtonFormField<String>(
                            value: ['PRESENT', 'EL', 'CL', 'PL', 'LEAVE', 'MEDICAL', 'ATTACHED', 'COURSE'].contains(status) ? status : 'PRESENT',
                            decoration: const InputDecoration(labelText: 'स्थिति (Present, Leave, Attach, Course)'),
                            items: const [
                              DropdownMenuItem(value: 'PRESENT', child: Text('PRESENT (उपस्थित)')),
                              DropdownMenuItem(value: 'EL', child: Text('LEAVE: E/L (अर्जित अवकाश)')),
                              DropdownMenuItem(value: 'CL', child: Text('LEAVE: C/L (आकस्मिक अवकाश)')),
                              DropdownMenuItem(value: 'PL', child: Text('LEAVE: P/L (पितृत्व अवकाश)')),
                              DropdownMenuItem(value: 'MEDICAL', child: Text('LEAVE: MEDICAL (चिकित्सा अवकाश)')),
                              DropdownMenuItem(value: 'ATTACHED', child: Text('ATTACHED (संबद्ध/अटैच)')),
                              DropdownMenuItem(value: 'COURSE', child: Text('COURSE (प्रशिक्षण/कोर्स)')),
                            ],
                            onChanged: (val) => setD(() => status = val!),
                          ),
                          if (['EL', 'CL', 'PL', 'LEAVE', 'MEDICAL'].contains(status))
                            TextField(controller: leaveDaysCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'कितने दिन के अवकाश पर हैं?')),
                          if (status == 'ATTACHED')
                            TextField(controller: attachOfficeCtrl, decoration: const InputDecoration(labelText: 'अटैच कार्यालय / यूनिट का नाम')),
                          if (status == 'COURSE')
                            TextField(controller: courseNameCtrl, decoration: const InputDecoration(labelText: 'कोर्स का नाम (Course Name)')),
                          TextField(controller: repDateCtrl, decoration: const InputDecoration(labelText: 'GC AGT आगमन/स्थानांतरण दिनांक')),
