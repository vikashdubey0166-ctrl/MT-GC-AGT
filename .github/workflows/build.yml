            renderDashboard();
        }

        function saveMtParkDuty(e) {
            e.preventDefault();
            if (!checkIsAdmin()) {
                showToast("Only Admin can set duties!", "danger");
                return;
            }

            state.duties.mtPark = {
                hc: document.getElementById('mtpark-hc').value,
                ct: document.getElementById('mtpark-ct').value,
                assignedBy: state.currentUser.name,
