            Future<void> _exportVehiclesListPdf(String title, List<Map<String, dynamic>> list) async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(20),
                  build: (pw.Context ctx) => pw.Column(
                    children: [
                      pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                      pw.Center(child: pw.Text('$title - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10))),
                      pw.SizedBox(height: 10),
                      pw.Table(
                        border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                        children: [
                          pw.TableRow(
                            decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                            children: ['SL', 'REG NO', 'TYPE', 'CATEGORY', 'STATUS', 'INCHARGE', 'KM', 'INSP. DATE'].map((h) => pw.Container(
                              padding: const pw.EdgeInsets.all(4),
                              alignment: pw.Alignment.center,
                              child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 7.5)),
                            )).toList(),
                          ),
                          ...list.asMap().entries.map((e) {
                            final i = e.key + 1;
                            final v = e.value;
                            return pw.TableRow(
                              children: [
                                '$i',
                                v['no'] ?? '',
                                v['type'] ?? '',
                                v['category'] ?? '',
                                v['status'] ?? '',
                                v['driver_incharge'] ?? '',
                                '${v['total_km']} KM',
                                v['commission_date'] ?? v['reg_date'] ?? '-',
                              ].map((c) => pw.Container(
                                padding: const pw.EdgeInsets.all(3),
                                alignment: pw.Alignment.center,
                                child: pw.Text(c, style: const pw.TextStyle(fontSize: 7)),
                              )).toList(),
                            );
                          }).toList(),
                        ],
                      ),
                    ],
                  ),
                ),
              );

              await Printing.layoutPdf(onLayout: (PdfPageFormat format) async => pdf.save());
            }

