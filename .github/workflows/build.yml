          class _DashboardScreenState extends State<DashboardScreen> {
            late StreamSubscription _sub;
            late StreamSubscription _alertSub;

            @override
            void initState() {
              super.initState();
              _sub = MTStorage.dataUpdateStream.stream.listen((_) {
                if (mounted) setState(() {});
              });

              _alertSub = MTStorage.liveAlertStream.stream.listen((msg) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      content: Row(
                        children: [
                          const Icon(Icons.notifications_active, color: Colors.white),
                          const SizedBox(width: 8),
                          Expanded(child: Text(msg, style: const TextStyle(fontWeight: FontWeight.bold))),
                        ],
                      ),
                      backgroundColor: const Color(0xFF1B3B6F),
                      duration: const Duration(seconds: 4),
                      behavior: SnackBarBehavior.floating,
                    ),
                  );
                }
              });
            }

            @override
            void dispose() {
              _sub.cancel();
              _alertSub.cancel();
              super.dispose();
            }

