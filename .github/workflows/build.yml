            Future<void> _exportStaffSeniorityPdf() async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.MultiPage(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(18),
                  header: (pw.Context ctx) => pw.Column(
                    children: [
                      pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                      pw.Center(child: pw.Text('MT PLATOON SENIORITY & NOMINAL ROLL (PORTRAIT) - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 9.5))),
                      pw.SizedBox(height: 8),
                    ],
                  ),
                  build: (pw.Context ctx) => [
                    pw.Table(
                      border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                      children: [
                        pw.TableRow(
                          decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                          children: ['SL', 'FORCE NO', 'RANK', 'NAME', 'CURRENT STATUS', 'MOBILE', 'EL', 'CL', 'PL'].map((h) => pw.Container(
                            padding: const pw.EdgeInsets.all(3),
                            alignment: pw.Alignment.center,
                            child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 7)),
                          )).toList(),
                        ),
                        ...MTStorage.staffList.asMap().entries.map((e) {
                          final i = e.key + 1;
                          final s = e.value;
                          final statusDisplay = MTStorage.getStaffStatusTag(s);
                          return pw.TableRow(
                            children: [
                              '$i',
                              s['force'] ?? '',
                              s['rank'] ?? '',
                              s['name'] ?? '',
                              statusDisplay,
                              s['mobile'] ?? '',
                              '${s['el_bal'] ?? ''}',
                              '${s['cl_bal'] ?? ''}',
                              '${s['pl_bal'] ?? 30}',
                            ].map((c) => pw.Container(
                              padding: const pw.EdgeInsets.symmetric(vertical: 2.5, horizontal: 2),
                              alignment: pw.Alignment.center,
                              child: pw.Text(c, style: const pw.TextStyle(fontSize: 6.5)),
                            )).toList(),
                          );
                        }).toList(),
                      ],
                    ),
                  ],
                ),
              );

              await MTStorage.sharePdf(pdf, 'MT_Staff_Seniority');
            }

