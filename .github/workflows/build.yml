          // ================= LOGIN SCREEN =================
          class LoginScreen extends StatefulWidget {
            const LoginScreen({Key? key}) : super(key: key);

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _forceCtrl = TextEditingController();
            final _passCtrl = TextEditingController();
            bool _obscure = true;

            void _processLogin() async {
              final force = _forceCtrl.text.trim();
              final pass = _passCtrl.text.trim();

              final staff = MTStorage.staffList.firstWhere(
                (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                orElse: () => {},
              );

              if (staff.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('फोर्स नंबर रिकॉर्ड में मौजूद नहीं है!')),
                );
                return;
              }

              final expectedPass = MTStorage.passwords[staff['force']] ?? 'Mt@${staff['force']}';
              if (pass != expectedPass) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('गलत पासवर्ड! कृपया पुनः प्रयास करें।')),
                );
                return;
              }

              await MTStorage.setLoggedInUser(staff['force']);

              if (staff['force'] == MTStorage.activeAdminForce) {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                );
                return;
              }

              _showOtpVerificationDialog(staff);
            }

            void _showOtpVerificationDialog(Map<String, dynamic> staff) {
              final otp = (100000 + Random().nextInt(900000)).toString();
              final otpInputCtrl = TextEditingController();

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('सुरक्षा सत्यापन (OTP)', style: TextStyle(fontWeight: FontWeight.bold)),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text('कार्मिक: ${staff['rank']} ${staff['name']}'),
                      Text('पंजीकृत मो: +91 ${staff['mobile']}'),
                      const SizedBox(height: 10),
                      Container(
                        padding: const EdgeInsets.all(8),
                        color: Colors.amber.shade100,
                        child: Text('आपका OTP है: $otp', style: const TextStyle(fontWeight: FontWeight.bold)),
                      ),
                      const SizedBox(height: 10),
                      TextField(
                        controller: otpInputCtrl,
                        keyboardType: TextInputType.number,
                        textAlign: TextAlign.center,
                        decoration: const InputDecoration(labelText: 'OTP दर्ज करें', border: OutlineInputBorder()),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        if (otpInputCtrl.text.trim() == otp) {
                          await MTStorage.setLoggedInUser(staff['force']);
                          Navigator.pop(ctx);
                          Navigator.pushReplacement(
                            context,
                            MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                          );
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('अमान्य OTP!')));
                        }
                      },
                      child: const Text('सत्यापित करें'),
                    ),
                  ],
                ),
              );
            }

            void _showForgotPasswordDialog() {
              final resetForceCtrl = TextEditingController(text: _forceCtrl.text.trim());

              showDialog(
                context: context,
                builder: (fCtx) => AlertDialog(
                  title: const Row(
                    children: [
                      Icon(Icons.lock_reset, color: Color(0xFF1B3B6F)),
                      SizedBox(width: 8),
                      Text('पासवर्ड रीसेट करें', style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold)),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('अपना फोर्स नंबर दर्ज करें। आपके पंजीकृत मोबाइल नंबर पर OTP भेजा जाएगा:', style: TextStyle(fontSize: 12, color: Colors.blueGrey)),
                      const SizedBox(height: 12),
                      TextField(controller: resetForceCtrl, decoration: const InputDecoration(labelText: 'फोर्स नंबर', border: OutlineInputBorder())),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(fCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                      onPressed: () {
                        final force = resetForceCtrl.text.trim();
                        final staff = MTStorage.staffList.firstWhere(
                          (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                          orElse: () => {},
                        );
                        if (staff.isEmpty) {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('फोर्स नंबर मौजूद नहीं है!')));
                          return;
                        }
                        Navigator.pop(fCtx);
                        _proceedPasswordResetOtp(staff);
                      },
                      child: const Text('OTP भेजें'),
                    ),
                  ],
                ),
              );
            }

            void _proceedPasswordResetOtp(Map<String, dynamic> staff) {
              final resetOtp = (100000 + Random().nextInt(900000)).toString();
              final otpCtrl = TextEditingController();
              final newPassCtrl = TextEditingController();
              final confirmPassCtrl = TextEditingController();
              bool obs = true;

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setD) => AlertDialog(
                    title: const Text('सुरक्षा OTP व नया पासवर्ड'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text('कार्मिक: ${staff['rank']} ${staff['name']}'),
                          Text('पंजीकृत मो: +91 ${staff['mobile']}'),
                          const SizedBox(height: 10),
                          Container(
                            padding: const EdgeInsets.all(8),
                            color: Colors.green.shade50,
                            child: Text('पासवर्ड रीसेट OTP: $resetOtp', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.green)),
                          ),
                          const SizedBox(height: 8),
                          Center(
                            child: TextButton.icon(
                              icon: const Icon(Icons.chat, color: Colors.green, size: 18),
                              label: const Text('WhatsApp पर OTP भेजें', style: TextStyle(color: Colors.green, fontSize: 12)),
                              onPressed: () async {
                                final msg = Uri.encodeComponent('MT GC AGT पासवर्ड रीसेट OTP कोड: $resetOtp');
                                final uri = Uri.parse('https://wa.me/91${staff['mobile']}?text=$msg');
                                if (await canLaunchUrl(uri)) {
                                  await launchUrl(uri, mode: LaunchMode.externalApplication);
                                }
                              },
                            ),
                          ),
                          TextField(
                            controller: otpCtrl,
                            keyboardType: TextInputType.number,
                            textAlign: TextAlign.center,
                            decoration: const InputDecoration(labelText: '6 अंकों का OTP दर्ज करें', border: OutlineInputBorder()),
                          ),
                          const SizedBox(height: 8),
                          TextField(
                            controller: newPassCtrl,
                            obscureText: obs,
                            decoration: InputDecoration(
                              labelText: 'नया पासवर्ड',
                              border: const OutlineInputBorder(),
                              suffixIcon: IconButton(icon: Icon(obs ? Icons.visibility_off : Icons.visibility), onPressed: () => setD(() => obs = !obs)),
                            ),
                          ),
                          const SizedBox(height: 8),
                          TextField(
                            controller: confirmPassCtrl,
                            obscureText: obs,
                            decoration: const InputDecoration(labelText: 'नए पासवर्ड की पुष्टि करें', border: OutlineInputBorder()),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                        onPressed: () async {
                          if (otpCtrl.text.trim() != resetOtp) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('अमान्य OTP!')));
                            return;
                          }
                          if (newPassCtrl.text.trim().isEmpty || newPassCtrl.text.trim() != confirmPassCtrl.text.trim()) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('पासवर्ड मेल नहीं खाते या रिक्त हैं!')));
                            return;
                          }
                          MTStorage.passwords[staff['force']] = newPassCtrl.text.trim();
                          await MTStorage.saveData();
                          Navigator.pop(ctx);
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('पासवर्ड सफलतापूर्वक बदल गया है! नए पासवर्ड से लॉगिन करें।'), backgroundColor: Colors.green));
