                      onPressed: () async {
                        if (titleCtrl.text.isNotEmpty) {
                          MTStorage.paradeCustomRows.insert(index, {
                            'title': titleCtrl.text.trim().toUpperCase(),
                            'vals': valCtrls.map((c) => c.text.trim()).toList(),
                            'isBold': false
                          });
                          await MTStorage.saveData();
                          Navigator.pop(dCtx);
                          setState(() {});
                        }
                      },
                      child: const Text('पंक्ति इन्सर्ट करें'),
                    ),
                  ],
                ),
              );
            }

            void _addColumnDialog() {
              final colNameCtrl = TextEditingController();

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('परेड स्टेटमेंट में नया कॉलम जोड़ें (एडमिन)'),
                  content: TextField(controller: colNameCtrl, decoration: const InputDecoration(labelText: 'कॉलम हेडर नाम')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        if (colNameCtrl.text.isNotEmpty) {
                          MTStorage.paradeCustomColumns.insert(MTStorage.paradeCustomColumns.length - 1, colNameCtrl.text.trim().toUpperCase());
                          for (var r in MTStorage.paradeCustomRows) {
                            (r['vals'] as List).add('00');
                          }
                          await MTStorage.saveData();
                          Navigator.pop(ctx);
                          setState(() {});
                        }
                      },
                      child: const Text('कॉलम जोड़ें'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              return Scaffold(
                appBar: AppBar(
                  title: const Text('MT PLATOON PARADE STATEMENT'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
                  actions: [
                    if (widget.isAdmin) ...[
                      IconButton(
                        icon: const Icon(Icons.note_add),
                        tooltip: 'नई Word/Excel फाइल बनाएं',
                        onPressed: _createNewParadeFileFormatDialog,
                      ),
                      IconButton(
                        icon: const Icon(Icons.view_column),
                        tooltip: 'नया कॉलम जोड़ें',
                        onPressed: _addColumnDialog,
                      ),
                      IconButton(
                        icon: const Icon(Icons.add_circle_outline),
                        tooltip: 'नई रो (पंक्ति) जोड़ें',
                        onPressed: () => _insertRowAtDialog(MTStorage.paradeCustomRows.length),
                      ),
                      IconButton(
                        icon: const Icon(Icons.picture_as_pdf),
                        tooltip: 'खड़े पेज (Portrait) में PDF (एडमिन)',
                        onPressed: _exportParadePdf,
                      ),
                    ],
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    children: [
                      Text(
                        'MT PLATOON PARADE STATEMENT GC CRPF AGARTALA\nAS ON DATE: $dateStr',
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13),
                      ),
                      if (widget.isAdmin)
                        const Padding(
                          padding: EdgeInsets.symmetric(vertical: 4),
                          child: Text('* किसी भी पंक्ति पर क्लिक करके बदलाव करें/हटाएं या बीच में नई पंक्ति जोड़ें',
                              style: TextStyle(color: Colors.green, fontSize: 11, fontWeight: FontWeight.bold)),
                        ),
                      const SizedBox(height: 12),
                      SingleChildScrollView(
                        scrollDirection: Axis.horizontal,
                        child: Table(
                          defaultColumnWidth: const FixedColumnWidth(68),
                          border: TableBorder.all(color: Colors.black54, width: 0.8),
                          children: [
                            TableRow(
                              decoration: BoxDecoration(color: Colors.indigo.shade50),
                              children: MTStorage.paradeCustomColumns.map((h) => Padding(
                                padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 2),
                                child: Text(h, textAlign: TextAlign.center, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.bold)),
                              )).toList(),
                            ),
                            ...MTStorage.paradeCustomRows.asMap().entries.map((entry) => _customDataRow(entry.value, entry.key)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text('HC/MT', style: TextStyle(fontWeight: FontWeight.bold)),
                          Text('MTO GC CRPF AGARTALA', style: TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            TableRow _customDataRow(Map<String, dynamic> r, int index) {
              final bool isBold = r['isBold'] == true;
              return TableRow(
                decoration: BoxDecoration(color: isBold ? Colors.indigo.shade50.withOpacity(0.4) : null),
                children: [
                  InkWell(
                    onTap: widget.isAdmin ? () => _showRowOptionSheet(r, index) : null,
                    child: Padding(
                      padding: const EdgeInsets.all(4.0),
                      child: Text(r['title'], style: TextStyle(fontSize: 9, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                    ),
                  ),
                  ...List<String>.from(r['vals']).map((v) => InkWell(
                    onTap: widget.isAdmin ? () => _showRowOptionSheet(r, index) : null,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 4),
                      child: Text(v, textAlign: TextAlign.center, style: TextStyle(fontSize: 10, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                    ),
                  )),
                ],
              );
            }

            void _showRowOptionSheet(Map<String, dynamic> r, int index) {
              showModalBottomSheet(
                context: context,
                builder: (ctx) => Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    ListTile(
                      leading: const Icon(Icons.arrow_upward, color: Colors.teal),
                      title: const Text('इसके ऊपर नई रो (पंक्ति) जोड़ें'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _insertRowAtDialog(index);
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.arrow_downward, color: Colors.green),
                      title: const Text('इसके नीचे नई रो (पंक्ति) जोड़ें'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _insertRowAtDialog(index + 1);
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.delete, color: Colors.red),
                      title: const Text('यह पंक्ति हटाएं (Delete)'),
                      onTap: () async {
                        MTStorage.paradeCustomRows.removeAt(index);
                        await MTStorage.saveData();
                        Navigator.pop(ctx);
                        setState(() {});
                      },
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: |
          cd mt_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT_GC_AGT_Release_APK
          path: mt_app/build/app/outputs/flutter-apk/app-release.apk
