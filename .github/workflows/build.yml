            ];

            static final Map<String, dynamic> defaultTodayDuty = {
              'duty_date': '21/10/2026',
              'pump_commander': 'HC/DVR DEBASHISH DEB',
              'pump_guard_1st': 'CT/DVR VIKASH DUBEY',
