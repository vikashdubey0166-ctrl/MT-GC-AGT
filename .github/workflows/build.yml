            // ================= TODAY DUTY =================
            void _openTodayDutyScreen(bool isAdmin) {
              String selectedDate = DateFormat('dd/MM/yyyy').format(DateTime.now());
              if (!MTStorage.dateWiseDuties.containsKey(selectedDate)) {
                MTStorage.dateWiseDuties[selectedDate] = Map<String, dynamic>.from(MTStorage.defaultTodayDuty);
                MTStorage.dateWiseDuties[selectedDate]['duty_date'] = selectedDate;
              }

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setDutyState) {
                    final duty = MTStorage.dateWiseDuties[selectedDate] ?? MTStorage.defaultTodayDuty;

                    return Container(
                      height: MediaQuery.of(ctx).size.height * 0.90,
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('टुडे ड्यूटी (दिनांक सहित)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                  Text('चयनित दिनांक: $selectedDate', style: const TextStyle(color: Color(0xFF1B3B6F), fontWeight: FontWeight.bold)),
                                ],
                              ),
                              Row(
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.calendar_month, color: Color(0xFF1B3B6F)),
                                    tooltip: 'दिनांक चुनें',
                                    onPressed: () async {
                                      final picked = await showDatePicker(
                                        context: context,
                                        initialDate: DateTime.now(),
                                        firstDate: DateTime(2025),
                                        lastDate: DateTime(2030),
                                      );
                                      if (picked != null) {
                                        final newDt = DateFormat('dd/MM/yyyy').format(picked);
                                        if (!MTStorage.dateWiseDuties.containsKey(newDt)) {
                                          MTStorage.dateWiseDuties[newDt] = Map<String, dynamic>.from(MTStorage.defaultTodayDuty);
                                          MTStorage.dateWiseDuties[newDt]['duty_date'] = newDt;
                                          await MTStorage.saveData(changeDesc: 'ड्यूटी दिनांक $newDt तैयार की गई');
                                        }
                                        setDutyState(() => selectedDate = newDt);
                                      }
                                    },
                                  ),
                                  IconButton(
                                    icon: const Icon(Icons.share, color: Colors.green),
                                    tooltip: 'PDF शेयर करें',
                                    onPressed: () => _exportTodayDutyPdf(duty),
                                  ),
                                  if (isAdmin)
                                    ElevatedButton.icon(
