name: Build MT GC AGT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup MT Branch App Code
        run: |
          flutter create mt_app --org com.crpf.agartala --project-name mt_app
          cd mt_app
          
          # Stable Android dependencies including PDF, Printing and Image Picker
          flutter pub add shared_preferences intl image_picker url_launcher pdf printing
          
          # Set App Label
          sed -i 's/android:label="mt_app"/android:label="MT GC AGT"/g' android/app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:math';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MTStorage.init();
            runApp(const MTBranchApp());
          }

          class MTBranchApp extends StatelessWidget {
            const MTBranchApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MT GC AGT',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF1B3B6F)),
                  useMaterial3: true,
                ),
                home: const LoginScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          // ================= PERSISTENT LOCAL STORAGE =================
          class MTStorage {
            static late SharedPreferences prefs;
            static List<Map<String, dynamic>> staffList = [];
            static List<Map<String, dynamic>> vehicles = [];
            static List<Map<String, dynamic>> inOutLogs = [];
            static List<Map<String, dynamic>> leaves = [];
            static Map<String, String> passwords = {};
            static List<Map<String, dynamic>> paradeCustomRows = [];

            static Future<void> init() async {
              prefs = await SharedPreferences.getInstance();
              loadData();
            }

            static void loadData() {
              final staffStr = prefs.getString('crpf_staff_master_v5');
              staffList = staffStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(staffStr))
                  : List<Map<String, dynamic>>.from(defaultStaff);
              sortStaffByCategoryAndSeniority();

              final vehStr = prefs.getString('crpf_veh_master_v5');
              vehicles = vehStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(vehStr))
                  : List<Map<String, dynamic>>.from(defaultVehicles);

              final logsStr = prefs.getString('crpf_inout_master_v5');
              inOutLogs = logsStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(logsStr))
                  : List<Map<String, dynamic>>.from(defaultLogs);

              final leavesStr = prefs.getString('crpf_leaves_master_v5');
              leaves = leavesStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(leavesStr))
                  : List<Map<String, dynamic>>.from(defaultLeaves);

              final passStr = prefs.getString('crpf_passwords_v5');
              passwords = passStr != null
                  ? Map<String, String>.from(jsonDecode(passStr))
                  : {'165060166': 'Mt@165060166'};

              final paradeStr = prefs.getString('crpf_parade_custom_v5');
              paradeCustomRows = paradeStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(paradeStr))
                  : List<Map<String, dynamic>>.from(defaultParadeRows);
            }

            static Future<void> saveData() async {
              sortStaffByCategoryAndSeniority();
              await prefs.setString('crpf_staff_master_v5', jsonEncode(staffList));
              await prefs.setString('crpf_veh_master_v5', jsonEncode(vehicles));
              await prefs.setString('crpf_inout_master_v5', jsonEncode(inOutLogs));
              await prefs.setString('crpf_leaves_master_v5', jsonEncode(leaves));
              await prefs.setString('crpf_passwords_v5', jsonEncode(passwords));
              await prefs.setString('crpf_parade_custom_v5', jsonEncode(paradeCustomRows));
            }

            static int getGroupPriority(Map<String, dynamic> staff) {
              String rank = staff['rank'].toString().toUpperCase();
              String role = staff['role'].toString().toUpperCase();

              if (rank.contains('INSP') || rank.contains('SI/MT') || rank.contains('ASI/MT')) return 1;
              if (rank.contains('HC/DVR')) return 2;
              if (rank.contains('CT/DVR')) return 3;
              if (rank.contains('MM') || rank.contains('PTR') || rank.contains('DTR') || role.contains('WORKSHOP')) return 4;
              return 5;
            }

            // 90..99 के तुरंत बाद 00, 01, 02..05 क्रम हेतु वर्ष रूपांतरण
            static int getSeniorityYear(String forceNo) {
              if (forceNo.length < 2) return 9999;
              int prefix = int.tryParse(forceNo.substring(0, 2)) ?? 99;
              return prefix >= 50 ? (1900 + prefix) : (2000 + prefix);
            }

            static void sortStaffByCategoryAndSeniority() {
              staffList.sort((a, b) {
                int pA = getGroupPriority(a);
                int pB = getGroupPriority(b);
                if (pA != pB) return pA.compareTo(pB);

                int yearA = getSeniorityYear(a['force'].toString());
                int yearB = getSeniorityYear(b['force'].toString());
                if (yearA != yearB) return yearA.compareTo(yearB);

                return a['force'].toString().compareTo(b['force'].toString());
              });
            }

