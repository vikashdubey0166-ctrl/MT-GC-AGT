            void _createNewParadeFileFormatDialog() {
              String fileType = 'EXCEL';
              final filenameCtrl = TextEditingController(text: 'MT_PARADE_CUSTOM_${DateFormat('ddMM').format(DateTime.now())}');
              final descCtrl = TextEditingController(text: 'दैनिक परेड एवं वाहन रिपोर्ट');

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setF) => AlertDialog(
                    title: const Text('नई परेड फाइल बनाएं (एडमिन)'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('यह फाइल MS WORD या EXCEL जिसमें एडमिन चुनेंगे उसमें कार्य करेगी तथा सभी कार्मिकों को अलग से दिखेगी:', style: TextStyle(fontSize: 12, color: Colors.blueGrey)),
                        const SizedBox(height: 10),
                        DropdownButtonFormField<String>(
                          value: fileType,
                          decoration: const InputDecoration(labelText: 'फाइल फॉर्मेट चुनें'),
                          items: const [
                            DropdownMenuItem(value: 'EXCEL', child: Text('MS EXCEL (.xlsx / .csv)')),
                            DropdownMenuItem(value: 'WORD', child: Text('MS WORD (.docx / .doc)')),
                          ],
                          onChanged: (val) => setF(() => fileType = val!),
                        ),
                        TextField(controller: filenameCtrl, decoration: const InputDecoration(labelText: 'फाइल का नाम')),
                        TextField(controller: descCtrl, decoration: const InputDecoration(labelText: 'विवरण / टिप्पणी')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (filenameCtrl.text.isNotEmpty) {
                            MTStorage.customParadeFiles.add({
                              'id': 'file_${DateTime.now().millisecondsSinceEpoch}',
                              'name': filenameCtrl.text.trim().toUpperCase(),
                              'type': fileType,
                              'created_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                              'description': descCtrl.text.trim(),
                            });
                            await MTStorage.addNotification('नई परेड फाइल उपलब्ध', 'एडमिन द्वारा नई $fileType फाइल (${filenameCtrl.text}) जोड़ी गई।');
                            await MTStorage.saveData();
                            Navigator.pop(ctx);
                            setState(() {});
                            ScaffoldMessenger.of(context).showSnackBar(
                              SnackBar(content: Text('नई $fileType फाइल: ${filenameCtrl.text} तैयार हो गई!'), backgroundColor: Colors.green),
                            );
                          }
                        },
                        child: const Text('फाइल जोड़ें व सुरक्षित करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            void _insertRowAtDialog(int index) {
              final titleCtrl = TextEditingController();
              final int colCount = MTStorage.paradeCustomColumns.length - 1;
              List<TextEditingController> valCtrls = List.generate(
                colCount,
                (i) => TextEditingController(text: '00'),
              );

              showDialog(
                context: context,
                builder: (dCtx) => AlertDialog(
                  title: Text('पंक्ति जोड़ें (क्रम संख्या: ${index + 1})'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: titleCtrl, decoration: const InputDecoration(labelText: 'पर्टिकुलर / विवरण नाम')),
                        const SizedBox(height: 8),
                        Wrap(
                          spacing: 6,
                          runSpacing: 4,
                          children: List.generate(colCount, (i) {
                            return SizedBox(
                              width: 65,
                              child: TextField(
                                controller: valCtrls[i],
                                textAlign: TextAlign.center,
                                decoration: InputDecoration(labelText: MTStorage.paradeCustomColumns[i + 1].replaceAll('\n', ' ')),
                              ),
                            );
                          }),
                        ),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        if (titleCtrl.text.isNotEmpty) {
                          MTStorage.paradeCustomRows.insert(index, {
                            'title': titleCtrl.text.trim().toUpperCase(),
                            'vals': valCtrls.map((c) => c.text.trim()).toList(),
                            'isBold': false
                          });
                          await MTStorage.saveData();
                          Navigator.pop(dCtx);
                          setState(() {});
                        }
                      },
                      child: const Text('पंक्ति इन्सर्ट करें'),
                    ),
                  ],
                ),
              );
            }

            void _addColumnDialog() {
              final colNameCtrl = TextEditingController();

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('परेड स्टेटमेंट में नया कॉलम जोड़ें (एडमिन)'),
                  content: TextField(controller: colNameCtrl, decoration: const InputDecoration(labelText: 'कॉलम हेडर नाम')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        if (colNameCtrl.text.isNotEmpty) {
                          MTStorage.paradeCustomColumns.insert(MTStorage.paradeCustomColumns.length - 1, colNameCtrl.text.trim().toUpperCase());
                          for (var r in MTStorage.paradeCustomRows) {
                            (r['vals'] as List).add('00');
                          }
                          await MTStorage.saveData();
                          Navigator.pop(ctx);
                          setState(() {});
                        }
                      },
                      child: const Text('कॉलम जोड़ें'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              return Scaffold(
                appBar: AppBar(
                  title: const Text('MT PLATOON PARADE & FILES'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
