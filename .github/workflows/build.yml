            TableRow _customDataRow(Map<String, dynamic> r, int index) {
              final bool isBold = r['isBold'] == true;
              return TableRow(
                decoration: BoxDecoration(color: isBold ? Colors.indigo.shade50.withOpacity(0.4) : null),
                children: [
                  InkWell(
                    onTap: widget.isAdmin ? () => _showRowOptionSheet(r, index) : null,
                    child: Padding(
                      padding: const EdgeInsets.all(4.0),
                      child: Text(r['title'], style: TextStyle(fontSize: 9, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                    ),
                  ),
                  ...List<String>.from(r['vals']).map((v) => InkWell(
                    onTap: widget.isAdmin ? () => _showRowOptionSheet(r, index) : null,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 4),
                      child: Text(v, textAlign: TextAlign.center, style: TextStyle(fontSize: 10, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                    ),
                  )),
                ],
              );
            }

            void _showRowOptionSheet(Map<String, dynamic> r, int index) {
              showModalBottomSheet(
                context: context,
                builder: (ctx) => Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    ListTile(
                      leading: const Icon(Icons.arrow_upward, color: Colors.teal),
                      title: const Text('इसके ऊपर नई रो (पंक्ति) जोड़ें'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _insertRowAtDialog(index);
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.arrow_downward, color: Colors.green),
                      title: const Text('इसके नीचे नई रो (पंक्ति) जोड़ें'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _insertRowAtDialog(index + 1);
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.delete, color: Colors.red),
                      title: const Text('यह पंक्ति हटाएं (Delete)'),
                      onTap: () async {
                        MTStorage.paradeCustomRows.removeAt(index);
                        await MTStorage.saveData();
                        Navigator.pop(ctx);
                        setState(() {});
                      },
                    ),
                  ],
                ),
              );
            }

            Future<void> _downloadCustomFilePdf(Map<String, dynamic> file) async {
              final pdf = pw.Document();

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(24),
                  build: (pw.Context ctx) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 14))),
                        pw.Center(child: pw.Text('FILE: ${file['name']} (${file['type']})', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 12))),
                        pw.Center(child: pw.Text('DATE: ${file['created_date']}', style: const pw.TextStyle(fontSize: 10))),
                        pw.SizedBox(height: 16),
                        pw.Text('DESCRIPTION: ${file['description']}', style: const pw.TextStyle(fontSize: 10)),
                        pw.SizedBox(height: 16),
                        pw.Table(
                          border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                          children: [
                            pw.TableRow(
                              decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                              children: MTStorage.paradeCustomColumns.take(7).map((h) => pw.Container(padding: const pw.EdgeInsets.all(4), alignment: pw.Alignment.center, child: pw.Text(h.replaceAll('\n', ' '), style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 8)))).toList(),
                            ),
                            ...MTStorage.paradeCustomRows.take(6).map((r) {
                              final cells = [r['title'].toString(), ...List<String>.from(r['vals']).take(6)];
                              return pw.TableRow(
                                children: cells.map((c) => pw.Container(padding: const pw.EdgeInsets.all(4), alignment: pw.Alignment.center, child: pw.Text(c, style: const pw.TextStyle(fontSize: 8)))).toList(),
                              );
                            }).toList(),
                          ],
                        ),
                      ],
                    );
                  },
                ),
              );

              await Printing.layoutPdf(onLayout: (PdfPageFormat format) async => pdf.save());
            }
          }
