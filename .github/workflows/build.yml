            void _editTodayDutyDialog(String dutyDate, VoidCallback onDone) {
              final duty = MTStorage.dateWiseDuties[dutyDate] ?? Map<String, dynamic>.from(MTStorage.defaultTodayDuty);

              final allEligibleHC = MTStorage.staffList.where((s) => s['rank'].toString().contains('HC')).toList();
              final allEligibleCT = MTStorage.staffList.where((s) => s['rank'].toString().contains('CT')).toList();

              String pCommander = duty['pump_commander'] ?? (allEligibleHC.isNotEmpty ? '${allEligibleHC[0]['rank']} ${allEligibleHC[0]['name']}' : '');
              String pg1 = duty['pump_guard_1st'] ?? (allEligibleCT.isNotEmpty ? '${allEligibleCT[0]['rank']} ${allEligibleCT[0]['name']}' : '');
              String pg2 = duty['pump_guard_2nd'] ?? (allEligibleCT.length > 1 ? '${allEligibleCT[1]['rank']} ${allEligibleCT[1]['name']}' : '');
              String pg3 = duty['pump_guard_3rd'] ?? (allEligibleCT.length > 2 ? '${allEligibleCT[2]['rank']} ${allEligibleCT[2]['name']}' : '');
              String pg4 = duty['pump_guard_4th'] ?? (allEligibleCT.length > 3 ? '${allEligibleCT[3]['rank']} ${allEligibleCT[3]['name']}' : '');

              String parkCommander = duty['park_commander'] ?? (allEligibleHC.length > 1 ? '${allEligibleHC[1]['rank']} ${allEligibleHC[1]['name']}' : '');
              String parkg1 = duty['park_guard_1st'] ?? (allEligibleCT.length > 4 ? '${allEligibleCT[4]['rank']} ${allEligibleCT[4]['name']}' : '');

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: Text('Assign Duty for $dutyDate (Admin)'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('1. Petrol Pump Guard (01 HC + 04 CT):', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.indigo)),
                          _buildDropdownHC(allEligibleHC, pCommander, 'Pump Commander (HC)', (v) => setD(() => pCommander = v)),
                          _buildDropdownCT(allEligibleCT, pg1, '1st Relief Guard (CT)', (v) => setD(() => pg1 = v)),
                          _buildDropdownCT(allEligibleCT, pg2, '2nd Relief Guard (CT)', (v) => setD(() => pg2 = v)),
                          _buildDropdownCT(allEligibleCT, pg3, '3rd Relief Guard (CT)', (v) => setD(() => pg3 = v)),
                          _buildDropdownCT(allEligibleCT, pg4, '4th Relief Guard (CT)', (v) => setD(() => pg4 = v)),
                          const SizedBox(height: 14),
                          const Text('2. MT Park Guard (01 HC + 01 CT):', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.teal)),
                          _buildDropdownHC(allEligibleHC, parkCommander, 'Park Commander (HC)', (v) => setD(() => parkCommander = v)),
                          _buildDropdownCT(allEligibleCT, parkg1, 'Park Guard (01 CT)', (v) => setD(() => parkg1 = v)),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('Cancel')),
                      ElevatedButton(
                        onPressed: () async {
                          duty['duty_date'] = dutyDate;
                          duty['pump_commander'] = pCommander;
                          duty['pump_guard_1st'] = pg1;
                          duty['pump_guard_2nd'] = pg2;
                          duty['pump_guard_3rd'] = pg3;
                          duty['pump_guard_4th'] = pg4;

                          duty['park_commander'] = parkCommander;
                          duty['park_guard_1st'] = parkg1;

                          MTStorage.dateWiseDuties[dutyDate] = duty;
                          await MTStorage.addNotification('Duty Roster Updated', 'Daily duty roster updated for $dutyDate.');
                          Navigator.pop(dCtx);
                          onDone();
                        },
                        child: const Text('Save & Publish'),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildDropdownHC(List<Map<String, dynamic>> list, String currentVal, String label, Function(String) onChanged) {
              return DropdownButtonFormField<String>(
                value: list.any((h) => '${h['rank']} ${h['name']}' == currentVal) ? currentVal : null,
                isExpanded: true,
                decoration: InputDecoration(labelText: label),
                items: list.map((h) {
                  final val = '${h['rank']} ${h['name']}';
                  return DropdownMenuItem(value: val, child: Text(val, style: const TextStyle(fontSize: 12)));
                }).toList(),
                onChanged: (v) => onChanged(v!),
              );
            }

            Widget _buildDropdownCT(List<Map<String, dynamic>> list, String currentVal, String label, Function(String) onChanged) {
              return DropdownButtonFormField<String>(
                value: list.any((c) => '${c['rank']} ${c['name']}' == currentVal) ? currentVal : null,
                isExpanded: true,
                decoration: InputDecoration(labelText: label),
                items: list.map((c) {
                  final val = '${c['rank']} ${c['name']}';
                  return DropdownMenuItem(value: val, child: Text(val, style: const TextStyle(fontSize: 12)));
                }).toList(),
                onChanged: (v) => onChanged(v!),
              );
            }

