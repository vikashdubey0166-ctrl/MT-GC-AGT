            void _addOrEditStaffDialog(BuildContext ctx, Map<String, dynamic>? staff, VoidCallback onSuccess) {
              final isEdit = staff != null;
              final forceCtrl = TextEditingController(text: isEdit ? staff['force'] : '');
              final nameCtrl = TextEditingController(text: isEdit ? staff['name'] : '');
              final rankCtrl = TextEditingController(text: isEdit ? staff['rank'] : 'CT/DVR');
              final roleCtrl = TextEditingController(text: isEdit ? staff['role'] : 'STAFF');
              final mobCtrl = TextEditingController(text: isEdit ? staff['mobile'] : '');
              final locCtrl = TextEditingController(text: isEdit ? staff['location'] : 'GC AGT');
              final dlCtrl = TextEditingController(text: isEdit ? (staff['dl_no'] ?? '') : '');
              final bloodCtrl = TextEditingController(text: isEdit ? (staff['blood'] ?? 'B+') : 'B+');
              final stateCtrl = TextEditingController(text: isEdit ? (staff['state'] ?? '') : '');
              final addrCtrl = TextEditingController(text: isEdit ? (staff['address'] ?? '') : '');
              final elCtrl = TextEditingController(text: isEdit ? '${staff['el_bal']}' : '60');
              final clCtrl = TextEditingController(text: isEdit ? '${staff['cl_bal']}' : '15');

              String status = isEdit ? staff['status'] : 'PRESENT';
              String dutyType = isEdit ? (staff['duty_type'] ?? 'CAMP') : 'CAMP';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlgState) => AlertDialog(
                    title: Text(isEdit ? 'स्टाफ एवं बायोडाटा बदलें' : 'नया स्टाफ जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: forceCtrl, enabled: !isEdit, decoration: const InputDecoration(labelText: 'फोर्स नंबर (सीनियरिटी अनुसार)')),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'पूरा नाम')),
                          TextField(controller: rankCtrl, decoration: const InputDecoration(labelText: 'रैंक (Rank)')),
                          TextField(controller: roleCtrl, decoration: const InputDecoration(labelText: 'रोल / पद (उदा. MT HAVILDAR)')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल नंबर')),
                          TextField(controller: dlCtrl, decoration: const InputDecoration(labelText: 'ड्राइविंग लाइसेंस नंबर')),
                          TextField(controller: bloodCtrl, decoration: const InputDecoration(labelText: 'ब्लड ग्रुप (उदा. B+, O+)')),
                          TextField(controller: stateCtrl, decoration: const InputDecoration(labelText: 'गृह राज्य (State)')),
                          TextField(controller: addrCtrl, maxLines: 2, decoration: const InputDecoration(labelText: 'पूरा स्थायी पता (Full Address)')),
                          const SizedBox(height: 10),
                          DropdownButtonFormField<String>(
                            value: status,
                            decoration: const InputDecoration(labelText: 'स्थिति (Duty State)'),
                            items: ['PRESENT', 'ATTACHED', 'GOVT_DUTY', 'LEAVE', 'COURSE', 'SICK', 'REST']
                                .map((st) => DropdownMenuItem(value: st, child: Text(st))).toList(),
                            onChanged: (val) => setDlgState(() => status = val!),
                          ),
                          DropdownButtonFormField<String>(
                            value: dutyType,
                            decoration: const InputDecoration(labelText: 'परेड ड्यूटी प्रकार'),
                            items: ['CAMP', 'LINE', 'POL_GUARD', 'MT_PARK', 'AMBULANCE', 'SCHOOL_BUS', 'ATTACHED', 'GOVT_DUTY', 'WORKSHOP']
                                .map((dt) => DropdownMenuItem(value: dt, child: Text(dt))).toList(),
                            onChanged: (val) => setDlgState(() => dutyType = val!),
                          ),
                          TextField(controller: locCtrl, decoration: const InputDecoration(labelText: 'स्थान / लोकेशन (उदा. IG TPA, GC AGT)')),
                          Row(
                            children: [
                              Expanded(child: TextField(controller: elCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'बकाया EL'))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: clCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'बकाया CL'))),
                            ],
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (forceCtrl.text.isNotEmpty && nameCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              staff['name'] = nameCtrl.text.trim().toUpperCase();
                              staff['rank'] = rankCtrl.text.trim().toUpperCase();
                              staff['role'] = roleCtrl.text.trim().toUpperCase();
                              staff['mobile'] = mobCtrl.text.trim();
                              staff['dl_no'] = dlCtrl.text.trim().toUpperCase();
                              staff['blood'] = bloodCtrl.text.trim().toUpperCase();
                              staff['state'] = stateCtrl.text.trim().toUpperCase();
                              staff['address'] = addrCtrl.text.trim();
                              staff['status'] = status;
                              staff['duty_type'] = dutyType;
                              staff['location'] = locCtrl.text.trim().toUpperCase();
                              staff['el_bal'] = int.tryParse(elCtrl.text) ?? 60;
                              staff['cl_bal'] = int.tryParse(clCtrl.text) ?? 15;
                            } else {
                              MTStorage.staffList.add({
                                'force': forceCtrl.text.trim(),
                                'name': nameCtrl.text.trim().toUpperCase(),
                                'rank': rankCtrl.text.trim().toUpperCase(),
                                'role': roleCtrl.text.trim().toUpperCase(),
                                'mobile': mobCtrl.text.trim(),
                                'dl_no': dlCtrl.text.trim().toUpperCase(),
                                'blood': bloodCtrl.text.trim().toUpperCase(),
                                'state': stateCtrl.text.trim().toUpperCase(),
                                'address': addrCtrl.text.trim(),
                                'status': status,
                                'duty_type': dutyType,
                                'location': locCtrl.text.trim().toUpperCase(),
                                'el_bal': int.tryParse(elCtrl.text) ?? 60,
                                'cl_bal': int.tryParse(clCtrl.text) ?? 15,
                                'photo_base64': '',
                              });
                            }
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onSuccess();
                          }
                        },
                        child: Text(isEdit ? 'अपडेट करें' : 'जोड़ें'),
                      ),
                    ],
                  ),
                ),
              );
            }

