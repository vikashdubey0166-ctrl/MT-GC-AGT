          // ================= LOGIN SCREEN =================
          class LoginScreen extends StatefulWidget {
            const LoginScreen({Key? key}) : super(key: key);

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _forceCtrl = TextEditingController();
            final _passCtrl = TextEditingController();
            bool _obscure = true;

            void _processLogin() async {
              final force = _forceCtrl.text.trim();
              final pass = _passCtrl.text.trim();

              final staff = MTStorage.staffList.firstWhere(
                (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                orElse: () => {},
              );

              if (staff.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Force Number not found in record!')),
                );
                return;
              }

              final expectedPass = MTStorage.passwords[staff['force']] ?? 'Mt@${staff['force']}';
              if (pass != expectedPass) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Invalid Password! Please check and try again.')),
                );
                return;
              }

              await MTStorage.setLoggedInUser(staff['force']);

              if (staff['force'] == MTStorage.activeAdminForce) {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                );
                return;
              }

              _showOtpVerificationDialog(staff);
            }

            void _showOtpVerificationDialog(Map<String, dynamic> staff) {
              final otp = (100000 + Random().nextInt(900000)).toString();
              final otpInputCtrl = TextEditingController();

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('Security Verification (OTP)', style: TextStyle(fontWeight: FontWeight.bold)),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text('Personnel: ${staff['rank']} ${staff['name']}'),
                      Text('Mobile: +91 ${staff['mobile']}'),
                      const SizedBox(height: 10),
                      Container(
                        padding: const EdgeInsets.all(8),
                        color: Colors.amber.shade100,
                        child: Text('Your Login OTP: $otp', style: const TextStyle(fontWeight: FontWeight.bold)),
                      ),
                      const SizedBox(height: 10),
                      TextField(
                        controller: otpInputCtrl,
                        keyboardType: TextInputType.number,
                        textAlign: TextAlign.center,
                        decoration: const InputDecoration(labelText: 'Enter 6-digit OTP', border: OutlineInputBorder()),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () async {
                        if (otpInputCtrl.text.trim() == otp) {
                          await MTStorage.setLoggedInUser(staff['force']);
                          Navigator.pop(ctx);
                          Navigator.pushReplacement(
                            context,
                            MaterialPageRoute(builder: (_) => DashboardScreen(currentUser: staff)),
                          );
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid OTP!')));
                        }
                      },
                      child: const Text('Verify & Login'),
                    ),
                  ],
                ),
              );
            }

            void _showForgotPasswordDialog() {
              final resetForceCtrl = TextEditingController(text: _forceCtrl.text.trim());

              showDialog(
                context: context,
                builder: (fCtx) => AlertDialog(
                  title: const Row(
                    children: [
                      Icon(Icons.lock_reset, color: Color(0xFF1B3B6F)),
                      SizedBox(width: 8),
                      Text('Reset Password', style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold)),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('Enter your Force Number to proceed:', style: TextStyle(fontSize: 12, color: Colors.blueGrey)),
                      const SizedBox(height: 12),
                      TextField(controller: resetForceCtrl, decoration: const InputDecoration(labelText: 'Force Number', border: OutlineInputBorder())),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(fCtx), child: const Text('Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                      onPressed: () {
                        final force = resetForceCtrl.text.trim();
                        final staff = MTStorage.staffList.firstWhere(
                          (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                          orElse: () => {},
                        );
                        if (staff.isEmpty) {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Force Number does not exist!')));
                          return;
                        }
                        Navigator.pop(fCtx);
                        _proceedPasswordResetOtp(staff);
                      },
                      child: const Text('Send OTP'),
                    ),
                  ],
                ),
              );
            }

            void _proceedPasswordResetOtp(Map<String, dynamic> staff) {
              final resetOtp = (100000 + Random().nextInt(900000)).toString();
              final otpCtrl = TextEditingController();
              final newPassCtrl = TextEditingController();
              final confirmPassCtrl = TextEditingController();
              bool obs = true;

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setD) => AlertDialog(
                    title: const Text('OTP & Set New Password'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text('Personnel: ${staff['rank']} ${staff['name']}'),
                          Text('Mobile: +91 ${staff['mobile']}'),
                          const SizedBox(height: 10),
                          Container(
                            padding: const EdgeInsets.all(8),
                            color: Colors.green.shade50,
                            child: Text('Password Reset OTP: $resetOtp', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.green)),
                          ),
                          const SizedBox(height: 8),
                          Center(
                            child: TextButton.icon(
                              icon: const Icon(Icons.chat, color: Colors.green, size: 18),
                              label: const Text('Share OTP via WhatsApp', style: TextStyle(color: Colors.green, fontSize: 12)),
                              onPressed: () async {
                                final msg = Uri.encodeComponent('MT GC AGT Password Reset OTP: $resetOtp');
                                final uri = Uri.parse('https://wa.me/91${staff['mobile']}?text=$msg');
                                if (await canLaunchUrl(uri)) {
                                  await launchUrl(uri, mode: LaunchMode.externalApplication);
                                }
                              },
                            ),
                          ),
                          TextField(
                            controller: otpCtrl,
                            keyboardType: TextInputType.number,
                            textAlign: TextAlign.center,
                            decoration: const InputDecoration(labelText: 'Enter 6-digit OTP', border: OutlineInputBorder()),
                          ),
                          const SizedBox(height: 8),
                          TextField(
                            controller: newPassCtrl,
                            obscureText: obs,
                            decoration: InputDecoration(
                              labelText: 'New Password',
                              border: const OutlineInputBorder(),
                              suffixIcon: IconButton(icon: Icon(obs ? Icons.visibility_off : Icons.visibility), onPressed: () => setD(() => obs = !obs)),
                            ),
                          ),
                          const SizedBox(height: 8),
                          TextField(
                            controller: confirmPassCtrl,
                            obscureText: obs,
                            decoration: const InputDecoration(labelText: 'Confirm New Password', border: OutlineInputBorder()),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                        onPressed: () async {
                          if (otpCtrl.text.trim() != resetOtp) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid OTP!')));
                            return;
                          }
                          if (newPassCtrl.text.trim().isEmpty || newPassCtrl.text.trim() != confirmPassCtrl.text.trim()) {
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Passwords do not match or are blank!')));
                            return;
                          }
                          MTStorage.passwords[staff['force']] = newPassCtrl.text.trim();
                          await MTStorage.saveData(changeDesc: 'Password reset for Force: ${staff['force']}');
                          Navigator.pop(ctx);
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Password updated successfully!'), backgroundColor: Colors.green));
                        },
