            void _addOutDialog(BuildContext ctx, Map<String, dynamic> user, bool isAdmin, VoidCallback onAdded) {
              String selectedVeh = MTStorage.vehicles[0]['no'];
              String selectedDvr = isAdmin ? '${MTStorage.staffList[0]['rank']} ${MTStorage.staffList[0]['name']}' : '${user['rank']} ${user['name']}';
              final purCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('गाड़ी OUT दर्ज करें'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: selectedVeh,
                          decoration: const InputDecoration(labelText: 'गाड़ी चुनें'),
                          items: MTStorage.vehicles.map<DropdownMenuItem<String>>((v) {
                            return DropdownMenuItem(value: v['no'] as String, child: Text(v['no'] as String, style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedVeh = val!),
                        ),
                        if (isAdmin)
                          DropdownButtonFormField<String>(
                            value: selectedDvr,
                            decoration: const InputDecoration(labelText: 'चालक चुनें (Admin Option)'),
                            items: MTStorage.staffList.map<DropdownMenuItem<String>>((s) {
                              final fullN = '${s['rank']} ${s['name']}';
                              return DropdownMenuItem(value: fullN, child: Text(fullN, style: const TextStyle(fontSize: 12)));
                            }).toList(),
                            onChanged: (val) => setDlg(() => selectedDvr = val!),
                          )
                        else
                          TextField(
                            controller: TextEditingController(text: selectedDvr),
                            enabled: false,
                            decoration: const InputDecoration(labelText: 'चालक (आप)'),
                          ),
                        TextField(controller: purCtrl, decoration: const InputDecoration(labelText: 'ड्यूटी का उद्देश्य')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (purCtrl.text.isNotEmpty) {
                            MTStorage.inOutLogs.insert(0, {
                              'vehicle': selectedVeh,
                              'driver': selectedDvr,
                              'purpose': purCtrl.text.trim(),
                              'status': 'OUT',
                              'out_time': DateFormat('dd/MM/yyyy hh:mm a').format(DateTime.now()),
                              'in_time': '-'
                            });
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onAdded();
                          }
                        },
                        child: const Text('OUT दर्ज करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // ================= LEAVES =================
            void _openLeaves(bool isAdmin, Map<String, dynamic> user) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) => Container(
                    height: MediaQuery.of(ctx).size.height * 0.90,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('अवकाश रिकॉर्ड (Leave Pass)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                              icon: const Icon(Icons.add, size: 16),
                              label: const Text('छुट्टी अर्जी दें'),
                              onPressed: () => _applyLeaveDialog(ctx, user, () async {
                                await MTStorage.saveData();
                                setSheetState(() {});
                                setState(() {});
                              }),
                            ),
                          ],
                        ),
                        const Divider(),
                        Expanded(
                          child: ListView.builder(
                            itemCount: MTStorage.leaves.length,
                            itemBuilder: (ctx, i) {
                              final l = MTStorage.leaves[i];
                              Color bg = Colors.orange;
                              if (l['status'] == 'APPROVED') bg = Colors.green;
                              if (l['status'] == 'REJECTED') bg = Colors.red;

                              return Card(
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(l['name'], style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                                          Chip(label: Text(l['status']), backgroundColor: bg.withOpacity(0.15)),
                                        ],
                                      ),
                                      Text('अवकाश: ${l['type']} | कुल: ${l['total_days']} दिन (${l['from_date']} से ${l['to_date']})'),
                                      Text('कारण: ${l['reason']}'),
                                      if (isAdmin && l['status'] == 'PENDING')
                                        Padding(
                                          padding: const EdgeInsets.only(top: 8.0),
                                          child: Row(
                                            mainAxisAlignment: MainAxisAlignment.end,
                                            children: [
                                              OutlinedButton(
                                                style: OutlinedButton.styleFrom(foregroundColor: Colors.red),
                                                onPressed: () async {
                                                  l['status'] = 'REJECTED';
                                                  await MTStorage.saveData();
                                                  setSheetState(() {});
                                                  setState(() {});
                                                },
                                                child: const Text('अस्वीकार'),
                                              ),
                                              const SizedBox(width: 8),
                                              ElevatedButton(
                                                style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                                                onPressed: () async {
                                                  l['status'] = 'APPROVED';
                                                  final staff = MTStorage.staffList.firstWhere((s) => s['force'] == l['force'], orElse: () => {});
                                                  if (staff.isNotEmpty) {
                                                    staff['status'] = l['type'];
                                                    int days = l['total_days'] ?? 1;
                                                    if (l['type'] == 'EL') {
                                                      staff['el_bal'] = (staff['el_bal'] - days).clamp(0, 60);
                                                    } else if (l['type'] == 'CL') {
                                                      staff['cl_bal'] = (staff['cl_bal'] - days).clamp(0, 15);
                                                    }
                                                  }
                                                  await MTStorage.saveData();
                                                  setSheetState(() {});
                                                  setState(() {});
                                                },
                                                child: const Text('मंजूर करें (Admin Approve)'),
                                              ),
                                            ],
                                          ),
                                        )
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _applyLeaveDialog(BuildContext ctx, Map<String, dynamic> user, VoidCallback onAdded) {
              String type = 'EL';
              final fromCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now()));
              final toCtrl = TextEditingController(text: DateFormat('yyyy-MM-dd').format(DateTime.now().add(const Duration(days: 15))));
              final totalCtrl = TextEditingController(text: '15');
              final rsnCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('अवकाश हेतु आवेदन'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          DropdownButtonFormField<String>(
                            value: type,
                            decoration: const InputDecoration(labelText: 'अवकाश प्रकार'),
                            items: ['EL', 'CL', 'MEDICAL'].map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                            onChanged: (val) => setDlg(() => type = val!),
                          ),
                          TextField(controller: fromCtrl, decoration: const InputDecoration(labelText: 'शुरू दिनांक (YYYY-MM-DD)')),
                          TextField(controller: toCtrl, decoration: const InputDecoration(labelText: 'समाप्ति दिनांक (YYYY-MM-DD)')),
                          TextField(controller: totalCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'कुल दिन')),
                          TextField(controller: rsnCtrl, decoration: const InputDecoration(labelText: 'कारण')),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          MTStorage.leaves.insert(0, {
                            'force': user['force'],
                            'name': '${user['rank']} ${user['name']}',
                            'type': type,
                            'from_date': fromCtrl.text.trim(),
                            'to_date': toCtrl.text.trim(),
                            'total_days': int.tryParse(totalCtrl.text) ?? 1,
                            'reason': rsnCtrl.text.trim(),
                            'status': 'PENDING'
                          });
                          await MTStorage.saveData();
                          Navigator.pop(dCtx);
                          onAdded();
                        },
                        child: const Text('आवेदन भेजें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // ================= VEHICLE MASTER =================
            void _openVehicles(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) {
                    return Container(
                      height: MediaQuery.of(ctx).size.height * 0.90,
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('वाहन मास्टर (${MTStorage.vehicles.length})', style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                              if (isAdmin)
                                ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1B3B6F), foregroundColor: Colors.white),
                                  icon: const Icon(Icons.add, size: 16),
                                  label: const Text('नई गाड़ी'),
                                  onPressed: () {
                                    _addOrEditVehicleDialog(ctx, null, () async {
                                      await MTStorage.saveData();
                                      setSheetState(() {});
                                      setState(() {});
                                    });
                                  },
                                ),
                            ],
                          ),
                          const Divider(),
                          Expanded(
                            child: ListView.builder(
                              itemCount: MTStorage.vehicles.length,
                              itemBuilder: (ctx, i) {
                                final v = MTStorage.vehicles[i];
                                return Card(
                                  child: ListTile(
                                    leading: const CircleAvatar(child: Icon(Icons.directions_car)),
                                    title: Text('${v['no']} (${v['type']})', style: const TextStyle(fontWeight: FontWeight.bold)),
                                    subtitle: Text('श्रेणी: ${v['category']} | स्थिति: ${v['status']}\nइंचार्ज: ${v['driver_incharge'] ?? 'अनावंटित'}'),
                                    trailing: isAdmin ? const Icon(Icons.edit, color: Colors.blueGrey) : null,
                                    onTap: () {
                                      if (isAdmin) {
                                        _addOrEditVehicleDialog(ctx, v, () async {
                                          await MTStorage.saveData();
                                          setSheetState(() {});
                                          setState(() {});
                                        });
                                      }
                                    },
                                  ),
                                );
                              },
                            ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            void _addOrEditVehicleDialog(BuildContext ctx, Map<String, dynamic>? vehicle, VoidCallback onSuccess) {
              final isEdit = vehicle != null;
              final noCtrl = TextEditingController(text: isEdit ? vehicle['no'] : '');
              final typeCtrl = TextEditingController(text: isEdit ? vehicle['type'] : '');
              final myCtrl = TextEditingController(text: isEdit ? vehicle['model_year'] : '2022');
              final ownerCtrl = TextEditingController(text: isEdit ? vehicle['owner'] : 'GC AGT');
              final costCtrl = TextEditingController(text: isEdit ? vehicle['cost'] : '0');
              final fuelCtrl = TextEditingController(text: isEdit ? vehicle['fuel_cap'] : '60 Ltr');
              final kmCtrl = TextEditingController(text: isEdit ? vehicle['total_km'] : '0');

              String category = isEdit ? vehicle['category'] : 'LIGHT VEHICLE (LV)';
              String status = isEdit ? vehicle['status'] : 'AVAILABLE';

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlgState) => AlertDialog(
                    title: Text(isEdit ? 'गाड़ी विवरण बदलें' : 'नई गाड़ी जोड़ें'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: noCtrl, decoration: const InputDecoration(labelText: 'गाड़ी नंबर')),
                          TextField(controller: typeCtrl, decoration: const InputDecoration(labelText: 'प्रकार')),
                          DropdownButtonFormField<String>(
                            value: category,
                            decoration: const InputDecoration(labelText: 'श्रेणी'),
                            items: ['LIGHT VEHICLE (LV)', 'MEDIUM VEHICLE (MV)', 'HEAVY VEHICLE (HV)', 'SPECIAL VEHICLE (SV)']
                                .map((c) => DropdownMenuItem(value: c, child: Text(c, style: const TextStyle(fontSize: 11)))).toList(),
                            onChanged: (val) => setDlgState(() => category = val!),
                          ),
                          DropdownButtonFormField<String>(
                            value: status,
                            decoration: const InputDecoration(labelText: 'वर्तमान स्थिति'),
                            items: ['AVAILABLE', 'ON_DUTY', 'ATTACHED', 'OFF_ROAD']
                                .map((st) => DropdownMenuItem(value: st, child: Text(st))).toList(),
                            onChanged: (val) => setDlgState(() => status = val!),
                          ),
                          TextField(controller: myCtrl, decoration: const InputDecoration(labelText: 'मॉडल वर्ष')),
                          TextField(controller: ownerCtrl, decoration: const InputDecoration(labelText: 'मालिक')),
                          TextField(controller: costCtrl, decoration: const InputDecoration(labelText: 'कीमत (₹)')),
                          TextField(controller: fuelCtrl, decoration: const InputDecoration(labelText: 'ईंधन क्षमता')),
                          TextField(controller: kmCtrl, decoration: const InputDecoration(labelText: 'कुल किलोमीटर')),
                        ],
                      ),
                    ),
                    actions: [
                      if (isEdit)
                        TextButton(
                          style: TextButton.styleFrom(foregroundColor: Colors.red),
                          onPressed: () async {
                            MTStorage.vehicles.remove(vehicle);
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onSuccess();
                          },
                          child: const Text('हटाएं'),
                        ),
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () {
                          if (noCtrl.text.isNotEmpty) {
                            if (isEdit) {
                              vehicle['no'] = noCtrl.text.trim().toUpperCase();
                              vehicle['type'] = typeCtrl.text.trim().toUpperCase();
                              vehicle['category'] = category;
                              vehicle['status'] = status;
                              vehicle['model_year'] = myCtrl.text.trim();
                              vehicle['owner'] = ownerCtrl.text.trim();
                              vehicle['cost'] = costCtrl.text.trim();
                              vehicle['fuel_cap'] = fuelCtrl.text.trim();
                              vehicle['total_km'] = kmCtrl.text.trim();
                            } else {
                              MTStorage.vehicles.insert(0, {
                                'no': noCtrl.text.trim().toUpperCase(),
                                'type': typeCtrl.text.trim().toUpperCase(),
                                'category': category,
                                'status': status,
                                'driver_incharge': 'अनावंटित',
                                'attach_type': 'NONE',
                                'attach_loc': 'GC AGT',
                                'model_year': myCtrl.text.trim(),
                                'reg_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                                'owner': ownerCtrl.text.trim(),
                                'cost': costCtrl.text.trim(),
                                'repair_cost': '0',
                                'fuel_cap': fuelCtrl.text.trim(),
                                'total_km': kmCtrl.text.trim(),
                                'service_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                                'tyre_rot_km': '0',
                                'tools_issued': 'Jack, Wheel Pana',
                              });
                            }
                            Navigator.pop(dCtx);
                            onSuccess();
                          }
                        },
                        child: Text(isEdit ? 'अपडेट करें' : 'सुरक्षित करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            // ================= STAFF SENIORITY LIST =================
            void _openStaff(bool isAdmin) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setSheetState) {
                    final soList = MTStorage.staffList.where((s) => MTStorage.getGroupPriority(s) == 1).toList();
                    final hcList = MTStorage.staffList.where((s) => MTStorage.getGroupPriority(s) == 2).toList();
                    final ctList = MTStorage.staffList.where((s) => MTStorage.getGroupPriority(s) == 3).toList();
                    final wsList = MTStorage.staffList.where((s) => MTStorage.getGroupPriority(s) == 4).toList();

                    return Container(
                      height: MediaQuery.of(ctx).size.height * 0.90,
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('कार्मिक सीनियरिटी सूची (नाम पर क्लिक कर प्रोफाइल देखें)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          const Divider(),
                          Expanded(
                            child: ListView(
                              children: [
                                _sectionTitle('1. अधिकारी वर्ग (SO\'s Cadre) - ${soList.length}', Colors.purple),
                                ...soList.map((s) => _staffTile(s, isAdmin, setSheetState)),
                                _sectionTitle('2. हवलदार ड्राइवर (HC/DVR) [91..99, 00, 01, 02..05 क्रम] - ${hcList.length}', Colors.indigo),
                                ...hcList.map((s) => _staffTile(s, isAdmin, setSheetState)),
                                _sectionTitle('3. सिपाही ड्राइवर (CT/DVR) - ${ctList.length}', Colors.teal),
                                ...ctList.map((s) => _staffTile(s, isAdmin, setSheetState)),
                                _sectionTitle('4. वर्कशॉप स्टाफ (Workshop Cadre) - ${wsList.length}', Colors.deepOrange),
                                ...wsList.map((s) => _staffTile(s, isAdmin, setSheetState)),
                              ],
                            ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            Widget _sectionTitle(String title, Color col) {
              return Container(
                padding: const EdgeInsets.all(8),
                margin: const EdgeInsets.only(top: 8, bottom: 4),
                decoration: BoxDecoration(color: col.withOpacity(0.12), borderRadius: BorderRadius.circular(6)),
                child: Text(title, style: TextStyle(fontWeight: FontWeight.bold, color: col, fontSize: 13)),
              );
            }

            Widget _staffTile(Map<String, dynamic> s, bool isAdmin, StateSetter setSheetState) {
              return Card(
                margin: const EdgeInsets.symmetric(vertical: 3),
                child: ListTile(
                  onTap: () => _openStaffProfile(s, isAdmin),
                  leading: _buildAvatar(s, radius: 20),
                  title: Text('${s['rank']} ${s['name']}', style: const TextStyle(fontWeight: FontWeight.bold)),
                  subtitle: Text('फोर्स सं: ${s['force']} | ड्यूटी: ${s['status']} | राज्य: ${s['state'] ?? '-'}'),
                  trailing: const Icon(Icons.arrow_forward_ios, size: 14),
                ),
              );
            }
          }

          // ================= CRPF AGARTALA PARADE GRID (EDIT & PDF DOWNLOAD) =================
          class OfficialParadeGridScreen extends StatefulWidget {
            final bool isAdmin;
            const OfficialParadeGridScreen({Key? key, required this.isAdmin}) : super(key: key);

            @override
            State<OfficialParadeGridScreen> createState() => _OfficialParadeGridScreenState();
          }

          class _OfficialParadeGridScreenState extends State<OfficialParadeGridScreen> {
            final List<String> colHeaders = [
              'PARTICULAR', 'INSP\nMT', 'ASI\nMT', 'HC\nDVR', 'CT\nDVR', 'TOTAL',
              'SI\nMM', 'ASI\nMM', 'HC\nMMV', 'CT\nMMV', 'CT\nDTR', 'TOTAL', 'G/TOT'
            ];

            Future<void> _exportParadePdf() async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4.landscape,
                  build: (pw.Context context) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.center,
                      children: [
                        pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 16)),
                        pw.SizedBox(height: 4),
                        pw.Text('DAILY MT PLATOON PARADE STATEMENT - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13)),
                        pw.SizedBox(height: 14),
                        pw.Table(
                          border: pw.TableBorder.all(color: PdfColors.black, width: 0.6),
                          children: [
                            pw.TableRow(
                              decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                              children: colHeaders.map((h) => pw.Container(
                                padding: const pw.EdgeInsets.all(3),
                                alignment: pw.Alignment.center,
                                child: pw.Text(h.replaceAll('\n', ' '), textAlign: pw.TextAlign.center, style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold)),
                              )).toList(),
                            ),
                            ...MTStorage.paradeCustomRows.map((r) {
                              final List<String> rowCells = [r['title'].toString(), ...List<String>.from(r['vals'])];
                              final bool isB = r['isBold'] == true;
                              return pw.TableRow(
                                children: rowCells.map((c) => pw.Container(
                                  padding: const pw.EdgeInsets.symmetric(vertical: 3, horizontal: 2),
                                  alignment: pw.Alignment.center,
                                  child: pw.Text(c, textAlign: pw.TextAlign.center, style: pw.TextStyle(fontSize: 8, fontWeight: isB ? pw.FontWeight.bold : pw.FontWeight.normal)),
                                )).toList(),
                              );
                            }).toList(),
                          ],
                        ),
                        pw.SizedBox(height: 30),
                        pw.Row(
                          mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                          children: [
                            pw.Text('HC/MT (CHIEF WRITER)\nGC CRPF AGT', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10)),
                            pw.Text('MTO\nGC CRPF AGARTALA', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10)),
                            pw.Text('DIGP\nGC CRPF AGARTALA', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 10)),
                          ],
                        ),
                      ],
                    );
                  },
                ),
              );

              await Printing.layoutPdf(onLayout: (PdfPageFormat format) async => pdf.save());
            }

            void _editRowDialog(Map<String, dynamic> row) {
              final titleCtrl = TextEditingController(text: row['title']);
              List<TextEditingController> valCtrls = List.generate(
                12,
                (i) => TextEditingController(text: (row['vals'] as List)[i].toString()),
              );

              showDialog(
                context: context,
                builder: (dCtx) => AlertDialog(
                  title: Text('${row['title']} मान संशोधित करें'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: titleCtrl, decoration: const InputDecoration(labelText: 'पर्टिकुलर नाम')),
                        const SizedBox(height: 8),
                        Wrap(
                          spacing: 8,
                          runSpacing: 4,
                          children: List.generate(12, (i) {
                            return SizedBox(
                              width: 65,
                              child: TextField(
                                controller: valCtrls[i],
                                textAlign: TextAlign.center,
                                decoration: InputDecoration(labelText: colHeaders[i + 1].replaceAll('\n', ' ')),
                              ),
                            );
                          }),
                        ),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                    ElevatedButton(
                      onPressed: () async {
                        row['title'] = titleCtrl.text.trim();
                        row['vals'] = valCtrls.map((c) => c.text.trim()).toList();
                        await MTStorage.saveData();
                        Navigator.pop(dCtx);
                        setState(() {});
                      },
                      child: const Text('अपडेट करें'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              return Scaffold(
                appBar: AppBar(
                  title: const Text('MT PLATOON PARADE STATEMENT'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.picture_as_pdf),
                      tooltip: 'PDF डाउनलोड व प्रिंट करें',
                      onPressed: _exportParadePdf,
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    children: [
                      Text(
                        'MT PLATOON PARADE STATEMENT GC CRPF AGARTALA\nAS ON DATE: $dateStr',
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13),
                      ),
                      if (widget.isAdmin)
                        const Padding(
                          padding: EdgeInsets.symmetric(vertical: 4),
                          child: Text('* किसी भी पंक्ति पर क्लिक करके मान बदलें (एडमिन अधिकार)', style: TextStyle(color: Colors.green, fontSize: 11, fontWeight: FontWeight.bold)),
                        ),
                      const SizedBox(height: 12),
                      SingleChildScrollView(
                        scrollDirection: Axis.horizontal,
                        child: Table(
                          defaultColumnWidth: const FixedColumnWidth(68),
                          border: TableBorder.all(color: Colors.black54, width: 0.8),
                          children: [
                            _headerRow(),
                            ...MTStorage.paradeCustomRows.map((r) => _customDataRow(r)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text('HC/MT', style: TextStyle(fontWeight: FontWeight.bold)),
                          Text('MTO GC CRPF AGARTALA', style: TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            TableRow _headerRow() {
              return TableRow(
                decoration: BoxDecoration(color: Colors.indigo.shade50),
                children: colHeaders.map((h) => Padding(
                  padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 2),
                  child: Text(h, textAlign: TextAlign.center, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.bold)),
                )).toList(),
              );
            }

            TableRow _customDataRow(Map<String, dynamic> r) {
              final bool isBold = r['isBold'] == true;
              return TableRow(
                decoration: BoxDecoration(color: isBold ? Colors.indigo.shade50.withOpacity(0.4) : null),
                children: [
                  InkWell(
                    onTap: widget.isAdmin ? () => _editRowDialog(r) : null,
                    child: Padding(
                      padding: const EdgeInsets.all(4.0),
                      child: Text(r['title'], style: TextStyle(fontSize: 9, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                    ),
                  ),
                  ...List<String>.from(r['vals']).map((v) => InkWell(
                    onTap: widget.isAdmin ? () => _editRowDialog(r) : null,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 4),
                      child: Text(v, textAlign: TextAlign.center, style: TextStyle(fontSize: 10, fontWeight: isBold ? FontWeight.bold : FontWeight.normal)),
                    ),
                  )),
                ],
              );
            }
          }
