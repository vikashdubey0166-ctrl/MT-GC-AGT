                            itemCount: MTStorage.inOutLogs.length,
                            itemBuilder: (ctx, i) {
                              final log = MTStorage.inOutLogs[i];
                              final bool isOut = log['status'] == 'OUT';

                              return Card(
                                child: Padding(
                                  padding: const EdgeInsets.all(12),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(log['vehicle'], style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                                          Chip(
                                            label: Text(log['status']),
                                            backgroundColor: isOut ? Colors.amber.shade100 : Colors.green.shade100,
                                          )
                                        ],
                                      ),
                                      Text('चालक: ${log['driver']} | ड्यूटी: ${log['purpose']}'),
                                      Text('OUT समय: ${log['out_time']}'),
                                      Text('IN समय: ${log['in_time']}'),
                                      if (isOut)
                                        Align(
                                          alignment: Alignment.centerRight,
                                          child: ElevatedButton.icon(
                                            style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, foregroundColor: Colors.white),
                                            icon: const Icon(Icons.login, size: 16),
                                            label: const Text('गाड़ी IN करें'),
                                            onPressed: () async {
                                              log['status'] = 'IN';
                                              log['in_time'] = DateFormat('yyyy-MM-dd hh:mm a').format(DateTime.now());
                                              await MTStorage.saveData();
                                              setSheetState(() {});
                                              setState(() {});
                                            },
                                          ),
                                        ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _addOutDialog(BuildContext ctx, VoidCallback onAdded) {
              String selectedVeh = MTStorage.vehicles[0]['no'];
              String selectedDvr = MTStorage.staffList[0]['name'];
              final purCtrl = TextEditingController();

              showDialog(
                context: ctx,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setDlg) => AlertDialog(
                    title: const Text('गाड़ी OUT दर्ज करें'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        DropdownButtonFormField<String>(
                          value: selectedVeh,
                          decoration: const InputDecoration(labelText: 'गाड़ी चुनें'),
                          items: MTStorage.vehicles.map<DropdownMenuItem<String>>((v) {
                            return DropdownMenuItem(value: v['no'] as String, child: Text(v['no'] as String, style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedVeh = val!),
                        ),
                        DropdownButtonFormField<String>(
                          value: selectedDvr,
                          decoration: const InputDecoration(labelText: 'ड्राइवर चुनें'),
                          items: MTStorage.staffList.map<DropdownMenuItem<String>>((s) {
                            return DropdownMenuItem(value: s['name'] as String, child: Text('${s['rank']} ${s['name']}', style: const TextStyle(fontSize: 12)));
                          }).toList(),
                          onChanged: (val) => setDlg(() => selectedDvr = val!),
                        ),
                        TextField(controller: purCtrl, decoration: const InputDecoration(labelText: 'ड्यूटी का उद्देश्य')),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (purCtrl.text.isNotEmpty) {
                            MTStorage.inOutLogs.insert(0, {
                              'vehicle': selectedVeh,
                              'driver': selectedDvr,
                              'purpose': purCtrl.text.trim(),
                              'status': 'OUT',
                              'out_time': DateFormat('yyyy-MM-dd hh:mm a').format(DateTime.now()),
                              'in_time': '-'
                            });
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onAdded();
                          }
                        },
                        child: const Text('OUT दर्ज करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _detailRow(String label, String value) {
              return Padding(
                padding: const EdgeInsets.symmetric(vertical: 2.5),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Text(label, style: const TextStyle(color: Colors.blueGrey, fontSize: 12)),
                    Text(value, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                  ],
                ),
              );
            }

            void _confirmDelete(BuildContext ctx, String itemName, VoidCallback onDelete) {
              showDialog(
                context: ctx,
                builder: (c) => AlertDialog(
                  title: const Text('हटाने की पुष्टि करें'),
                  content: Text('क्या आप वाकई $itemName को हटाना चाहते हैं?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(c), child: const Text('नहीं')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white),
                      onPressed: () {
                        onDelete();
                        Navigator.pop(c);
                      },
                      child: const Text('हाँ, हटाएं'),
                    ),
                  ],
                ),
              );
            }
          }

          // ================= DAILY MT PARADE STATE SCREEN =================
          class ParadeStateScreen extends StatelessWidget {
            const ParadeStateScreen({Key? key}) : super(key: key);

            void _printReportDialog(BuildContext context) {
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());
              final totalStaff = MTStorage.staffList.length;
              final onLeave = MTStorage.staffList.where((s) => s['status'] == 'LEAVE').length;
              final attached = MTStorage.staffList.where((s) => s['status'] == 'ATTACHED').length;
              final present = MTStorage.staffList.where((s) => s['status'] == 'PRESENT').length;

              final totalVeh = MTStorage.vehicles.length;
              final availVeh = MTStorage.vehicles.where((v) => v['status'] == 'AVAILABLE').length;
              final onDutyVeh = MTStorage.vehicles.where((v) => v['status'] == 'ON_DUTY').length;
              final attVeh = MTStorage.vehicles.where((v) => v['status'] == 'ATTACHED').length;
              final offRoadVeh = MTStorage.vehicles.where((v) => v['status'] == 'OFF_ROAD').length;

              final reportText = '''
          ==================================================
          PARADE STATEMENT R/O MT GC CRPF, AGARTALA (W. TRIPURA)
          DATE: $dateStr
          ==================================================

          [1] PERSONNEL STATE (STAFF):
          • AUTHORISED STRENGTH: 65
          • POSTED STRENGTH: $totalStaff
          • PRESENT IN UNIT: $present
          • ON LEAVE (EL/CL): $onLeave
          • ATTACHED OUT: $attached
          • GOVT DUTY / COURSE: ${MTStorage.staffList.where((s) => s['status'] == 'GOVT_DUTY' || s['status'] == 'COURSE').length}

          [2] VEHICLE FLEET STATE:
          • TOTAL VEHICLES: $totalVeh
          • AVAILABLE (ON-ROAD): $availVeh
          • ON DUTY: $onDutyVeh
          • ATTACHED OUT: $attVeh
          • OFF-ROAD (WORKSHOP): $offRoadVeh

          [3] ATTACHED VEHICLES LIST:
          • IG Office Agartala: JK02 DK 7573, MH40 BG 4125, AS01 NC 2289
          • 71 Bn CRPF: AS01 DC 3020 (Tata Bus)
          • 124 Bn CRPF: AS01 DD 1809 (Tata Bus)
          • Manipur Sector HQ: TR01 Q 0986 (Tractor)
          ==================================================
          MT WRITER (GC AGT)                MTO (GC AGT)
          ''';

              Clipboard.setData(ClipboardData(text: reportText));
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('दैनिक परेड स्टेट तैयार है'),
                  content: SingleChildScrollView(
                    child: Text(reportText, style: const TextStyle(fontFamily: 'monospace', fontSize: 11)),
                  ),
                  actions: [
                    ElevatedButton.icon(
                      icon: const Icon(Icons.copy),
                      label: const Text('कॉपी व शेयर करें'),
                      onPressed: () {
                        Navigator.pop(ctx);
                        ScaffoldMessenger.of(context).showSnackBar(
                          const SnackBar(content: Text('परेड स्टेट क्लिपबोर्ड में कॉपी हो गया! आप इसे WhatsApp या प्रिंटर पर भेज सकते हैं।')),
                        );
                      },
                    ),
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('बंद करें')),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              return Scaffold(
                appBar: AppBar(
                  title: const Text('दैनिक एम टी परेड स्टेट'),
                  backgroundColor: const Color(0xFF1B3B6F),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
