            void _addNewStaffDialog(VoidCallback onDone) {
              final forceCtrl = TextEditingController();
              final nameCtrl = TextEditingController();
              final mobCtrl = TextEditingController();
              final rankCtrl = TextEditingController(text: 'CT/DVR');
              final stateCtrl = TextEditingController();

              showDialog(
                context: context,
                builder: (dCtx) => StatefulBuilder(
                  builder: (dCtx, setD) => AlertDialog(
                    title: const Text('नया कार्मिक जोड़ें (एडमिन)'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(controller: forceCtrl, decoration: const InputDecoration(labelText: 'फोर्स नंबर')),
                          DropdownButtonFormField<String>(
                            value: rankCtrl.text,
                            decoration: const InputDecoration(labelText: 'रैंक'),
                            items: ['MTO', 'INSP/MT', 'SI/MM', 'ASI/MT', 'HC/DVR', 'CT/DVR', 'HC/MMV', 'CT/MMV', 'CT/PTR']
                                .map((r) => DropdownMenuItem(value: r, child: Text(r))).toList(),
                            onChanged: (val) => setD(() => rankCtrl.text = val!),
                          ),
                          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'नाम')),
                          TextField(controller: mobCtrl, decoration: const InputDecoration(labelText: 'मोबाइल')),
                          TextField(controller: stateCtrl, decoration: const InputDecoration(labelText: 'गृह राज्य')),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dCtx), child: const Text('रद्द करें')),
                      ElevatedButton(
                        onPressed: () async {
                          if (forceCtrl.text.isNotEmpty && nameCtrl.text.isNotEmpty) {
                            MTStorage.staffList.add({
                              'force': forceCtrl.text.trim(),
                              'rank': rankCtrl.text.trim().toUpperCase(),
                              'name': nameCtrl.text.trim().toUpperCase(),
                              'role': rankCtrl.text == 'MTO' ? 'MTO' : 'STAFF',
                              'mobile': mobCtrl.text.trim(),
                              'status': 'PRESENT',
                              'leave_days': 0,
                              'course_name': '',
                              'location': 'GC AGT',
                              'duty_type': 'CAMP',
                              'gc_reporting_date': DateFormat('dd/MM/yyyy').format(DateTime.now()),
                              'blood': 'B+',
                              'icard_no': 'AGT-${forceCtrl.text.trim()}',
                              'dl_no': rankCtrl.text.contains('DVR') ? 'DL-${forceCtrl.text.trim()}' : '',
                              'dl_validity': rankCtrl.text.contains('DVR') ? '31/12/2028' : '',
                              'state': stateCtrl.text.trim().toUpperCase(),
                              'address': '',
                              'photo_base64': '',
                              'attach_type': 'NONE',
                              'attach_office': '',
                              'el_bal': 60,
                              'cl_bal': 15,
                              'pl_bal': 30
                            });
                            await MTStorage.saveData();
                            Navigator.pop(dCtx);
                            onDone();
                          }
                        },
                        child: const Text('सुरक्षित करें'),
                      ),
                    ],
                  ),
                ),
              );
            }

            Future<void> _exportStaffSeniorityPdf() async {
              final pdf = pw.Document();
              final dateStr = DateFormat('dd/MM/yyyy').format(DateTime.now());

              pdf.addPage(
                pw.MultiPage(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(18),
                  header: (pw.Context ctx) => pw.Column(
                    children: [
                      pw.Center(child: pw.Text('GROUP CENTRE CRPF AGARTALA (TRIPURA)', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13))),
                      pw.Center(child: pw.Text('MT PLATOON SENIORITY & NOMINAL ROLL (PORTRAIT) - AS ON $dateStr', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 9.5))),
                      pw.SizedBox(height: 8),
                    ],
                  ),
                  build: (pw.Context ctx) => [
                    pw.Table(
                      border: pw.TableBorder.all(color: PdfColors.black, width: 0.5),
                      children: [
                        pw.TableRow(
                          decoration: const pw.BoxDecoration(color: PdfColors.grey300),
                          children: ['SL', 'FORCE NO', 'RANK', 'NAME', 'CURRENT STATUS', 'MOBILE', 'EL', 'CL', 'PL'].map((h) => pw.Container(
                            padding: const pw.EdgeInsets.all(3),
                            alignment: pw.Alignment.center,
                            child: pw.Text(h, style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 7)),
                          )).toList(),
                        ),
                        ...MTStorage.staffList.asMap().entries.map((e) {
                          final i = e.key + 1;
                          final s = e.value;
                          final statusDisplay = MTStorage.getStaffStatusTag(s);
                          return pw.TableRow(
                            children: [
                              '$i',
                              s['force'] ?? '',
                              s['rank'] ?? '',
                              s['name'] ?? '',
                              statusDisplay,
                              s['mobile'] ?? '',
                              '${s['el_bal'] ?? ''}',
                              '${s['cl_bal'] ?? ''}',
                              '${s['pl_bal'] ?? 30}',
                            ].map((c) => pw.Container(
                              padding: const pw.EdgeInsets.symmetric(vertical: 2.5, horizontal: 2),
                              alignment: pw.Alignment.center,
                              child: pw.Text(c, style: const pw.TextStyle(fontSize: 6.5)),
                            )).toList(),
                          );
                        }).toList(),
                      ],
                    ),
                  ],
                ),
              );

              await Printing.layoutPdf(onLayout: (PdfPageFormat format) async => pdf.save());
            }

