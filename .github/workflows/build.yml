Name: Build MT GC AGT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup MT Branch App Code
        run: |
          flutter create mt_app --org com.crpf.agartala --project-name mt_app
          cd mt_app
          
          # Stable Android dependencies including path_provider and share_plus for direct PDF sharing
          flutter pub add shared_preferences intl image_picker url_launcher pdf printing http path_provider share_plus
          
          # Set App Label & Permissions
          sed -i 's/android:label="mt_app"/android:label="MT GC AGT"/g' android/app/src/main/AndroidManifest.xml
          
          # Add Internet permission and WhatsApp queries in AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <queries>\n        <package android:name="com.whatsapp" \/>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="https" \/>\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

          # Ensure minSdkVersion >= 21 for image_picker and printing
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math';
          import 'dart:typed_data';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:share_plus/share_plus.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MTStorage.init();
            runApp(const MTBranchApp());
          }

          class MTBranchApp extends StatelessWidget {
            const MTBranchApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              final loggedUser = MTStorage.getLoggedInUser();

              return MaterialApp(
                title: 'MT GC AGT',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF1B3B6F)),
                  useMaterial3: true,
                ),
                home: loggedUser != null ? DashboardScreen(currentUser: loggedUser) : const LoginScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          // ================= PERSISTENT CLOUD & LOCAL STORAGE =================
          class MTStorage {
            static late SharedPreferences prefs;
            static List<Map<String, dynamic>> staffList = [];
            static List<Map<String, dynamic>> vehicles = [];
            static List<Map<String, dynamic>> inOutLogs = [];
            static List<Map<String, dynamic>> leaves = [];
            static Map<String, String> passwords = {};
            static List<Map<String, dynamic>> paradeCustomRows = [];
            static List<String> paradeCustomColumns = [];
            static List<Map<String, dynamic>> customParadeFiles = [];
            static Map<String, dynamic> dateWiseDuties = {};
            static List<Map<String, dynamic>> notifications = [];
            static String activeAdminForce = '165060166';
            static int cloudLastUpdated = 0;

            static const String cloudStorageEndpoint = 'https://api.kvbase.io/collections/crpf_mt_gc_agt/records/master_sync';
            static Timer? _syncTimer;
            static final StreamController<bool> dataUpdateStream = StreamController<bool>.broadcast();
            static final StreamController<String> liveAlertStream = StreamController<String>.broadcast();
            static bool isSyncing = false;

            static Future<void> init() async {
              prefs = await SharedPreferences.getInstance();
              loadLocalData();
              startCloudSyncListener();
              fetchCloudSync();
            }

            // डायरेक्ट PDF सेंड करने का ग्लोबल फंक्शन
            static Future<void> sharePdf(pw.Document pdf, String fileName) async {
              try {
                final dir = await getTemporaryDirectory();
                final file = File('${dir.path}/$fileName.pdf');
                await file.writeAsBytes(await pdf.save());
                await Share.shareXFiles([XFile(file.path)], text: 'MT GC AGT: $fileName');
              } catch (e) {
                debugPrint('PDF Share Error: $e');
              }
            }

            static void loadLocalData() {
              activeAdminForce = prefs.getString('crpf_active_admin_force') ?? '165060166';

              final staffStr = prefs.getString('crpf_staff_master_v15');
              staffList = staffStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(staffStr))
                  : List<Map<String, dynamic>>.from(defaultStaff);
              sortStaffByCategoryAndSeniority();

              final vehStr = prefs.getString('crpf_veh_master_v15');
              vehicles = vehStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(vehStr))
                  : List<Map<String, dynamic>>.from(defaultVehicles);
              sortVehiclesByCategory();

              final logsStr = prefs.getString('crpf_inout_master_v15');
              inOutLogs = logsStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(logsStr))
                  : List<Map<String, dynamic>>.from(defaultLogs);

              final leavesStr = prefs.getString('crpf_leaves_master_v15');
              leaves = leavesStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(leavesStr))
                  : List<Map<String, dynamic>>.from(defaultLeaves);

              final passStr = prefs.getString('crpf_passwords_v15');
              passwords = passStr != null
                  ? Map<String, String>.from(jsonDecode(passStr))
                  : {activeAdminForce: 'Mt@$activeAdminForce'};

              final paradeColsStr = prefs.getString('crpf_parade_cols_v15');
              paradeCustomColumns = paradeColsStr != null
                  ? List<String>.from(jsonDecode(paradeColsStr))
                  : List<String>.from(defaultParadeCols);

              final paradeStr = prefs.getString('crpf_parade_custom_v15');
              paradeCustomRows = paradeStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(paradeStr))
                  : List<Map<String, dynamic>>.from(defaultParadeRows);

              final filesStr = prefs.getString('crpf_custom_parade_files_v15');
              customParadeFiles = filesStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(filesStr))
                  : [
                      {
                        'id': 'file_01',
                        'name': 'MT_PARADE_REPORT_OCT2026',
                        'type': 'EXCEL',
                        'created_date': '21/10/2026',
                        'description': 'माह अक्टूबर परेड व वाहन स्थिति शीट',
                        'headers': ['SL', 'PARTICULAR', 'AUTHORISED', 'POSTED', 'PRESENT', 'LEAVE', 'ATTACH'],
                        'rows': [
                          ['1', 'OFFICERS', '01', '01', '01', '00', '00'],
                          ['2', 'SUBORDINATE OFFICERS', '03', '03', '02', '01', '00'],
                        ],
                        'word_content': '',
                      },
                    ];

              final dutiesStr = prefs.getString('crpf_date_wise_duties_v15');
              dateWiseDuties = dutiesStr != null
                  ? Map<String, dynamic>.from(jsonDecode(dutiesStr))
                  : {
                      DateFormat('dd/MM/yyyy').format(DateTime.now()): defaultTodayDuty,
                      '21/10/2026': defaultTodayDuty,
                    };

              final notifStr = prefs.getString('crpf_notifications_v15');
              notifications = notifStr != null
                  ? List<Map<String, dynamic>>.from(jsonDecode(notifStr))
                  : [
                      {
                        'id': 'notif_1',
                        'title': 'सिस्टम ऑटो-सिंक सक्रिय',
                        'message': 'सभी 40 वाहनों, कार्मिक डायरेक्टरी व लाइव सिंक सुविधा सक्रिय है।',
                        'time': DateFormat('dd/MM/yyyy hh:mm a').format(DateTime.now()),
                      }
                    ];

              cloudLastUpdated = prefs.getInt('crpf_cloud_ts_v15') ?? 0;
            }

            static void startCloudSyncListener() {
              _syncTimer?.cancel();
              _syncTimer = Timer.periodic(const Duration(seconds: 4), (timer) async {
                await fetchCloudSync();
              });
            }

            static Future<void> fetchCloudSync() async {
              if (isSyncing) return;
              isSyncing = true;
              try {
                final response = await http.get(
                  Uri.parse(cloudStorageEndpoint),
                  headers: {'Accept': 'application/json'},
                ).timeout(const Duration(seconds: 4));

                if (response.statusCode == 200 && response.body.isNotEmpty) {
                  final data = jsonDecode(response.body);
                  int remoteTs = data['ts'] ?? 0;
                  if (remoteTs > cloudLastUpdated) {
                    cloudLastUpdated = remoteTs;
                    final oldAdmin = activeAdminForce;
                    activeAdminForce = data['admin'] ?? activeAdminForce;
                    
                    if (data['staff'] != null) staffList = List<Map<String, dynamic>>.from(data['staff']);
                    if (data['veh'] != null) vehicles = List<Map<String, dynamic>>.from(data['veh']);
                    if (data['duties'] != null) dateWiseDuties = Map<String, dynamic>.from(data['duties']);
                    if (data['logs'] != null) inOutLogs = List<Map<String, dynamic>>.from(data['logs']);
                    if (data['files'] != null) customParadeFiles = List<Map<String, dynamic>>.from(data['files']);
                    if (data['notifs'] != null) notifications = List<Map<String, dynamic>>.from(data['notifs']);
                    if (data['passwords'] != null) passwords = Map<String, String>.from(data['passwords']);

                    sortStaffByCategoryAndSeniority();
                    sortVehiclesByCategory();
                    await saveLocalData();
                    await prefs.setInt('crpf_cloud_ts_v15', cloudLastUpdated);

                    String alertMsg = data['last_change_desc'] ?? 'एडमिन द्वारा नया बदलाव किया गया है!';
                    if (oldAdmin != activeAdminForce) {
                      alertMsg = 'एडमिन अधिकार अब फोर्स सं: $activeAdminForce को सौंप दिए गए हैं!';
                    }
                    liveAlertStream.add(alertMsg);
                    dataUpdateStream.add(true);
                  }
                }
              } catch (_) {
              } finally {
                isSyncing = false;
              }
            }

            static Future<void> setLoggedInUser(String forceNo) async {
              await prefs.setString('logged_in_force_no', forceNo);
            }

            static Future<void> logout() async {
              await prefs.remove('logged_in_force_no');
            }

            static Map<String, dynamic>? getLoggedInUser() {
              final force = prefs.getString('logged_in_force_no');
              if (force == null || force.isEmpty) return null;
              try {
                return staffList.firstWhere(
                  (s) => s['force'].toString().toUpperCase() == force.toUpperCase(),
                );
              } catch (_) {
                return null;
              }
            }

            static Future<void> addNotification(String title, String message) async {
              notifications.insert(0, {
                'id': 'notif_${DateTime.now().millisecondsSinceEpoch}',
                'title': title,
                'message': message,
                'time': DateFormat('dd/MM/yyyy hh:mm a').format(DateTime.now()),
              });
              await saveData(changeDesc: '$title: $message');
            }

            static Future<void> saveData({String changeDesc = 'डेटाबेस अपडेट हुआ'}) async {
              sortStaffByCategoryAndSeniority();
              sortVehiclesByCategory();
              cloudLastUpdated = DateTime.now().millisecondsSinceEpoch;

              await saveLocalData();
              await prefs.setInt('crpf_cloud_ts_v15', cloudLastUpdated);
              dataUpdateStream.add(true);

              try {
                final payload = jsonEncode({
                  'ts': cloudLastUpdated,
                  'admin': activeAdminForce,
                  'last_change_desc': changeDesc,
                  'staff': staffList,
                  'veh': vehicles,
                  'duties': dateWiseDuties,
                  'logs': inOutLogs,
                  'files': customParadeFiles,
                  'notifs': notifications,
                  'passwords': passwords,
                });

                await http.put(
                  Uri.parse(cloudStorageEndpoint),
                  headers: {'Content-Type': 'application/json'},
                  body: payload,
                ).timeout(const Duration(seconds: 4));
              } catch (_) {}
            }

            static Future<void> saveLocalData() async {
              await prefs.setString('crpf_active_admin_force', activeAdminForce);
              await prefs.setString('crpf_staff_master_v15', jsonEncode(staffList));
              await prefs.setString('crpf_veh_master_v15', jsonEncode(vehicles));
              await prefs.setString('crpf_inout_master_v15', jsonEncode(inOutLogs));
              await prefs.setString('crpf_leaves_master_v15', jsonEncode(leaves));
              await prefs.setString('crpf_passwords_v15', jsonEncode(passwords));
              await prefs.setString('crpf_parade_cols_v15', jsonEncode(paradeCustomColumns));
              await prefs.setString('crpf_parade_custom_v15', jsonEncode(paradeCustomRows));
              await prefs.setString('crpf_custom_parade_files_v15', jsonEncode(customParadeFiles));
              await prefs.setString('crpf_date_wise_duties_v15', jsonEncode(dateWiseDuties));
              await prefs.setString('crpf_notifications_v15', jsonEncode(notifications));
            }

            static int getGroupPriority(Map<String, dynamic> staff) {
              String rank = (staff['rank'] ?? '').toString().toUpperCase().trim();
              String name = (staff['name'] ?? '').toString().toUpperCase().trim();

              if (rank == 'MTO' || name.contains('RANJEET KUMAR SINGH')) return 0;
              if (rank.contains('PTR') || rank.contains('CT/PTR')) return 5;
              if (rank.contains('HC/MMV') || rank.contains('CT/MMV') || rank.contains('DTR') || rank.contains('MMV') || (staff['role'] ?? '').toString().contains('WORKSHOP')) return 4;
              if (rank.contains('INSP') || rank.contains('SI/MT') || rank.contains('ASI/MT') || rank.contains('SI/MM') || rank.contains('ASI/MM')) return 1;
              if (rank.contains('HC/DVR')) return 2;
              if (rank.contains('CT/DVR')) return 3;
              return 4;
            }

            static int getSeniorityYear(String forceNo) {
              if (forceNo.length < 2) return 9999;
              int prefix = int.tryParse(forceNo.substring(0, 2)) ?? 99;
              return prefix >= 50 ? (1900 + prefix) : (2000 + prefix);
            }

            static void sortStaffByCategoryAndSeniority() {
              staffList.sort((a, b) {
                int pA = getGroupPriority(a);
                int pB = getGroupPriority(b);
                if (pA != pB) return pA.compareTo(pB);

                int yearA = getSeniorityYear(a['force'].toString());
                int yearB = getSeniorityYear(b['force'].toString());
                if (yearA != yearB) return yearA.compareTo(yearB);

                return a['force'].toString().compareTo(b['force'].toString());
              });
            }

            static int getVehicleCategoryPriority(String category) {
              String cat = category.toUpperCase();
              if (cat.contains('LIGHT') || cat.contains('(LV)')) return 1;
              if (cat.contains('MEDIUM') || cat.contains('(MV)')) return 2;
              if (cat.contains('HEAVY') || cat.contains('(HV)')) return 3;
              if (cat.contains('SPECIAL') || cat.contains('(SV)')) return 4;
              return 2;
            }

            static void sortVehiclesByCategory() {
              vehicles.sort((a, b) {
                int pA = getVehicleCategoryPriority(a['category'] ?? '');
                int pB = getVehicleCategoryPriority(b['category'] ?? '');
                if (pA != pB) return pA.compareTo(pB);
                return (a['no'] ?? '').toString().compareTo((b['no'] ?? '').toString());
              });
            }

            static String getStaffStatusTag(Map<String, dynamic> s) {
              String st = (s['status'] ?? 'PRESENT').toString().toUpperCase();
              if (['EL', 'CL', 'PL', 'LEAVE', 'MEDICAL'].contains(st)) {
                int days = s['leave_days'] ?? 15;
                return 'LEAVE: $st ($days दिन)';
              } else if (st == 'ATTACHED') {
                String off = (s['attach_office'] ?? '').toString();
                return off.isNotEmpty ? 'ATTACHED: $off' : 'ATTACHED';
              } else if (st == 'COURSE') {
                String c = (s['course_name'] ?? 'COURSE').toString();
                return 'COURSE: $c';
              }
              return 'PRESENT';
            }

